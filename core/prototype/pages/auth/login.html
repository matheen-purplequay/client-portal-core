<!DOCTYPE html>
<html lang="en">
<head>
<title>Login · Client Portal</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script src="../../assets/js/tailwind-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/app.css">
<script src="../../assets/js/core.js"></script>
</head>
<body class="min-h-screen bg-panel">
<div class="grid min-h-screen place-items-center p-4">
  <div class="w-full max-w-md rounded-3xl bg-white p-8 shadow-xl">
    <img src="../../assets/img/cs_logo.png" alt="Carisma Solutions" class="mx-auto mb-6 h-9 w-auto">
    <h1 class="text-center text-xl font-semibold">👋 Welcome</h1>
    <p class="mb-6 text-center text-sm text-slate-500">Please login into your account</p>
    <form id="form" class="space-y-4" novalidate>
      <label class="block text-sm font-semibold">Email
        <input id="email" type="email" placeholder="Your email address" class="mt-1 w-full rounded-lg border-slate-300 focus:border-brand focus:ring-brand"></label>
      <label class="block text-sm font-semibold">Password
        <input id="password" type="password" placeholder="Your password" class="mt-1 w-full rounded-lg border-slate-300 focus:border-brand focus:ring-brand"></label>
      <p id="error" class="hidden rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700"></p>
      <button class="w-full rounded-full bg-brand py-2.5 font-semibold text-white hover:bg-brand-dark">Send OTP to Email</button>
      <p class="text-center text-sm"><a href="#" class="text-brand hover:underline">Forgot password?</a></p>
    </form>
    <div class="mt-6 border-t pt-4">
      <p class="mb-2 text-center text-[11px] uppercase tracking-wide text-slate-400">Prototype · autofill demo credentials</p>
      <div class="grid grid-cols-2 gap-2">
        <button type="button" data-fill="olivia.bennett@northwind.example" class="rounded-xl border px-3 py-2 text-left text-xs hover:bg-brand-lighter">
          <span class="block font-bold text-brand">Northwind Advisory</span><span class="text-slate-500">Business Services · SMSF · Bookkeeping</span></button>
        <button type="button" data-fill="daniel.reyes@harbourline.example" class="rounded-xl border px-3 py-2 text-left text-xs hover:bg-brand-lighter">
          <span class="block font-bold text-brand">Harbourline Wealth</span><span class="text-slate-500">Financial Planning · Bookkeeping</span></button>
      </div>
    </div>
  </div>
</div>
<script>
  const err = document.getElementById('error');
  document.querySelectorAll('[data-fill]').forEach((b) => b.onclick = () => { email.value = b.dataset.fill; password.value = 'Client@123'; err.classList.add('hidden'); });
  form.onsubmit = async (e) => {
    e.preventDefault();
    const r = await CP.login(email.value, password.value);
    if (!r.ok) { err.textContent = r.message; err.classList.remove('hidden'); return; }
    location.href = 'otp.html';
  };
</script>
</body>
</html>
