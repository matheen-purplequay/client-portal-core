<div class="container mb-3">
    <div class="row">
        <div class="col-sm-11">

            <ng-container *ngIf="isGettingQueriesCounts">
                <div class="text-center">
                    <app-simple-loading-text>Getting query statistics...</app-simple-loading-text>
                </div>
            </ng-container>

            <ng-container *ngIf="!isGettingQueriesCounts">
                <div class="hstack gap-4 align-items-center justify-content-center">
    
                    <!-- Query Status Cards -->
                    <div>
                        <div class="opacity-75">Query Status</div>
                        <div class="hstack align-items-stretch bg-white shadow-sm rounded overflow-hidden">
                            <ng-container *ngFor="let queryCount of queryCounts.status; let index = index; let first = first; let last = last;">
                                <div class="query-count-card-wrapper border-top-0 border-start-0 border-end-0" [ngClass]="getMetaDataClass(queryCount.meta_Data)">
                                    <div class="p-2 query-count-card" [ngClass]="{ 'rounded-start': first, 'rounded-end': last }">
                                        <div class="fs-4">{{ queryCount.count }}</div>
                                        <div class="small fw-medium">{{ queryCount.label }}</div>
                                    </div>
                                </div>
                                <div *ngIf="!last" class="bg-light">&nbsp;</div>
                            </ng-container>
                        </div>
                    </div>
                    <!-- End of Query Status Cards -->
    
                    <div>
                        <div class="opacity-75">&nbsp;</div>
                        <div class="rounded-pill bg-color-lighter-gradient opacity-10 py-3"></div>
                    </div>
    
                    <!-- Aging Cards -->
                    <div>
                        <div class="opacity-75">Query Aging</div>
                        <div class="hstack align-items-stretch bg-white shadow-sm rounded overflow-hidden">
                            <ng-container *ngFor="let queryCount of queryCounts.aging; let index = index; let first = first; let last = last;">
                                <div class="query-count-card-wrapper border-top-0 border-start-0 border-end-0" [ngClass]="queryCount.label">
                                    <div class="p-2 border-bottom query-count-card" [ngClass]="{ 'rounded-start': first, 'rounded-end': last }">
                                        <div class="fs-4">{{ queryCount.count }}</div>
                                        <div class="small fw-medium">{{ queryCount.label }}</div>
                                    </div>
                                </div>
                                <div *ngIf="!last" class="bg-light">&nbsp;</div>
                            </ng-container>
                        </div>
                    </div>
                    <!-- End of Aging Cards -->
    
                    <div>
                        <div class="opacity-75">&nbsp;</div>
                        <div class="rounded-pill bg-color-lighter-gradient opacity-10 py-3"></div>
                    </div>
    
                    <!-- Criticality Cards -->
                    <div>
                        <div class="opacity-75">Query Criticality</div>
                        <div class="hstack align-items-stretch bg-white shadow-sm rounded overflow-hidden">
                            <ng-container *ngFor="let queryCount of queryCounts.criticality; let index = index; let first = first; let last = last;">
                                <div class="query-count-card-wrapper border-top-0 border-start-0 border-end-0" [ngClass]="getMetaDataClass(queryCount.meta_Data)">
                                    <div
                                        class="p-2 query-count-card" [ngClass]="{ 'rounded-start': first, 'rounded-end': last }">
                                        <div class="fs-4">{{ queryCount.count }}</div>
                                        <div class="small fw-medium">{{ queryCount.label }}</div>
                                    </div>
                                </div>
                                <div *ngIf="!last" class="bg-light">&nbsp;</div>
                            </ng-container>
                        </div>
                    </div>
                    <!-- End of Criticality Cards -->
    
                </div>
            </ng-container>

        </div>
    </div>
</div>
