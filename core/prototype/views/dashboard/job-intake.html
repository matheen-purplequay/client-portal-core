<div x-data="jobIntakePage">
  <div x-show="loading" class="py-24 text-center text-sm text-slate-400">Loading…</div>
  <template x-if="!loading">
    <div>
      <div class="mb-4 flex flex-wrap items-start justify-between gap-3">
        <div>
          <h1 class="text-xl font-semibold leading-tight">Job Intake</h1>
          <p class="text-[13px] text-slate-500">Collecting documents from your clients, before a job is allocated to Carisma.</p>
        </div>
        <button class="flex items-center gap-1 rounded-full bg-brand px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-brand-dark" @click="openNew()">
          <span class="msym !text-[18px]">add</span>New Job</button>
      </div>

      <div class="mb-4 grid grid-cols-2 gap-3 lg:grid-cols-4">
        <template x-for="s in ['collecting', 'urgent', 'queued', 'ready']" :key="s">
          <button class="rounded-xl border bg-white p-4 text-left shadow-sm transition hover:-translate-y-0.5" :class="status === s && 'ring-2 ring-brand'" @click="setTile(s)">
            <div class="text-sm text-slate-500" x-text="label(s)"></div>
            <div class="mt-1 text-3xl font-semibold" :class="{ amber: 'text-amber-600', red: 'text-red-700', blue: 'text-blue-700', green: 'text-green-700' }[meta[s].tone]" x-text="count(s)"></div>
          </button>
        </template>
      </div>

      <!-- folder tabs (same pattern as the Jobs page: a permanent list tab + one tab per opened job) -->
      <div class="ml-4 flex items-end gap-1">
        <button class="rounded-t-lg px-4 py-2 text-left text-[11px] font-bold leading-tight" :class="active === 'list' ? 'bg-brand text-white' : 'bg-slate-200 text-slate-600'" @click="active = 'list'">Job Intake<br><span>All jobs</span></button>
        <template x-for="(id, i) in open" :key="id">
          <div class="flex items-center gap-2 rounded-t-lg px-3 py-2 text-[11px] font-bold leading-tight" :class="active === id ? 'bg-navy text-white' : 'bg-slate-300 text-slate-700'">
            <button class="max-w-[170px] truncate text-left" @click="active = id"><span x-text="(i + 1) + '. ' + jobOf(id).client_name"></span><br><span class="font-semibold opacity-80" x-text="jobOf(id).profession_label"></span></button>
            <button @click="closeJob(id)"><span class="msym !text-[16px]">close</span></button>
          </div>
        </template>
      </div>

      <!-- jobs list -->
      <div x-show="active === 'list'" class="rounded-2xl border border-brand bg-white">
        <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 px-3 py-2">
          <div class="relative">
            <div class="text-[11px] font-bold text-slate-600">Show Columns</div>
            <button class="flex items-center gap-1 text-[11px] font-semibold" @click.stop="tbl.colsOpen = !tbl.colsOpen">
              <span x-text="tbl.selectedCount + '/' + tbl.columns.length + ' selected'"></span><span class="msym !text-[16px]">expand_more</span></button>
            <div x-show="tbl.colsOpen" @click.outside="tbl.colsOpen = false" x-transition class="absolute left-0 z-30 mt-1 max-h-72 w-60 overflow-y-auto rounded-lg bg-white p-2 shadow-xl ring-1 ring-black/5">
              <template x-for="c in tbl.columns" :key="c.key">
                <label class="flex items-center gap-2 rounded px-2 py-1 text-[13px] hover:bg-slate-50"><input type="checkbox" class="rounded border-slate-300 text-brand focus:ring-brand" x-model="tbl.visible[c.key]"><span x-text="c.label"></span></label>
              </template>
            </div>
          </div>
          <div class="flex flex-wrap items-center gap-3">
            <div x-show="statusLabel" class="flex items-center gap-2 rounded-md bg-slate-100 px-2 py-1 text-[11px] leading-tight text-slate-500">
              <div><div>Status</div><div class="text-[13px] font-semibold text-navy" x-text="statusLabel"></div></div>
              <button @click="clearStatus()" class="text-slate-400 hover:text-brand"><span class="msym !text-[16px]">close</span></button>
            </div>
            <!-- Stage / Waiting on / Step — "Show Columns"-style toggle buttons, adapted from the reference
                 (Accounting firm dropdown dropped: this page is already scoped to one firm, the logged-in client) -->
            <template x-for="f in [['stage', 'Stage', stageOpts, stageFilter, stageLabel], ['waitingOn', 'Waiting on', waitingOpts, waitingOnFilter, waitingLabel], ['step', 'Step', stepOpts, stepFilter, stepLabel]]" :key="f[0]">
              <div class="relative">
                <div class="text-[11px] font-bold text-slate-600" x-text="f[1]"></div>
                <button class="flex items-center gap-1 text-[11px] font-semibold" @click.stop="filterOpen = filterOpen === f[0] ? null : f[0]">
                  <span x-text="f[4]"></span><span class="msym !text-[16px]">expand_more</span></button>
                <div x-show="filterOpen === f[0]" @click.outside="filterOpen = null" x-transition class="absolute left-0 z-30 mt-1 w-56 overflow-y-auto rounded-lg bg-white p-2 shadow-xl ring-1 ring-black/5">
                  <template x-for="o in f[2]" :key="o.value">
                    <button type="button" class="flex w-full items-center gap-2 rounded px-2 py-1 text-left text-[13px] hover:bg-slate-50" :class="f[3] === o.value && 'font-semibold text-brand'" @click="pick(f[0] === 'waitingOn' ? 'waitingOnFilter' : f[0] + 'Filter', o.value)">
                      <span class="msym !text-[16px]" x-text="f[3] === o.value ? 'radio_button_checked' : 'radio_button_unchecked'"></span><span x-text="o.label"></span>
                    </button>
                  </template>
                </div>
              </div>
            </template>
            <div class="relative flex items-center rounded-full bg-slate-100 px-1">
              <button class="btn-soft !text-slate-700" @click="refresh()"><span class="msym !text-[16px]" :class="refreshing && 'animate-spin'">sync</span><span x-text="refreshing ? 'Refreshing...' : 'Refresh'"></span></button>
              <button class="btn-soft !text-slate-700" @click="CP.download('Job Intake list')"><span class="msym !text-[16px]">download</span>Download</button>
            </div>
            <label class="flex items-center gap-2 rounded-full bg-slate-100 px-3 py-1.5"><span class="msym text-slate-500">search</span>
              <input type="search" placeholder="Search..." class="w-44 border-0 bg-transparent p-0 text-[13px] focus:ring-0" x-model="tbl.q" @input="tbl.reset()"></label>
          </div>
        </div>
        <div class="overflow-x-auto">
          <table class="tbl min-w-full">
            <thead><tr><template x-for="c in tbl.cols" :key="c.key"><th @click="tbl.sortBy(c.key)"><span x-text="c.label"></span><span x-show="tbl.sortKey === c.key" class="text-[9px]" x-text="tbl.dir > 0 ? ' ▲' : ' ▼'"></span></th></template></tr></thead>
            <tbody>
              <template x-for="r in tbl.slice" :key="r.intake_id">
                <tr class="cursor-pointer" @click="openJob(r, $event)">
                  <template x-for="c in tbl.cols" :key="c.key">
                    <td :class="c.bold && 'link font-medium'">
                      <template x-if="c.key === 'status'"><span class="inline-block rounded-full px-2.5 py-0.5 text-xs font-medium" :class="{ amber: 'bg-amber-100 text-amber-800', red: 'bg-red-100 text-red-800', blue: 'bg-blue-100 text-blue-800', green: 'bg-green-100 text-green-800' }[tone(r)]" x-text="label(r.status)"></span></template>
                      <template x-if="c.key === 'completion_pct'"><div class="flex items-center gap-2"><div class="h-2 w-20 rounded-full bg-slate-100"><div class="h-2 rounded-full" :class="{ amber: 'bg-amber-500', red: 'bg-red-600', blue: 'bg-blue-500', green: 'bg-green-600' }[tone(r)]" :style="'width:' + r.completion_pct + '%'"></div></div><span x-text="r.completion_pct + '%'"></span></div></template>
                      <template x-if="c.key === 'mandatory_missing'"><span :class="r.mandatory_missing ? 'font-semibold text-red-600' : 'text-slate-400'" x-text="r.mandatory_missing || '—'"></span></template>
                      <template x-if="c.key === 'priority'"><span x-text="r.priority ? ('#' + r.priority) : '—'"></span></template>
                      <template x-if="c.truncate"><span class="block max-w-[170px] truncate" :title="cell(r, c)" x-text="cell(r, c)"></span></template>
                      <template x-if="!c.truncate && !['status', 'completion_pct', 'mandatory_missing', 'priority'].includes(c.key)"><span x-text="cell(r, c)"></span></template>
                    </td>
                  </template>
                </tr>
              </template>
            </tbody>
          </table>
          <div x-show="!tbl.total" class="py-10 text-center text-sm text-slate-400">No jobs match the current filters.</div>
        </div>
        <div x-component="'pagination-status'"></div>
      </div>

      <!-- job detail tab: left = documents + timeline, right = job details / completeness / reminders -->
      <template x-if="active !== 'list' && job">
        <div class="fade-in overflow-hidden rounded-2xl border border-navy bg-white">
          <div class="flex flex-wrap items-center gap-3 border-b px-4 py-3">
            <button class="flex items-center gap-1 rounded-full bg-slate-100 px-4 py-1.5 text-sm font-medium hover:bg-slate-200" @click="closeJob(active)"><span class="msym">close</span>Close</button>
            <div class="border-l pl-4">
              <div class="text-lg font-bold text-navy" x-text="job.client_name"></div>
              <div class="text-[11px] font-bold text-slate-500" x-text="job.job_title"></div>
            </div>
            <span class="ml-auto inline-block rounded-full px-2.5 py-0.5 text-xs font-medium" :class="{ amber: 'bg-amber-100 text-amber-800', red: 'bg-red-100 text-red-800', blue: 'bg-blue-100 text-blue-800', green: 'bg-green-100 text-green-800' }[tone(job)]" x-text="label(job.status)"></span>
          </div>

          <div class="grid gap-4 p-4 lg:grid-cols-[1fr_300px]">
            <!-- left column -->
            <div class="min-w-0 space-y-4">
              <!-- Customer follow-up documents (still needed) -->
              <div class="rounded-xl border p-4">
                <h4 class="mb-2 text-xs font-bold uppercase tracking-wide text-slate-400">Customer follow-up documents</h4>
                <template x-if="stillNeeded.length">
                  <div class="divide-y rounded-xl border">
                    <template x-for="c in stillNeeded" :key="c.key">
                      <div class="flex flex-wrap items-center gap-3 px-3 py-2.5">
                        <span class="w-6 shrink-0 rounded text-center text-[10px] font-bold" :class="{ M: 'bg-red-100 text-red-700', E: 'bg-amber-100 text-amber-800', I: 'bg-blue-100 text-blue-700' }[c.weight]" x-text="c.weight"></span>
                        <div class="min-w-[160px] flex-1"><div class="text-sm font-medium text-slate-700" x-text="c.doc"></div><div class="text-[11px] text-slate-400" x-text="c.category + ' · ' + c.reason"></div></div>
                        <div class="flex shrink-0 flex-wrap gap-1.5">
                          <button class="rounded-md border px-2 py-1 text-[11px] font-semibold text-slate-600 hover:border-brand hover:text-brand" @click="markReceived(job, c, false)">Client sent it</button>
                          <button class="rounded-md border px-2 py-1 text-[11px] font-semibold text-slate-600 hover:border-brand hover:text-brand" @click="markReceived(job, c, true)">Upload</button>
                          <button class="rounded-md px-2 py-1 text-[11px] font-semibold text-slate-400 hover:text-brand" @click="markNA(job, c)">Doesn't apply</button>
                        </div>
                      </div>
                    </template>
                  </div>
                </template>
                <p x-show="!stillNeeded.length" class="text-sm text-slate-400">Nothing left to follow up — every document is in or marked not applicable.</p>

                <!-- Add a document to the checklist -->
                <div class="mt-3 rounded-xl border border-dashed p-3">
                  <h5 class="mb-2 text-[11px] font-bold uppercase tracking-wide text-slate-400">Add a document to the checklist (optional)</h5>
                  <div class="flex flex-wrap gap-2">
                    <input class="min-w-[180px] flex-1 rounded-lg border-slate-300 text-sm focus:border-brand focus:ring-brand" placeholder="e.g. Letter from employer about travel" x-model="newDoc.name" @keydown.enter="addChecklistItem(job)">
                    <select class="rounded-lg border-slate-300 text-sm focus:border-brand focus:ring-brand" x-model="newDoc.weight"><option value="M">Mandatory</option><option value="E">Essential</option><option value="I">Info</option></select>
                    <button class="rounded-md bg-slate-800 px-3 py-1.5 text-xs font-semibold text-white hover:bg-slate-700" @click="addChecklistItem(job)">Add to checklist</button>
                  </div>
                </div>

                <!-- Doesn't apply (collapsed into this card so the follow-up/received split stays the headline) -->
                <template x-if="notApplicable.length">
                  <div class="mt-3">
                    <h5 class="mb-1 text-[11px] font-bold uppercase tracking-wide text-slate-400">Doesn't apply</h5>
                    <div class="divide-y rounded-xl border">
                      <template x-for="c in notApplicable" :key="c.key">
                        <div class="flex items-center gap-3 px-3 py-2 text-sm text-slate-400">
                          <span class="msym !text-[16px]">block</span>
                          <span class="flex-1 line-through" x-text="c.doc"></span>
                          <button class="text-slate-300 hover:text-brand" title="Undo" @click="markMissing(job, c)"><span class="msym !text-[16px]">undo</span></button>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>
              </div>

              <!-- Received documents -->
              <div class="rounded-xl border p-4">
                <h4 class="mb-2 text-xs font-bold uppercase tracking-wide text-slate-400">Received documents</h4>
                <template x-if="received.length">
                  <div class="divide-y rounded-xl border">
                    <template x-for="c in received" :key="c.key">
                      <div class="flex items-center gap-3 px-3 py-2 text-sm">
                        <span class="msym !text-[16px] text-green-600">check_circle</span>
                        <span class="flex-1 text-slate-700" x-text="c.doc"></span>
                        <span x-show="c.file" class="text-[11px] text-slate-400" x-text="c.file"></span>
                        <button class="text-slate-300 hover:text-brand" title="Mark as not received" @click="markMissing(job, c)"><span class="msym !text-[16px]">undo</span></button>
                      </div>
                    </template>
                  </div>
                </template>
                <p x-show="!received.length" class="text-sm text-slate-400">No documents received yet.</p>
              </div>

              <!-- Timeline -->
              <div class="rounded-xl border p-4">
                <h4 class="mb-2 text-xs font-bold uppercase tracking-wide text-slate-400">Timeline</h4>
                <div class="flex flex-nowrap items-center gap-2 overflow-x-auto pb-1">
                  <template x-for="(t, i) in timeline(job)" :key="i">
                    <div class="flex shrink-0 items-center gap-2">
                      <div x-show="i > 0" class="flex shrink-0 items-center gap-2 rounded-full bg-slate-100 px-3 py-1.5 text-sm text-slate-600"><b x-text="i > 0 ? CP.daysBetween(timeline(job)[i - 1].on, t.on) : 0"></b> day<span class="msym !text-[16px]">arrow_forward</span></div>
                      <div class="min-w-[150px] rounded-md bg-slate-50 px-3 py-2"><div class="text-sm font-semibold text-slate-700" x-text="t.status"></div><div class="mt-1 text-right text-xs text-slate-500" x-text="CP.fmt.dmy(t.on)"></div></div>
                    </div>
                  </template>
                </div>
              </div>
            </div>

            <!-- right column -->
            <div class="space-y-4">
              <!-- Basic job details -->
              <div class="rounded-xl border p-4">
                <h4 class="mb-2 text-xs font-bold uppercase tracking-wide text-slate-400">Job details</h4>
                <dl class="space-y-2 text-sm">
                  <div class="flex items-start justify-between gap-2"><dt class="text-slate-500">Job</dt><dd class="text-right font-medium" x-text="job.job_title"></dd></div>
                  <div class="flex items-start justify-between gap-2"><dt class="text-slate-500">Customer</dt><dd class="text-right font-medium" x-text="job.client_name"></dd></div>
                  <div class="flex items-start justify-between gap-2"><dt class="text-slate-500">Profession</dt><dd class="text-right font-medium" x-text="job.profession_label"></dd></div>
                  <div class="flex items-start justify-between gap-2"><dt class="text-slate-500">Intake ID</dt><dd class="text-right font-medium" x-text="job.intake_id"></dd></div>
                  <div x-show="job.priority" class="flex items-start justify-between gap-2"><dt class="text-slate-500">Queue position</dt><dd class="text-right font-medium" x-text="'#' + job.priority"></dd></div>
                </dl>
              </div>

              <!-- Document completeness -->
              <div class="rounded-xl border p-4">
                <h4 class="mb-3 text-xs font-bold uppercase tracking-wide text-slate-400">Document completeness</h4>
                <div class="flex items-center gap-4">
                  <div class="gauge shrink-0" :style="'background: conic-gradient(' + toneHex(job) + ' calc(' + job.completion_pct + '*1%), #eef0f4 0)'">
                    <div><b class="block text-2xl font-semibold leading-none" x-text="job.completion_pct + '%'"></b><span class="mt-1 block text-[10px] leading-none text-slate-400">weighted</span></div>
                  </div>
                  <div class="flex-1">
                    <p class="mb-2 text-sm font-semibold" :class="readyMsg(job).cls" x-text="readyMsg(job).text"></p>
                    <div class="space-y-1 text-sm">
                      <template x-for="w in ['M', 'E', 'I']" :key="w">
                        <div class="flex items-center justify-between">
                          <span class="flex items-center gap-2"><span class="w-5 shrink-0 rounded text-center text-[10px] font-bold" :class="{ M: 'bg-red-100 text-red-700', E: 'bg-amber-100 text-amber-800', I: 'bg-blue-100 text-blue-700' }[w]" x-text="w"></span><span x-text="{ M: 'Mandatory', E: 'Essential', I: 'Info' }[w]"></span></span>
                          <span class="font-medium text-slate-600" x-text="job.counts[w].rec + ' / ' + job.counts[w].tot"></span>
                        </div>
                      </template>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Reminder details -->
              <div class="rounded-xl border p-4">
                <h4 class="mb-3 text-xs font-bold uppercase tracking-wide text-slate-400">Reminder details</h4>
                <div class="grid grid-cols-3 gap-2 text-center text-sm">
                  <div><div class="text-xl font-semibold text-slate-700" x-text="job.reminders_sent + ' of 5'"></div><div class="text-[11px] text-slate-400">Sent</div></div>
                  <div><div class="text-xl font-semibold text-slate-700" x-text="nextReminder(job)"></div><div class="text-[11px] text-slate-400">Next</div></div>
                  <div><div class="text-xl font-semibold text-slate-700" x-text="daysInStage(job)"></div><div class="text-[11px] text-slate-400">In Stage 1</div></div>
                </div>
                <button class="mt-3 w-full rounded-md border px-3 py-1.5 text-xs font-semibold text-slate-600 hover:border-brand hover:text-brand" @click="remind(job)"><span class="msym !text-[15px] align-middle">mail</span> Send reminder</button>
              </div>

              <!-- Actions -->
              <div class="flex flex-wrap gap-2">
                <template x-if="job.status === 'queued'">
                  <span class="inline-flex items-center gap-1">
                    <button class="rounded-md border px-2 py-1.5 text-xs font-semibold text-slate-500 hover:border-brand hover:text-brand" @click="move(job, -1)">▲ Move up</button>
                    <button class="rounded-md border px-2 py-1.5 text-xs font-semibold text-slate-500 hover:border-brand hover:text-brand" @click="move(job, 1)">▼ Move down</button>
                  </span>
                </template>
                <button x-show="job.status === 'ready'" class="rounded-md border border-blue-300 bg-blue-50 px-3 py-1.5 text-xs font-semibold text-blue-700 hover:bg-blue-100" @click="queueIt(job)">Move to prioritisation queue</button>
                <button x-show="job.status === 'queued' || job.status === 'ready'" class="w-full rounded-md bg-brand px-3 py-1.5 text-xs font-semibold text-white hover:bg-brand-dark" @click="allocate(job)">Allocate to Carisma</button>
              </div>
            </div>
          </div>
        </div>
      </template>

      <div x-show="showNew" x-transition.opacity class="fixed inset-0 z-40 flex items-center justify-center bg-black/30 p-4" @click.self="showNew = false">
        <div class="w-full max-w-md rounded-xl bg-white p-5 shadow-xl">
          <h3 class="mb-3 text-lg font-semibold">New Job</h3>
          <form class="space-y-3" @submit.prevent="createJob()">
            <label class="block text-xs font-semibold text-slate-500">Client name
              <input required class="mt-1 w-full rounded-lg border-slate-300 text-sm focus:border-brand focus:ring-brand" x-model="form.name" placeholder="e.g. Jack Thompson"></label>
            <label class="block text-xs font-semibold text-slate-500">Profession
              <select class="mt-1 w-full rounded-lg border-slate-300 text-sm focus:border-brand focus:ring-brand" x-model="form.profession">
                <template x-for="p in professions" :key="p.id"><option :value="p.id" x-text="p.label"></option></template>
              </select></label>
            <label class="block text-xs font-semibold text-slate-500">Notes (optional)
              <textarea rows="2" class="mt-1 w-full rounded-lg border-slate-300 text-sm focus:border-brand focus:ring-brand" x-model="form.notes"></textarea></label>
            <p class="text-[11px] text-slate-400">Starts the job and creates its document checklist from the chosen profession. The client will need to provide each item before the job can be allocated to Carisma.</p>
            <div class="flex justify-end gap-2 pt-1">
              <button type="button" class="rounded-md px-3 py-1.5 text-sm text-slate-500" @click="showNew = false">Cancel</button>
              <button class="rounded-md bg-brand px-4 py-1.5 text-sm font-semibold text-white hover:bg-brand-dark">Create job</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </template>
</div>
