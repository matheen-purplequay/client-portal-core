  /* ---- step 12–13 ---- */
  prio(arg) { const [id, d] = arg.split("|"), job = J(id), q = S.jobs.filter(j => j.firm === job.firm && j.step === 12).sort((a, b) => a.priority - b.priority), i = q.indexOf(job), o = q[i + +d]; if (!o) return; [job.priority, o.priority] = [o.priority, job.priority]; log(job, 12, me(), "Moved to position " + job.priority + " in the queue"); commit("Queue order updated."); },
  allocate(id) { const job = J(id); if (!need(job)) return; act(job, () => DO.allocate(job, me()), "Allocated to Carisma."); },
  /* ---- step 17–19 ---- */
  wmXpm(id) { const job = J(id); UI.ex["wm_" + id] = { cluster: CLUSTERS[hash(id) % 3], cm: "Olivia Bennett", processor: CARISMA_TEAM[hash(id) % 4], reviewer: CARISMA_TEAM[4 + hash(id) % 4], due: new Date(NOW() + 10 * DAY).toISOString().slice(0, 10), hours: 3 }; ["wmCl_", "wmCm_", "wmPr_", "wmRv_"].forEach(k => delete UI.cv[k + id]); render(); toast("Pulled from the XPM job (demo). Check and save."); },
  wmSave(id) {
    const job = J(id); if (!need(job)) return;
    const d = { cluster: UI.cv["wmCl_" + id], cm: UI.cv["wmCm_" + id], processor: UI.cv["wmPr_" + id], reviewer: UI.cv["wmRv_" + id], due: val("wmDue_" + id), hours: val("wmHr_" + id) };
    const miss = [["cluster", "Cluster"], ["processor", "Processor"], ["reviewer", "Reviewer"], ["due", "Due date"]].filter(([k]) => !d[k]).map(x => x[1]);
    if (miss.length) { toast("Please fill: " + miss.join(", ") + ".", "bad"); return; }
    if (d.processor === d.reviewer) { toast("The processor and reviewer must be different people.", "bad"); return; }
    delete UI.ex["wm_" + id]; act(job, () => DO.wmDetails(job, me(), d), "WM job details saved.");
  },
  initiate(id) { const job = J(id); if (!need(job)) return; act(job, () => DO.initiate(job, me()), "ITR process initiated."); },
  lateSample(id) { const job = J(id); DO.extraUpload(job, me(), ["Late-" + (job.client.salary ? "second-job-income-statement" : "bank-interest-letter") + "-FY26.pdf"]); commit("Late document uploaded."); },
  continueDetect(id) { const job = J(id); if (!need(job)) return; act(job, () => DO.continueDetect(job, me()), "Documents confirmed."); },
  /* ---- step 22 ---- */
  redact(arg) {
    const [id, fid] = arg.split("|"), job = J(id), f = job.files.find(x => x.id === fid), a = amountFor(job, f.itemKey);
    modal("Redaction Tool — " + f.name, `<p class="small muted">Text read from the image with personal details masked (mock).</p><div class="mailbody">${esc(ITEMS[f.itemKey] ? ITEMS[f.itemKey].doc : "Document")}\nName: ${esc(job.client.first)} ████████\nTFN: ███ ███ ███\nAccount: ██-███-████\nDate: 14/03/2026\nTotal (GST incl.): ${money(a)}</div><p>Suggested amount: <b>${money(a)}</b> → ${esc(KEY_ITR[f.itemKey] || "Item 24 Other income")}</p>`, [{ label: "Cancel", act: "closeModal" }, { label: "Use " + money(a), act: "useRedact", arg: fid + "|" + a, primary: true }]);
  },
  useRedact(arg) { const [fid, a] = arg.split("|"); UI.ex["x_" + fid] = { amount: +a, method: "Redaction Tool" }; closeAll(); render(); toast("Amount filled from the Redaction Tool."); },
  redactAll(id) { const job = J(id); unstructured(job).forEach(f => UI.ex["x_" + f.id] = { amount: amountFor(job, f.itemKey), method: "Redaction Tool" }); render(); toast("All amounts filled with the Redaction Tool — check them before saving."); },
  extract(id) {
    const job = J(id); if (!need(job)) return; const vals = {}; let bad = 0;
    unstructured(job).forEach(f => { const inp = $(`[data-xamt="${f.id}"]`), v = inp ? inp.value : ""; if (v === "" || +v < 0) bad++; vals[f.id] = { amount: +v, label: UI.cv["xl_" + f.id] || KEY_ITR[f.itemKey], method: (UI.ex["x_" + f.id] || {}).method || "Manual" }; });
    if (bad) { toast("Enter an amount for every file (" + bad + " missing). Use 0 if there is nothing to claim.", "bad"); return; }
    act(job, () => DO.extractManual(job, me(), vals), "Saved to the Tax information summary.");
  },
  /* ---- step 25–29 ---- */
  qdel(arg) { const [id, qid] = arg.split("|"), job = J(id); job.queries = job.queries.filter(q => q.id !== qid); commit("Query removed."); },
  qadd(id) { const job = J(id), t = val("qnew_" + id); if (!t) { toast("Type the question first.", "bad"); return; } job.queries.push({ id: uid("q"), aud: UI.cv["qnewa_" + id] || "client", text: t, def: "Answer to follow.", tis: "Noted: " + t.slice(0, 50), ans: "", status: "draft", files: [], by: null }); commit("Query added."); },
  sendQ(id) { const job = J(id); if (!need(job)) return; if (!job.queries.length) { toast("Add at least one query.", "bad"); return; } act(job, () => DO.sendQueries(job, me()), "Queries sent via the Query portal."); },
  qdef(qid) { const el = $(`[data-qans="${qid}"]`); const q = S.jobs.flatMap(j => j.queries).find(x => x.id === qid); if (el && q) { el.value = q.def; q.ans = q.def; save(); } },
  firmAns(id) {
    const job = J(id); if (!need(job)) return; const ans = {}; let empty = 0;
    job.queries.filter(q => q.aud === "firm").forEach(q => { const el = $(`[data-qans="${q.id}"]`); ans[q.id] = el ? el.value.trim() : q.ans; if (!ans[q.id]) empty++; });
    if (empty) { toast("Answer every firm query (" + empty + " empty), or use the sample answer.", "bad"); return; }
    act(job, () => DO.firmAnswers(job, me(), ans), "Answers saved; end-client queries forwarded.");
  },
  recordClient(id) {
    const job = J(id); if (!need(job)) return; const ans = {}; let empty = 0;
    job.queries.filter(q => q.aud === "client").forEach(q => { const el = $(`[data-qans="${q.id}"]`); ans[q.id] = el ? el.value.trim() : ""; if (!ans[q.id]) empty++; });
    if (empty) { toast("Record an answer for every question (" + empty + " empty).", "bad"); return; }
    act(job, () => DO.clientAnswers(job, me() + " (for the client)", ans), "Client's answers recorded.");
  },
  forward(id) { const job = J(id); if (!need(job)) return; job.queries.forEach(q => { const el = $(`[data-qans="${q.id}"]`); if (el) q.ans = el.value.trim() || q.ans; }); act(job, () => DO.forward(job, me()), "Forwarded to Carisma."); },
  updTis(id) { const job = J(id); if (!need(job)) return; const ids = $$("[data-tisq]").filter(c => c.checked).map(c => c.dataset.tisq); act(job, () => DO.updateTIS(job, me(), ids), "TIS updated."); },
  /* ---- step 31–33 ---- */
  reviewOk(id) { const job = J(id); if (!need(job)) return; const un = $$("[data-rp]").filter(c => !c.checked).length; if (un) { toast("Tick every review point (" + un + " left) — or choose Not OK.", "bad"); return; } act(job, () => DO.reviewWP(job, me(), true), "Review passed."); },
  reviewNo(id) { const job = J(id); if (!need(job)) return; const n = val("rvnote_" + id); if (!n) { toast("Say what is wrong, so the re-run can fix it.", "bad"); $("#rvnote_" + id).focus(); return; } act(job, () => DO.reviewWP(job, me(), false, n), "Sent back: re-run from step 23."); },
  sendWP(id) { const job = J(id); if (!need(job)) return; act(job, () => DO.sendWP(job, me()), "Workpaper sent to the firm."); },
  /* ---- step 34, 38 ---- */
  s3sample(id) { UI.ex["s3_" + id] = (UI.ex["s3_" + id] || []).concat(["End-client-notes-" + FY + ".docx"]); render(); },
  startReview(id) { const job = J(id); if (!need(job)) return; const cl = UI.cv["cl_" + id] || suggestChecklist(job); const files = UI.ex["s3_" + id] || []; delete UI.ex["s3_" + id]; act(job, () => DO.selectChecklist(job, me(), cl, val("s3n_" + id), files), "Agent review started."); },
  fixGaps(id) { const job = J(id); if (!need(job)) return; const notes = $$("[data-gfix]").map(i => i.value.trim()); act(job, () => DO.fixGaps(job, me(), notes), "Gaps fixed; Stage 2 re-run from step 23."); },
  /* ---- scheduler ---- */
  saveRule() {
    const n = k => +val("r_" + k), r = { first: n("first"), every: n("every"), max: n("max"), escalateAfter: n("esc"), skipWeekends: (UI.cv.rSkip || "yes") === "yes", time: UI.cv.rTime || "09:00" };
    if ([r.first, r.every, r.max, r.escalateAfter].some(x => !(x >= 1 && x <= 30))) { toast("Each number must be between 1 and 30.", "bad"); return; }
    if (r.escalateAfter > r.max) { toast("Escalate after cannot be more than the maximum number of reminders.", "bad"); return; }
    S.settings.rule = r; commit("Global reminder rule saved.");
  },
  firmRule(arg) { const [f, on] = arg.split("|"); if (on === "on") S.settings.firmRules[f] = { first: 1, every: 2, max: 6 }; else delete S.settings.firmRules[f]; commit(on === "on" ? "Custom rule on for " + firmOf(f).name + "." : firmOf(f).name + " uses the global rule."); },
  /* ---- end-client link ---- */
  otp(token) { const c = UI.client[token], v = val("otp"); if (v === c.code) { c.ok = true; c.err = false; render(); toast("Thanks — you're verified.", "good"); } else { c.tries = (c.tries || 0) + 1; c.err = true; if (c.tries >= 3) { c.code = null; c.tries = 0; toast("Too many tries. We sent you a new code.", "bad"); } render(); } },
  otpResend(token) { UI.client[token].code = null; UI.client[token].tries = 0; UI.client[token].err = false; render(); toast("New code sent."); },
  cdef(arg) { const [token, qid] = arg.split("|"), q = S.jobs.flatMap(j => j.queries).find(x => x.id === qid); UI.client[token]["a_" + qid] = q.def; render(); },
  clientSend(token) {
    const job = S.jobs.find(j => j.token === token), c = UI.client[token], cq = job.queries.filter(q => q.aud === "client");
    const ans = {}, files = {}; let empty = 0;
    cq.forEach(q => { ans[q.id] = (c["a_" + q.id] || "").trim(); files[q.id] = c["f_" + q.id] || []; if (!ans[q.id]) empty++; });
    if (empty) { toast("Please answer every question (" + empty + " left). If you don't know, just say so.", "bad"); return; }
    DO.clientAnswers(job, job.client.first + " " + job.client.last + " (secure link)", ans, files);
    mail(job, "firm", firmOf(job.firm).email, job.client.first + " " + job.client.last + " answered " + cq.length + " queries", "The end client answered the queries for " + job.name + ". Please check them and forward to Carisma (step 28).", "Client answered");
    commit("Your answers were sent. Thank you!");
  }
};

/* ---------- global listeners ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  if (el.tagName === "A" && el.getAttribute("href") && el.getAttribute("href") !== "#" && !el.dataset.arg) return;
  e.preventDefault(); const f = A[el.dataset.act]; if (f) f(el.dataset.arg, el, e);
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.file) return onFiles(t.dataset.file, t.dataset.arg, Array.from(t.files || []).map(f => f.name));
  if (t.dataset.qtext) { const q = S.jobs.flatMap(j => j.queries).find(x => x.id === t.dataset.qtext); if (q) { q.text = t.value; save(); } }
  if (t.dataset.qans) { const q = S.jobs.flatMap(j => j.queries).find(x => x.id === t.dataset.qans); if (q) { q.ans = t.value; save(); } }
  if (t.dataset.fok) { const job = J(UI.arg); const f = job && job.fields.find(x => x.k === t.dataset.fok); if (f) { f.ok = t.checked; save(); } }
  if (t.dataset.xamt) { UI.ex["x_" + t.dataset.xamt] = Object.assign(UI.ex["x_" + t.dataset.xamt] || { method: "Manual" }, { amount: t.value === "" ? null : +t.value }); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.cans) { const tok = UI.arg; UI.client[tok]["a_" + t.dataset.cans] = t.value; }
  if (t.dataset.input === "search" || t.dataset.input === "gsearch") {
    UI.f[t.dataset.input === "search" ? "q" : "gq"] = t.value; const pos = t.selectionStart, id = t.id; render();
    const n = document.getElementById(id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) { } }
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeAll(); });
["dragover", "dragleave", "drop"].forEach(ev => document.addEventListener(ev, e => {
  const z = e.target.closest && e.target.closest(".drop"); if (!z) return; e.preventDefault();
  z.classList.toggle("over", ev === "dragover");
  if (ev === "drop") { const inp = $("input[type=file]", z); if (inp) onFiles(inp.dataset.file, inp.dataset.arg, Array.from(e.dataTransfer.files).map(f => f.name)); }
}));
function onFiles(kind, arg, names) {
  if (!names.length) return;
  const [id, k] = (arg || "").split("|"), job = J(id);
  const bad = names.filter(n => !/\.(pdf|docx?|xlsx?|csv|jpe?g|png|heic|txt)$/i.test(n));
  if (bad.length) toast("Not accepted: " + bad.join(", ") + ". Use PDF, Word, Excel, CSV or a photo.", "bad");
  names = names.filter(n => !bad.includes(n)); if (!names.length) return;
  switch (kind) {
    case "st2py": UI.st2[id].py = names[0]; break;
    case "st2cy": UI.st2[id].cy = names[0]; break;
    case "st2docs": UI.st2[id].files = UI.st2[id].files.concat(names.map(n => ({ name: n, structured: !/\.(jpe?g|png|heic)$/i.test(n) }))); break;
    case "addFor": { if (!need(job)) return; const f = addFile(job, { name: names[0], kind: "added", by: me(), key: k, conf: .9, structured: !/\.(jpe?g|png|heic)$/i.test(names[0]) }); f.round = job.loops.s1 + 1; log(job, 8, me(), "Uploaded " + names[0] + " for " + ITEMS[k].doc); save(); break; }
    case "addAny": { if (!need(job)) return; names.forEach(n => { const f = addFile(job, { name: n, kind: "added", by: me(), structured: !/\.(jpe?g|png|heic)$/i.test(n) }); f.round = job.loops.s1 + 1; }); log(job, 8, me(), "Uploaded " + names.length + " file(s)"); save(); break; }
    case "late": DO.extraUpload(job, me(), names); save(); break;
    case "qfile": { const q = job.queries.find(x => x.id === k); q.files.push(...names); save(); break; }
    case "s3file": UI.ex["s3_" + id] = (UI.ex["s3_" + id] || []).concat(names); break;
    case "cfile": { const c = UI.client[id]; c["f_" + k] = (c["f_" + k] || []).concat(names); break; }
  }
  render(); toast(names.length + " file(s) added: " + names.join(", "));
}
window.addEventListener("hashchange", () => { closeAll(); render(); });
function boot() {
  load();
  if (S.customItems) Object.assign(ITEMS, S.customItems);
  $("#scrim").addEventListener("click", closeAll);
  $("#drawer .dh button").addEventListener("click", closeAll);
  $("#modal .mh button").addEventListener("click", closeAll);
  render();
}
boot();

</script>
</body></html>
