<div x-data="content('client', 'reports')" class="mx-auto max-w-[1100px]"><template x-if="data"><div>
<h1 class="mb-1 flex items-center gap-2 text-2xl font-semibold text-brand"><span class="msym !text-[28px]">folder_open</span>Reports</h1><p class="mb-5 text-sm text-slate-500">Download your monthly, weekly and billing documents.</p>
<div class="mb-4 flex gap-2"><a href="#/reports/connect" class="pill-tab" :class="$store.app.route === '/reports/connect' && 'active'">Monthly Connect</a><a href="#/reports/weekly" class="pill-tab" :class="$store.app.route === '/reports/weekly' && 'active'">Weekly Report</a><a href="#/reports/invoices" class="pill-tab" :class="$store.app.route === '/reports/invoices' && 'active'">Invoices</a></div><label class="mb-3 flex w-72 items-center gap-2 rounded-full bg-white px-3 py-1.5 shadow-sm"><span class="msym text-slate-400">search</span><input type="search" placeholder="Search…" class="w-full border-0 bg-transparent p-0 text-[13px] focus:ring-0" x-model="q" @input="page = 1"></label>
<div class="card overflow-hidden"><table class="tbl w-full"><thead class="bg-slate-50"><tr><th>Report</th><th>Week starting</th><th>Size</th><th></th></tr></thead>
  <tbody><template x-for="r in pageItems(data.weekly)" :key="r.id"><tr><td class="font-semibold"><span class="msym mr-1 text-brand">date_range</span><span x-text="r.title"></span></td><td x-text="fmt.dmy(r.week_start)"></td><td x-text="r.size"></td>
    <td><button class="btn-soft border border-brand-light" @click="CP.download(r.title)">Download</button></td></tr></template></tbody></table></div>
<div class="mt-3 flex items-center justify-between text-sm text-slate-500"><button class="rounded-full bg-white px-3 py-1 shadow-sm disabled:opacity-40" :disabled="page <= 1" @click="page--">Previous</button><span x-text="'Page ' + page + ' of ' + pages(data.weekly)"></span><button class="rounded-full bg-white px-3 py-1 shadow-sm disabled:opacity-40" :disabled="page >= pages(data.weekly)" @click="page++">Next</button></div>
</div></template></div>
