<div x-data="jobIntakePage">
  <div x-show="loading" class="py-24 text-center text-sm text-slate-400">Loading…</div>
  <template x-if="!loading">
    <div>
      <div class="mb-4 flex flex-wrap items-start justify-between gap-3">
        <div>
          <h1 class="text-xl font-semibold leading-tight">Job Intake</h1>
          <p class="text-[13px] text-slate-500">Collecting documents from your clients, before a job is allocated to Carisma.</p>
        </div>
        <button class="flex items-center gap-1 rounded-full bg-brand px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-brand-dark" @click="openNew()">
          <span class="msym !text-[18px]">add</span>New Job</button>
      </div>

      <div class="mb-4 grid grid-cols-2 gap-3 lg:grid-cols-4">
        <template x-for="s in ['collecting', 'urgent', 'queued', 'ready']" :key="s">
          <button class="rounded-xl border bg-white p-4 text-left shadow-sm transition hover:-translate-y-0.5" :class="status === s && 'ring-2 ring-brand'" @click="setTile(s)">
            <div class="text-sm text-slate-500" x-text="label(s)"></div>
            <div class="mt-1 text-3xl font-semibold" :class="{ amber: 'text-amber-600', red: 'text-red-700', blue: 'text-blue-700', green: 'text-green-700' }[meta[s].tone]" x-text="count(s)"></div>
          </button>
        </template>
      </div>

      <div class="rounded-2xl border border-brand bg-white">
        <div x-component="'table-toolbar'"></div>
        <div class="overflow-x-auto">
          <table class="tbl min-w-full">
            <thead><tr><template x-for="c in tbl.cols" :key="c.key"><th @click="tbl.sortBy(c.key)"><span x-text="c.label"></span><span x-show="tbl.sortKey === c.key" class="text-[9px]" x-text="tbl.dir > 0 ? ' ▲' : ' ▼'"></span></th></template></tr></thead>
            <tbody>
              <template x-for="r in tbl.slice" :key="r.intake_id">
                <tr class="cursor-pointer" @click="openJob(r)">
                  <template x-for="c in tbl.cols" :key="c.key">
                    <td :class="c.bold && 'link font-medium'">
                      <template x-if="c.key === 'status'"><span class="inline-block rounded-full px-2.5 py-0.5 text-xs font-medium" :class="{ amber: 'bg-amber-100 text-amber-800', red: 'bg-red-100 text-red-800', blue: 'bg-blue-100 text-blue-800', green: 'bg-green-100 text-green-800' }[tone(r)]" x-text="label(r.status)"></span></template>
                      <template x-if="c.key === 'completion_pct'"><div class="flex items-center gap-2"><div class="h-2 w-20 rounded-full bg-slate-100"><div class="h-2 rounded-full" :class="{ amber: 'bg-amber-500', red: 'bg-red-600', blue: 'bg-blue-500', green: 'bg-green-600' }[tone(r)]" :style="'width:' + r.completion_pct + '%'"></div></div><span x-text="r.completion_pct + '%'"></span></div></template>
                      <template x-if="c.key === 'mandatory_missing'"><span :class="r.mandatory_missing ? 'font-semibold text-red-600' : 'text-slate-400'" x-text="r.mandatory_missing || '—'"></span></template>
                      <template x-if="c.key === 'priority'"><span x-text="r.priority ? ('#' + r.priority) : '—'"></span></template>
                      <template x-if="!['status', 'completion_pct', 'mandatory_missing', 'priority'].includes(c.key)"><span x-text="cell(r, c)"></span></template>
                    </td>
                  </template>
                </tr>
              </template>
            </tbody>
          </table>
          <div x-show="!tbl.total" class="py-10 text-center text-sm text-slate-400">No jobs match the current filters.</div>
        </div>
        <div x-component="'pagination-status'"></div>
      </div>

      <!-- checklist + actions drawer -->
      <div x-show="view" x-transition.opacity class="fixed inset-0 z-40 flex justify-end bg-black/30" @click.self="closeJob()" @keydown.escape.window="closeJob()">
        <template x-if="view">
          <div class="h-full w-full max-w-xl overflow-y-auto bg-white p-5 shadow-xl">
            <div class="mb-4 flex items-start justify-between">
              <div>
                <h3 class="text-lg font-semibold" x-text="view.client_name"></h3>
                <p class="text-xs text-slate-500" x-text="view.profession_label"></p>
                <div class="mt-1 flex items-center gap-2">
                  <span class="inline-block rounded-full px-2.5 py-0.5 text-xs font-medium" :class="{ amber: 'bg-amber-100 text-amber-800', red: 'bg-red-100 text-red-800', blue: 'bg-blue-100 text-blue-800', green: 'bg-green-100 text-green-800' }[tone(view)]" x-text="label(view.status)"></span>
                  <span x-show="view.priority" class="rounded-full bg-slate-100 px-2 py-0.5 text-[11px] font-semibold text-slate-500" x-text="'Queue #' + view.priority"></span>
                </div>
              </div>
              <button @click="closeJob()"><span class="msym">close</span></button>
            </div>

            <!-- Document completeness -->
            <div class="mb-4 rounded-xl border p-4">
              <h4 class="mb-3 text-xs font-bold uppercase tracking-wide text-slate-400">Document completeness</h4>
              <div class="flex items-center gap-5">
                <div class="gauge shrink-0" :style="'background: conic-gradient(' + toneHex(view) + ' calc(' + view.completion_pct + '*1%), #eef0f4 0)'">
                  <div><b class="text-2xl font-semibold" x-text="view.completion_pct + '%'"></b><span class="block text-[10px] text-slate-400">weighted</span></div>
                </div>
                <div class="flex-1">
                  <p class="mb-2 text-sm font-semibold" :class="readyMsg(view).cls" x-text="readyMsg(view).text"></p>
                  <div class="space-y-1 text-sm">
                    <template x-for="w in ['M', 'E', 'I']" :key="w">
                      <div class="flex items-center justify-between">
                        <span class="flex items-center gap-2"><span class="w-5 shrink-0 rounded text-center text-[10px] font-bold" :class="{ M: 'bg-red-100 text-red-700', E: 'bg-amber-100 text-amber-800', I: 'bg-blue-100 text-blue-700' }[w]" x-text="w"></span><span x-text="{ M: 'Mandatory', E: 'Essential', I: 'Info' }[w]"></span></span>
                        <span class="font-medium text-slate-600" x-text="view.counts[w].rec + ' / ' + view.counts[w].tot"></span>
                      </div>
                    </template>
                  </div>
                </div>
              </div>
            </div>

            <!-- Reminders & timers -->
            <div class="mb-4 grid grid-cols-3 gap-2 rounded-xl border p-4 text-center text-sm">
              <div><div class="text-2xl font-semibold text-slate-700" x-text="view.reminders_sent + ' of 5'"></div><div class="text-[11px] text-slate-400">Reminders sent</div></div>
              <div><div class="text-2xl font-semibold text-slate-700" x-text="nextReminder(view)"></div><div class="text-[11px] text-slate-400">Next reminder</div></div>
              <div><div class="text-2xl font-semibold text-slate-700" x-text="daysInStage(view)"></div><div class="text-[11px] text-slate-400">Time in Stage 1</div></div>
            </div>
            <div class="mb-4 flex justify-end"><button class="rounded-md border px-3 py-1.5 text-xs font-semibold text-slate-600 hover:border-brand hover:text-brand" @click="remind(view)"><span class="msym !text-[15px] align-middle">mail</span> Send reminder</button></div>

            <!-- Still needed -->
            <template x-if="stillNeeded.length">
              <div class="mb-4">
                <h4 class="mb-2 text-xs font-bold uppercase tracking-wide text-slate-400">Still needed</h4>
                <div class="divide-y rounded-xl border">
                  <template x-for="c in stillNeeded" :key="c.key">
                    <div class="flex flex-wrap items-center gap-3 px-3 py-2.5">
                      <span class="w-6 shrink-0 rounded text-center text-[10px] font-bold" :class="{ M: 'bg-red-100 text-red-700', E: 'bg-amber-100 text-amber-800', I: 'bg-blue-100 text-blue-700' }[c.weight]" x-text="c.weight"></span>
                      <div class="min-w-[160px] flex-1"><div class="text-sm font-medium text-slate-700" x-text="c.doc"></div><div class="text-[11px] text-slate-400" x-text="c.category + ' · ' + c.reason"></div></div>
                      <div class="flex shrink-0 flex-wrap gap-1.5">
                        <button class="rounded-md border px-2 py-1 text-[11px] font-semibold text-slate-600 hover:border-brand hover:text-brand" @click="markReceived(view, c, false)">Client sent it</button>
                        <button class="rounded-md border px-2 py-1 text-[11px] font-semibold text-slate-600 hover:border-brand hover:text-brand" @click="markReceived(view, c, true)">Upload</button>
                        <button class="rounded-md px-2 py-1 text-[11px] font-semibold text-slate-400 hover:text-brand" @click="markNA(view, c)">Doesn't apply</button>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>

            <!-- Add a document to the checklist -->
            <div class="mb-4 rounded-xl border border-dashed p-3">
              <h4 class="mb-2 text-xs font-bold uppercase tracking-wide text-slate-400">Add a document to the checklist (optional)</h4>
              <div class="flex flex-wrap gap-2">
                <input class="min-w-[180px] flex-1 rounded-lg border-slate-300 text-sm focus:border-brand focus:ring-brand" placeholder="e.g. Letter from employer about travel" x-model="newDoc.name" @keydown.enter="addChecklistItem(view)">
                <select class="rounded-lg border-slate-300 text-sm focus:border-brand focus:ring-brand" x-model="newDoc.weight"><option value="M">Mandatory</option><option value="E">Essential</option><option value="I">Info</option></select>
                <button class="rounded-md bg-slate-800 px-3 py-1.5 text-xs font-semibold text-white hover:bg-slate-700" @click="addChecklistItem(view)">Add to checklist</button>
              </div>
            </div>

            <!-- Received -->
            <template x-if="received.length">
              <div class="mb-4">
                <h4 class="mb-2 text-xs font-bold uppercase tracking-wide text-slate-400">Received</h4>
                <div class="divide-y rounded-xl border">
                  <template x-for="c in received" :key="c.key">
                    <div class="flex items-center gap-3 px-3 py-2 text-sm">
                      <span class="msym !text-[16px] text-green-600">check_circle</span>
                      <span class="flex-1 text-slate-700" x-text="c.doc"></span>
                      <span x-show="c.file" class="text-[11px] text-slate-400" x-text="c.file"></span>
                      <button class="text-slate-300 hover:text-brand" title="Mark as not received" @click="markMissing(view, c)"><span class="msym !text-[16px]">undo</span></button>
                    </div>
                  </template>
                </div>
              </div>
            </template>

            <!-- Not applicable -->
            <template x-if="notApplicable.length">
              <div class="mb-4">
                <h4 class="mb-2 text-xs font-bold uppercase tracking-wide text-slate-400">Doesn't apply</h4>
                <div class="divide-y rounded-xl border">
                  <template x-for="c in notApplicable" :key="c.key">
                    <div class="flex items-center gap-3 px-3 py-2 text-sm text-slate-400">
                      <span class="msym !text-[16px]">block</span>
                      <span class="flex-1 line-through" x-text="c.doc"></span>
                      <button class="text-slate-300 hover:text-brand" title="Undo" @click="markMissing(view, c)"><span class="msym !text-[16px]">undo</span></button>
                    </div>
                  </template>
                </div>
              </div>
            </template>

            <div class="flex flex-wrap gap-2 border-t pt-4">
              <template x-if="view.status === 'queued'">
                <span class="inline-flex items-center gap-1">
                  <button class="rounded-md border px-2 py-1.5 text-xs font-semibold text-slate-500 hover:border-brand hover:text-brand" @click="move(view, -1)">▲ Move up</button>
                  <button class="rounded-md border px-2 py-1.5 text-xs font-semibold text-slate-500 hover:border-brand hover:text-brand" @click="move(view, 1)">▼ Move down</button>
                </span>
              </template>
              <button x-show="view.status === 'ready'" class="rounded-md border border-blue-300 bg-blue-50 px-3 py-1.5 text-xs font-semibold text-blue-700 hover:bg-blue-100" @click="queueIt(view)">Move to prioritisation queue</button>
              <button x-show="view.status === 'queued' || view.status === 'ready'" class="rounded-md bg-brand px-3 py-1.5 text-xs font-semibold text-white hover:bg-brand-dark" @click="allocate(view)">Allocate to Carisma</button>
            </div>
          </div>
        </template>
      </div>

      <div x-show="showNew" x-transition.opacity class="fixed inset-0 z-40 flex items-center justify-center bg-black/30 p-4" @click.self="showNew = false">
        <div class="w-full max-w-md rounded-xl bg-white p-5 shadow-xl">
          <h3 class="mb-3 text-lg font-semibold">New Job</h3>
          <form class="space-y-3" @submit.prevent="createJob()">
            <label class="block text-xs font-semibold text-slate-500">Client name
              <input required class="mt-1 w-full rounded-lg border-slate-300 text-sm focus:border-brand focus:ring-brand" x-model="form.name" placeholder="e.g. Jack Thompson"></label>
            <label class="block text-xs font-semibold text-slate-500">Profession
              <select class="mt-1 w-full rounded-lg border-slate-300 text-sm focus:border-brand focus:ring-brand" x-model="form.profession">
                <template x-for="p in professions" :key="p.id"><option :value="p.id" x-text="p.label"></option></template>
              </select></label>
            <label class="block text-xs font-semibold text-slate-500">Notes (optional)
              <textarea rows="2" class="mt-1 w-full rounded-lg border-slate-300 text-sm focus:border-brand focus:ring-brand" x-model="form.notes"></textarea></label>
            <p class="text-[11px] text-slate-400">Starts the job and creates its document checklist from the chosen profession. The client will need to provide each item before the job can be allocated to Carisma.</p>
            <div class="flex justify-end gap-2 pt-1">
              <button type="button" class="rounded-md px-3 py-1.5 text-sm text-slate-500" @click="showNew = false">Cancel</button>
              <button class="rounded-md bg-brand px-4 py-1.5 text-sm font-semibold text-white hover:bg-brand-dark">Create job</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </template>
</div>
