<div x-data="jobStatusPage">
  <div x-show="loading" class="py-24 text-center text-sm text-slate-400">Loading…</div>
  <template x-if="!loading">
    <div>
      <!-- Job Status summary: landing view, replaced by the detail view below once a card is clicked -->
      <div x-show="view === 'summary'">
        <div class="mb-4">
          <h1 class="text-2xl font-bold text-slate-800">Job Status</h1>
          <p class="text-sm text-slate-500">Select a status to view the jobs within it.</p>
        </div>
        <div class="mb-4 grid gap-4 sm:grid-cols-2">
          <button type="button" class="rounded-xl border-t-4 border-brand bg-white p-5 text-left shadow-sm transition hover:shadow-md" @click="openOpenJobs()">
            <div class="mb-3 flex items-start justify-between">
              <span class="grid h-11 w-11 place-items-center rounded-lg bg-rose-50 text-brand"><span class="msym !text-2xl">folder_open</span></span>
              <div class="text-right">
                <div class="ml-auto mb-1 h-0.5 w-6 bg-brand"></div>
                <div class="text-2xl font-bold text-slate-800" x-text="liveCount"></div>
                <div class="text-[10px] font-semibold uppercase text-slate-400">Open</div>
              </div>
            </div>
            <div class="text-base font-bold text-brand">Open Jobs</div>
            <p class="mt-1 text-xs text-slate-500">Jobs still in progress, split by the party currently holding the job.</p>
            <div class="my-3 border-t border-slate-100"></div>
            <div class="flex gap-8">
              <div><div class="text-[10px] font-semibold uppercase text-slate-400">With Carisma</div><div class="text-lg font-bold text-brand" x-text="withCarismaCount"></div></div>
              <div><div class="text-[10px] font-semibold uppercase text-slate-400">With Client</div><div class="text-lg font-bold text-brand" x-text="withClientCount"></div></div>
            </div>
          </button>
          <button type="button" class="rounded-xl border-t-4 border-green-600 bg-white p-5 text-left shadow-sm transition hover:shadow-md" @click="openClosedJobs()">
            <div class="mb-3 flex items-start justify-between">
              <span class="grid h-11 w-11 place-items-center rounded-lg bg-green-50 text-green-600"><span class="msym !text-2xl">check_circle</span></span>
              <div class="text-right">
                <div class="ml-auto mb-1 h-0.5 w-6 bg-green-600"></div>
                <div class="text-2xl font-bold text-slate-800" x-text="closedCount"></div>
                <div class="text-[10px] font-semibold uppercase text-slate-400">Closed</div>
              </div>
            </div>
            <div class="text-base font-bold text-green-700">Closed Jobs</div>
            <p class="mt-1 text-xs text-slate-500">Completed and delivered jobs, searchable by a date range.</p>
            <div class="my-3 border-t border-slate-100"></div>
            <div class="flex gap-8">
              <div><div class="text-[10px] font-semibold uppercase text-slate-400">This Month</div><div class="text-lg font-bold text-green-700" x-text="closedThisMonth"></div></div>
              <div><div class="text-[10px] font-semibold uppercase text-slate-400">Last Month</div><div class="text-lg font-bold text-green-700" x-text="closedLastMonth"></div></div>
            </div>
          </button>
        </div>
      </div>

      <!-- Job Status detail: shown after a summary card is clicked -->
      <div x-show="view === 'detail'" x-cloak>
        <button type="button" class="mb-3 flex items-center gap-1 text-xs font-semibold text-slate-500 hover:text-brand" @click="view = 'summary'"><span class="msym !text-[16px]">arrow_back</span>Back to Job Status</button>

        <!-- Open Jobs by Holder: drill-down shown when arriving via the Open Jobs card; each card also filters the list below via the existing legend toggle -->
        <div x-show="openBreakdown" class="mb-4">
          <div class="mb-3 flex flex-wrap items-start justify-between gap-3">
            <div>
              <h2 class="text-lg font-bold text-slate-800">Open Jobs by Holder</h2>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <div x-show="isManager" class="inline-flex rounded-full border border-slate-200 bg-white p-0.5 shadow-sm">
                <button type="button" class="rounded-full px-3 py-0.5 text-xs font-semibold transition" :class="viewMode === 'status' ? 'bg-brand text-white shadow' : 'text-slate-600 hover:text-brand'" @click="viewMode = 'status'">Status View</button>
                <button type="button" class="rounded-full px-3 py-0.5 text-xs font-semibold transition" :class="viewMode === 'manager' ? 'bg-brand text-white shadow' : 'text-slate-600 hover:text-brand'" @click="viewMode = 'manager'">Manager View</button>
              </div>
              <div class="inline-flex shrink-0 overflow-hidden rounded-md border border-slate-300 bg-white shadow-sm">
                <template x-for="v in verticals" :key="v.code">
                  <button class="border-r border-slate-200 px-3 py-1 text-xs font-medium last:border-0" :class="vertical === v.title ? 'bg-[#e8ebf5] text-navy' : 'text-slate-700 hover:bg-slate-50'" @click="setVertical(v.title)" x-text="v.title"></button>
                </template>
              </div>
            </div>
          </div>
          <div class="grid gap-4 sm:grid-cols-2">
            <button type="button" class="rounded-xl border-t-4 bg-white p-5 text-left shadow-sm transition hover:shadow-md" :class="legend === 'carisma' ? 'border-navy ring-1 ring-navy' : 'border-navy'" @click="setLegend(legend === 'carisma' ? null : 'carisma')">
              <div class="mb-3 flex items-start justify-between">
                <span class="grid h-11 w-11 place-items-center rounded-lg bg-[#e8ebf5] text-navy"><span class="msym !text-2xl">settings</span></span>
                <div class="text-right">
                  <div class="text-2xl font-bold text-navy" x-text="withCarismaCount"></div>
                  <div class="text-[10px] font-semibold uppercase text-slate-400">Jobs</div>
                </div>
              </div>
              <div class="text-base font-bold text-navy">With Carisma</div>
            </button>
            <button type="button" class="rounded-xl border-t-4 bg-white p-5 text-left shadow-sm transition hover:shadow-md" :class="legend === 'client' ? 'border-brand ring-1 ring-brand' : 'border-brand'" @click="setLegend(legend === 'client' ? null : 'client')">
              <div class="mb-3 flex items-start justify-between">
                <span class="grid h-11 w-11 place-items-center rounded-lg bg-rose-50 text-brand"><span class="msym !text-2xl">send</span></span>
                <div class="text-right">
                  <div class="text-2xl font-bold text-brand" x-text="withClientCount"></div>
                  <div class="text-[10px] font-semibold uppercase text-slate-400">Jobs</div>
                </div>
              </div>
              <div class="text-base font-bold text-brand">With Client</div>
            </button>
          </div>
        </div>

      <!-- Job Details (dev: status/manager view cards); the Status/Manager toggle, legends and vertical control now live in the Open Jobs by Holder header above -->
      <div class="space-y-2">
        <!-- Closed Jobs: Status/Manager toggle + verticals, and (in Status View) a date-range filter instead of the status tiles -->
        <div x-show="status === 'closed'" class="mb-2 flex flex-wrap items-center justify-end gap-2">
          <div x-show="isManager" class="inline-flex rounded-full border border-slate-200 bg-white p-0.5 shadow-sm">
            <button type="button" class="rounded-full px-3 py-0.5 text-xs font-semibold transition" :class="viewMode === 'status' ? 'bg-brand text-white shadow' : 'text-slate-600 hover:text-brand'" @click="viewMode = 'status'">Status View</button>
            <button type="button" class="rounded-full px-3 py-0.5 text-xs font-semibold transition" :class="viewMode === 'manager' ? 'bg-brand text-white shadow' : 'text-slate-600 hover:text-brand'" @click="viewMode = 'manager'">Manager View</button>
          </div>
          <div class="inline-flex shrink-0 overflow-hidden rounded-md border border-slate-300 bg-white shadow-sm">
            <template x-for="v in verticals" :key="v.code">
              <button class="border-r border-slate-200 px-3 py-1 text-xs font-medium last:border-0" :class="vertical === v.title ? 'bg-[#e8ebf5] text-navy' : 'text-slate-700 hover:bg-slate-50'" @click="setVertical(v.title)" x-text="v.title"></button>
            </template>
          </div>
        </div>
        <div x-show="viewMode === 'status' && status === 'closed'" class="flex flex-wrap items-end gap-3 rounded-lg border border-slate-200 bg-white p-3 shadow-sm">
          <label class="block text-xs"><span class="font-medium text-slate-600">From</span><input type="date" class="field mt-1 block" x-model="closedFrom" @change="tbl.reset()"></label>
          <label class="block text-xs"><span class="font-medium text-slate-600">To</span><input type="date" class="field mt-1 block" x-model="closedTo" @change="tbl.reset()"></label>
          <button type="button" class="rounded-md border border-slate-300 px-3 py-1.5 text-xs font-semibold text-slate-600 hover:bg-slate-50" @click="closedFrom = ''; closedTo = ''; tbl.reset()">Clear</button>
          <span class="text-xs text-slate-500"><span class="font-semibold text-slate-700" x-text="rows.length"></span> closed jobs</span>
        </div>

        <!-- status tiles: one even grid (equal widths, rows line up); side bar = who holds the job -->
        <div x-show="viewMode === 'status' && status !== 'closed'" class="grid gap-2" style="grid-template-columns: repeat(auto-fill, minmax(146px, 1fr));">
          <template x-for="t in shownTiles" :key="t.key">
            <button type="button" class="relative flex min-h-[52px] items-center justify-between gap-2 overflow-hidden rounded-lg border-l-4 bg-white py-2 pl-3 pr-2.5 text-left shadow-sm transition hover:shadow active:scale-[0.99]" :class="[t.tone === 'y' ? 'border-brand' : t.tone === 'g' ? 'border-green-500' : 'border-navy', status === t.key ? 'ring-1 ring-brand bg-brand/5' : '']" @click="setStatus(status === t.key ? 'live' : t.key)">
              <span class="text-[10px] font-semibold uppercase leading-tight tracking-wide" :class="status === t.key ? 'text-brand' : 'text-slate-600'" x-text="t.label"></span>
              <span class="text-lg font-bold leading-none" :class="status === t.key ? 'text-brand' : 'text-slate-800'" x-text="count(t)"></span>
            </button>
          </template>
          <template x-if="legend === null && liveCount > 0">
            <button type="button" class="relative flex min-h-[52px] items-center justify-between gap-2 overflow-hidden rounded-lg border-l-4 border-brand bg-white py-2 pl-3 pr-2.5 text-left shadow-sm transition hover:shadow active:scale-[0.99]" :class="status === 'live' ? 'ring-1 ring-brand bg-brand/5' : ''" @click="setStatus('live')">
              <span class="text-[10px] font-semibold uppercase leading-tight tracking-wide" :class="status === 'live' ? 'text-brand' : 'text-navy'" x-text="'Total Live Jobs'"></span>
              <span class="text-lg font-bold leading-none" :class="status === 'live' ? 'text-brand' : 'text-navy'" x-text="liveCount"></span>
            </button>
          </template>
          <template x-if="legend === null && allCount > 0">
            <button type="button" class="relative flex min-h-[52px] items-center justify-between gap-2 overflow-hidden rounded-lg border-l-4 border-brand bg-white py-2 pl-3 pr-2.5 text-left shadow-sm transition hover:shadow active:scale-[0.99]" :class="status === 'all' ? 'ring-1 ring-brand bg-brand/5' : ''" @click="setStatus('all')">
              <span class="text-[10px] font-semibold uppercase leading-tight tracking-wide" :class="status === 'all' ? 'text-brand' : 'text-navy'" x-text="'Total All Jobs'"></span>
              <span class="text-lg font-bold leading-none" :class="status === 'all' ? 'text-brand' : 'text-navy'" x-text="allCount"></span>
            </button>
          </template>
        </div>

        <!-- Manager view: Partner Wise Jobs -->
        <div x-show="viewMode === 'manager'" class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
          <div class="bg-brand px-4 py-3 font-bold text-white">Partner Wise Jobs</div>
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead><tr class="bg-rose-50"><th class="px-4 py-2 text-left font-semibold text-brand">Job Status</th>
                <template x-for="p in partners" :key="p"><th class="whitespace-nowrap px-4 py-2 text-center font-semibold text-brand" x-text="p"></th></template><th class="px-4 py-2 text-center font-semibold text-brand">Total</th></tr></thead>
              <tbody>
                <tr class="border-b border-slate-100 font-semibold"><td class="px-4 py-2">All Status</td>
                  <template x-for="p in partners" :key="p"><td class="px-4 py-2 text-center text-brand" x-text="partnerTotal(p)"></td></template><td class="px-4 py-2 text-center" x-text="allCount"></td></tr>
                <template x-for="r in gridRows" :key="r.t.key">
                  <tr class="border-b border-slate-100 hover:bg-slate-50"><td class="border-l-2 border-brand/60 px-2 py-2 pl-3 font-medium text-brand" x-text="r.t.label"></td>
                    <template x-for="p in partners" :key="p"><td class="px-4 py-2 text-center" :class="r.counts[p] > 0 ? 'cursor-pointer font-medium text-navy hover:underline' : 'text-slate-400'" @click="r.counts[p] > 0 && cellClick(p, r.t)" x-text="r.counts[p]"></td></template>
                    <td class="px-4 py-2 text-center font-medium text-slate-700" x-text="r.total"></td></tr>
                </template>
                <tr class="bg-rose-50 font-bold"><td class="px-4 py-2 text-brand">Total Jobs</td>
                  <template x-for="p in partners" :key="p"><td class="px-4 py-2 text-center text-brand" x-text="partnerTotal(p)"></td></template><td class="px-4 py-2 text-center text-brand" x-text="allCount"></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- LIVE DATA -->
      <div x-show="mode === 'live'" class="mt-4">
        <!-- folder tabs -->
        <div class="ml-4 flex items-end gap-1">
          <button class="rounded-t-lg px-4 py-2 text-left text-[11px] font-bold leading-tight" :class="active === 'list' ? 'bg-brand text-white' : 'bg-slate-200 text-slate-600'" @click="active = 'list'">Jobs List<br><span x-text="vertical"></span></button>
          <template x-for="(id, i) in open" :key="id">
            <div class="flex items-center gap-2 rounded-t-lg px-3 py-2 text-[11px] font-bold leading-tight" :class="active === id ? 'bg-navy text-white' : 'bg-slate-300 text-slate-700'">
              <button class="max-w-[170px] truncate text-left" @click="active = id"><span x-text="(i + 1) + '. ' + jobOf(id).job_name"></span><br><span class="font-semibold opacity-80" x-text="'FY - JY ' + jobOf(id).job_year"></span></button>
              <button @click="closeJob(id)"><span class="msym !text-[16px]">close</span></button>
            </div>
          </template>
        </div>

        <!-- jobs list -->
        <div x-show="active === 'list'" class="rounded-2xl border border-brand bg-white">
          <div x-component="'table-toolbar'"></div>
          <div class="overflow-x-auto">
            <table class="tbl min-w-full">
              <thead><tr><template x-for="c in tbl.cols" :key="c.key"><th @click="c.key !== '#' && tbl.sortBy(c.key)"><span x-text="c.label"></span><span x-show="tbl.sortKey === c.key" class="text-[9px]" x-text="tbl.dir > 0 ? ' ▲' : ' ▼'"></span></th></template></tr></thead>
              <tbody>
                <template x-for="(r, i) in tbl.slice" :key="r.job_id">
                  <tr><template x-for="c in tbl.cols" :key="c.key"><td :class="c.link && 'link font-medium'" @click="c.link && openJob(r, $event)" x-text="c.key === '#' ? tbl.from + i : cell(r, c)"></td></template></tr>
                </template>
              </tbody>
            </table>
            <div x-show="!tbl.total" class="py-10 text-center text-sm text-slate-400">No jobs match the current filters.</div>
          </div>
          <div x-component="'pagination-status'"></div>
        </div>

        <!-- job detail (dev layout: header facts + vertical timeline | budget, instructions, queries, appreciation & feedback) -->
        <template x-if="active !== 'list' && job">
          <div class="fade-in overflow-hidden rounded-2xl border border-navy bg-white">
            <div class="flex flex-wrap items-stretch border-b">
              <button class="m-3 flex items-center gap-1 rounded-full bg-slate-100 px-4 py-1.5 text-[15px] font-medium hover:bg-slate-200" @click="closeJob(active)"><span class="msym">close</span>Close</button>
              <div class="border-l px-4 py-2"><div class="text-lg font-bold text-navy" x-text="job.job_name"></div><div class="text-[11px] font-bold" x-text="'Last Modified ' + D(job.last_modified)"></div></div>
              <div class="flex items-center gap-3 border-l px-4"><span class="msym !text-[38px]">badge</span><div><div class="text-[11px] text-slate-500">Accountant</div><div class="text-xs font-medium" x-text="job.associate"></div></div></div>
              <template x-for="f in [['Job Status', statusOf(job)], ['Group Job Name', job.group_job_name], ['Nature of Job', job.nature_of_job], ['Received From', job.received_from], ['Received Date', D(job.received_date)]]" :key="f[0]">
                <div class="border-l px-4 py-2"><div class="text-[11px] text-slate-500" x-text="f[0]"></div><div class="text-[15px] font-medium" x-text="f[1]"></div></div>
              </template>
            </div>

            <div class="flex flex-wrap gap-4 bg-[#dfe5ef] p-4 lg:flex-nowrap">
              <!-- job timeline: vertical, oldest at top, a day-gap pill under each step except the current one -->
              <div class="w-full shrink-0 rounded-xl border border-slate-200 bg-white p-4 shadow-sm lg:w-[300px]">
                <div class="mb-3 flex items-center gap-2 text-sm font-semibold text-brand"><span class="msym !text-[16px]">timeline</span>Job Timeline</div>
                <template x-for="(t, i) in job.timeline" :key="i">
                  <div class="flex gap-3">
                    <div class="flex flex-col items-center">
                      <span class="relative flex h-4 w-4 shrink-0 items-center justify-center rounded-full border-2 border-brand" :class="i === job.timeline.length - 1 ? 'bg-white' : 'bg-brand'"><span x-show="i === job.timeline.length - 1" class="h-2 w-2 animate-pulse rounded-full bg-brand"></span></span>
                      <div x-show="i < job.timeline.length - 1" class="w-0.5 flex-1 bg-brand/30"></div>
                    </div>
                    <div class="pb-4">
                      <div class="text-xs font-semibold text-slate-500" x-text="D(t.on)"></div>
                      <div class="mt-0.5 flex flex-wrap items-center gap-2"><span class="text-sm font-semibold" :class="i === job.timeline.length - 1 ? 'text-brand' : 'text-slate-700'" x-text="t.status"></span><span x-show="i === job.timeline.length - 1" class="rounded-full bg-brand/10 px-2 py-0.5 text-[11px] font-semibold text-brand">Current</span></div>
                      <div class="text-xs text-slate-500">Time taken: <strong class="text-slate-700" x-text="hm(stepTimes[i])"></strong> hrs</div>
                      <span x-show="i < job.timeline.length - 1" class="mt-1 inline-block rounded-full border px-2 py-0.5 text-[11px] font-semibold" :class="gap(i + 1) > 30 ? 'border-red-300 bg-red-100 text-red-700' : gap(i + 1) > 10 ? 'border-yellow-300 bg-yellow-50 text-yellow-700' : 'border-slate-300 bg-slate-100 text-slate-600'" x-text="gap(i + 1) + (gap(i + 1) === 1 ? ' day' : ' days')"></span>
                    </div>
                  </div>
                </template>
              </div>

              <!-- always-expanded panels (full width) -->
              <div class="min-w-0 flex-1 space-y-3">
                <div class="rounded-xl border border-slate-200 bg-white shadow-sm">
                  <div class="flex items-center gap-2 border-b px-4 py-2 text-sm font-semibold text-brand"><span class="msym !text-[16px]">tune</span>Under / Over Budget</div>
                  <div class="space-y-2 px-4 py-3 text-sm">
                    <div class="flex flex-wrap items-baseline gap-x-5 gap-y-1">
                      <span>Budget <strong x-text="hm(job.budget_hours)"></strong></span><span>Time taken <strong x-text="hm(job.actual_hours)"></strong></span>
                      <span>Variance <strong :class="job.actual_hours > job.budget_hours ? 'text-red-600' : 'text-green-700'" x-text="hm(Math.abs(job.budget_hours - job.actual_hours))"></strong></span><span>Utilisation <span x-text="pct(job) + '%'"></span></span>
                    </div>
                    <span class="inline-block rounded-full border px-3 py-0.5 text-xs font-semibold" :class="job.actual_hours > job.budget_hours ? 'border-red-300 bg-red-50 text-red-700' : 'border-green-300 bg-green-50 text-green-700'" x-text="job.actual_hours > job.budget_hours ? 'Over budget' : 'Under budget'"></span>
                  </div>
                </div>

                <div class="rounded-xl border border-slate-200 bg-white shadow-sm">
                  <div class="flex items-center gap-2 border-b px-4 py-2 text-sm font-semibold text-brand"><span class="msym !text-[16px]">schedule</span>Turnaround</div>
                  <div class="grid grid-cols-3 gap-3 px-4 py-3 text-center">
                    <div class="rounded-lg bg-[#e8ebf5] py-2"><div class="text-2xl font-bold text-navy" x-text="turnaround.carisma"></div><div class="text-[11px] font-semibold uppercase text-slate-500">With Carisma</div><div class="text-[10px] text-slate-400">days</div></div>
                    <div class="rounded-lg bg-yellow-50 py-2"><div class="text-2xl font-bold text-yellow-800" x-text="turnaround.client"></div><div class="text-[11px] font-semibold uppercase text-slate-500">With Client</div><div class="text-[10px] text-slate-400">days</div></div>
                    <div class="rounded-lg bg-slate-100 py-2"><div class="text-2xl font-bold text-slate-800" x-text="turnaround.total"></div><div class="text-[11px] font-semibold uppercase text-slate-500">Total Turnaround</div><div class="text-[10px] text-slate-400">days</div></div>
                  </div>
                </div>

                <div class="rounded-xl border border-slate-200 bg-white shadow-sm">
                  <div class="flex items-center gap-2 border-b px-4 py-2 text-sm font-semibold text-brand"><span class="msym !text-[16px]">assignment</span>Instructions</div>
                  <div class="max-h-[260px] min-h-[120px] space-y-2 overflow-y-auto p-3">
                    <div x-show="!(instr[active] || []).length" class="text-sm text-slate-500">No instructions found</div>
                    <template x-for="m in (instr[active] || [])"><div class="rounded-lg border bg-white px-3 py-2 shadow-sm"><div class="flex justify-between text-xs"><span class="font-semibold text-brand" x-text="$store.app.user.first_name"></span><span class="text-slate-400" x-text="CP.fmt.dt(m.at)"></span></div><div class="mt-1 text-sm" x-text="m.text"></div></div></template>
                  </div>
                  <div class="flex items-center gap-2 border-t p-2"><input class="field flex-1 !py-1 text-xs" placeholder="Type an instruction…" x-model="newInstr" @keydown.enter="sendInstr()"><button class="btn-soft" @click="sendInstr()"><span class="msym">send</span></button></div>
                </div>

                <div class="rounded-xl border border-slate-200 bg-white shadow-sm">
                  <div class="flex items-center gap-2 border-b px-4 py-2 text-sm font-semibold text-brand"><span class="msym !text-[16px]">help_outline</span>Queries</div>
                  <div class="flex min-h-[80px] items-center justify-center p-3">
                    <div x-show="!jobQueryCount" class="text-sm text-slate-500">No queries found</div>
                    <button x-show="jobQueryCount" class="flex flex-col items-center gap-0.5 rounded-lg px-4 py-1 hover:bg-brand-lighter" @click="openQueries()">
                      <span class="text-2xl font-semibold text-brand" x-text="jobQueryCount"></span><span class="text-xs font-medium text-slate-500 underline" x-text="jobQueryCount === 1 ? 'View Query' : 'View Queries'"></span></button>
                  </div>
                </div>

                <div class="rounded-xl border border-slate-200 bg-white shadow-sm">
                  <div class="flex items-center justify-between border-b px-4 py-2 text-sm font-semibold text-brand">
                    <span class="flex items-center gap-2"><span class="msym !text-[16px]">favorite_border</span>Appreciation and Feedback</span>
                    <button x-show="jobSurvey" class="text-xs font-semibold underline" @click="feedbackOpen = true">View Feedback</button>
                  </div>
                  <div class="max-h-[260px] min-h-[120px] space-y-2 overflow-y-auto p-3">
                    <div x-show="!jobAppreciation.length" class="text-sm text-slate-500">No appreciation received for this job yet</div>
                    <template x-for="a in jobAppreciation" :key="a.id"><div class="rounded-lg border bg-white px-3 py-2 shadow-sm">
                      <div class="text-right text-xs text-slate-400" x-text="D(a.received_date)"></div><div class="text-sm" x-text="a.message"></div>
                      <div class="mt-1.5 flex flex-wrap gap-1.5 text-[11px]"><template x-for="r in a.appreciation_for.split(', ')"><span class="rounded-full bg-brand/10 px-2 py-0.5 font-semibold text-brand" x-text="r"></span></template></div></div></template>
                  </div>
                </div>
              </div>
            </div>

            <!-- submitted feedback survey (read-only) -->
            <template x-if="feedbackOpen && jobSurvey">
              <div class="fixed inset-0 z-[80] grid place-items-center bg-black/50 p-4" @click.self="feedbackOpen = false">
                <div class="w-full max-w-lg rounded-xl bg-white shadow-xl">
                  <div class="flex items-center justify-between border-b px-5 py-3"><h5 class="font-semibold">Feedback</h5><button @click="feedbackOpen = false"><span class="msym">close</span></button></div>
                  <div class="space-y-3 p-5 text-sm">
                    <div><div class="font-semibold text-slate-600">Overall Satisfaction</div><div x-text="jobSurvey.overall_satisfaction || '-'"></div><div class="mt-0.5 text-slate-600" x-text="jobSurvey.overall_insights"></div></div>
                    <div><div class="font-semibold text-slate-600">Responsiveness</div><div x-text="jobSurvey.responsiveness || '-'"></div><div class="mt-0.5 text-slate-600" x-text="jobSurvey.responsiveness_insights"></div></div>
                    <div x-show="jobSurvey.improvements"><div class="font-semibold text-slate-600">Suggested Improvements</div><div x-text="jobSurvey.improvements"></div></div>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </template>
      </div>
      <!-- Filters drawer (dev FilterSidebar): FY, Status, Nature of Job, Received / Commenced period, Received From, Accountant -->
      <template x-if="drawer">
        <div class="fixed inset-0 z-[80] flex justify-end bg-black/40" @click.self="drawer = false">
          <div class="flex h-full w-[440px] max-w-full flex-col bg-white shadow-2xl">
            <div class="flex items-center justify-between border-b px-5 py-3"><h2 class="text-xl font-medium text-navy">Filters</h2><button @click="drawer = false"><span class="msym">close</span></button></div>
            <div class="flex-1 space-y-4 overflow-y-auto p-5 text-sm">
              <div class="grid grid-cols-2 gap-3">
                <label class="block"><span class="font-medium">Financial Year</span><select class="field mt-1 block w-full" x-model="draft.financial_year"><template x-for="y in fyOptions" :key="y"><option :value="y" :selected="draft.financial_year === y" x-text="y"></option></template></select></label>
                <label class="block"><span class="font-medium">Status</span><select class="field mt-1 block w-full" x-model="draft.status"><option value="live" :selected="draft.status === 'live'">Live Jobs</option><option value="all" :selected="draft.status === 'all'">All Jobs</option><template x-for="t in allTiles" :key="t.key"><option :value="t.key" :selected="draft.status === t.key" x-text="t.label"></option></template></select></label>
              </div>
              <label class="block"><span class="font-medium">Nature of Job</span><select class="field mt-1 block w-full" x-model="draft.nature_of_job"><template x-for="o in opts('nature_of_job')" :key="o"><option :value="o" :selected="draft.nature_of_job === o" x-text="o"></option></template></select></label>
              <div class="grid grid-cols-2 gap-3">
                <label class="block"><span class="font-medium">Received Date</span><select class="field mt-1 block w-full" x-model="draft.received_range"><option value="">All</option><template x-for="p in periods" :key="p[0]"><option :value="p[0]" :selected="draft.received_range === p[0]" x-text="p[1]"></option></template></select></label>
                <label class="block"><span class="font-medium">Commenced Date</span><select class="field mt-1 block w-full" x-model="draft.commenced_range"><option value="">All</option><template x-for="p in periods" :key="p[0]"><option :value="p[0]" :selected="draft.commenced_range === p[0]" x-text="p[1]"></option></template></select></label>
              </div>
              <div><div class="mb-1 font-medium">Received From</div>
                <div class="max-h-40 overflow-y-auto rounded-lg border">
                  <template x-for="o in opts('received_from')" :key="o"><button type="button" class="flex w-full items-center gap-2 border-l-4 px-3 py-1.5 text-left hover:bg-slate-50" :class="draft.received_from === o ? 'border-l-slate-500 bg-slate-200' : 'border-transparent'" @click="draft.received_from = o">
                    <span class="msym !text-[16px]" :class="draft.received_from === o ? 'text-green-800' : 'text-slate-500'" x-text="draft.received_from === o ? 'check_circle' : 'person'"></span><span x-text="o"></span></button></template></div></div>
              <div><div class="mb-1 font-medium">Accountant</div>
                <div class="max-h-40 overflow-y-auto rounded-lg border">
                  <template x-for="o in opts('associate')" :key="o"><button type="button" class="flex w-full items-center gap-2 border-l-4 px-3 py-1.5 text-left hover:bg-slate-50" :class="draft.accountant === o ? 'border-l-slate-500 bg-slate-200' : 'border-transparent'" @click="draft.accountant = o">
                    <span class="msym !text-[16px]" :class="draft.accountant === o ? 'text-green-800' : 'text-slate-500'" x-text="draft.accountant === o ? 'check_circle' : 'person'"></span><span x-text="o"></span></button></template></div></div>
            </div>
            <div class="flex justify-end gap-2 border-t p-4"><button class="rounded-md border border-slate-300 px-4 py-1.5" @click="clearDrawer()">Clear</button><button class="rounded-md bg-brand px-5 py-1.5 font-semibold text-white" @click="applyDrawer()">Apply</button></div>
          </div>
        </div>
      </template>
      </div>
    </div>
  </template>
</div>
