<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ITR Workflow v8 Prototype</title>
<meta name="description" content="Clickable prototype of the Individual Tax Return workflow v8 (Stages 1-3, 40 steps) in the Carisma Solutions look.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ITR Workflow v8 prototype — Carisma Solutions look (maroon brand, white sidebar, tiles with coloured base, maroon card headers) */
:root {
  --brand: #7d1233; --brand-2: #9b1d45; --brand-tint: #f3dce3; --brand-soft: #fbf1f4;
  --ink: #1d2433; --ink-2: #4a5263; --muted: #7b8394; --line: #e6e8ee; --line-2: #eef0f4;
  --bg: #f1f2f5; --panel: #ffffff; --row: #f7f8fa;
  --teal: #13a3c4; --amber: #f0ad1c; --amber-ink: #8a5a00; --amber-bg: #fdf1c9;
  --purple: #9a47dc; --purple-ink: #5b3f9a; --purple-bg: #f1e6fb;
  --green: #16a386; --green-ink: #0e6b5e; --green-bg: #e3f3f0;
  --coral: #ef5f76; --red: #c0262d; --red-bg: #fde4e1; --blue: #2b4f9e; --blue-bg: #e7eefb;
  --radius: 14px; --shadow: 0 1px 2px rgba(20, 24, 40, .06), 0 4px 14px rgba(20, 24, 40, .05);
  --font: "Source Sans 3", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); color: var(--ink); background: #fff; font-size: 15px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--brand); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- shell ---------- */
.topbar { position: fixed; inset: 0 0 auto 0; height: 64px; display: flex; align-items: center; gap: 14px; padding: 0 22px 0 14px; background: #fff; z-index: 30; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: .2px; color: var(--brand); font-size: 17px; text-decoration: none; }
.logo svg { width: 26px; height: 26px; }
.topbar .spacer { flex: 1; }
.datebox { text-align: right; line-height: 1.15; color: var(--muted); font-size: 12px; }
.datebox b { display: block; color: #8a93a6; font-weight: 600; font-size: 15px; }
.iconbtn { position: relative; width: 38px; height: 38px; border-radius: 10px; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; color: #8a93a6; }
.iconbtn:hover { background: var(--row); color: var(--brand); }
.iconbtn svg { width: 20px; height: 20px; }
.iconbtn .dot { position: absolute; top: 7px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--brand); border: 2px solid #fff; }
.userchip { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; cursor: pointer; padding: 4px 6px; border-radius: 12px; text-align: right; }
.userchip:hover { background: var(--row); }
.userchip .nm { font-weight: 700; font-size: 14px; line-height: 1.1; }
.userchip .rl { font-size: 12px; color: var(--muted); }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
.hamb { display: none; }

.sidebar { position: fixed; top: 64px; bottom: 0; left: 0; width: 240px; background: #fff; overflow-y: auto; padding: 6px 8px 18px 0; z-index: 20; }
.nav a { display: flex; align-items: center; gap: 12px; padding: 9px 14px 9px 16px; margin: 1px 0; color: var(--ink); text-decoration: none; font-weight: 600; font-size: 14.5px; border-radius: 0 22px 22px 0; }
.nav a svg { width: 19px; height: 19px; color: #3b4356; flex: none; }
.nav a:hover { background: var(--brand-soft); }
.nav a.on { background: var(--brand-tint); color: var(--ink); }
.nav a.on svg { color: var(--brand); }
.nav a .cnt { margin-left: auto; background: var(--brand); color: #fff; font-size: 11px; font-weight: 700; border-radius: 10px; padding: 1px 7px; }
.nav hr { border: 0; border-top: 1px solid var(--line); margin: 8px 0 8px 12px; }
.nav .grp { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .6px; text-transform: uppercase; padding: 10px 16px 4px; }

.main { position: fixed; top: 64px; left: 240px; right: 0; bottom: 0; background: var(--bg); border-top-left-radius: 34px; overflow-y: auto; }
.page { padding: 26px 32px 60px; max-width: 1440px; }
.pagehead { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
.pagehead h1 { margin: 0; font-size: 27px; font-weight: 700; letter-spacing: -.2px; }
.pagehead .sub { color: var(--ink-2); margin-top: 2px; }
.pagehead .grow { flex: 1; min-width: 220px; }
.pagehead.center { justify-content: center; text-align: center; }
.info { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--brand); color: var(--brand); background: #fff; font-weight: 700; font-family: Georgia, serif; font-style: italic; cursor: pointer; flex: none; margin-top: 3px; }
.info:hover { background: var(--brand); color: #fff; }

/* ---------- tiles ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; margin-bottom: 22px; }
.tile { background: #fff; border-radius: var(--radius); padding: 16px 16px 14px; box-shadow: var(--shadow); border-bottom: 5px solid var(--c, var(--brand)); cursor: pointer; text-align: left; border-top: 0; border-left: 0; border-right: 0; }
.tile:hover { transform: translateY(-1px); }
.tile .k { font-size: 11.5px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase; color: var(--c, var(--brand)); }
.tile .v { font-size: 30px; font-weight: 700; color: var(--c, var(--brand)); margin: 6px 0 0; line-height: 1.1; }
.tile .u { font-size: 11.5px; text-transform: uppercase; color: var(--c, var(--brand)); opacity: .8; }

/* ---------- cards ---------- */
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 18px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; }
.card { min-width: 0; background: #fff; border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; margin-bottom: 18px; }
.grid2 > .card, .grid3 > .card { margin-bottom: 0; }
.card-h { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 13px 18px; background: var(--brand); color: #fff; }
.card-h h2, .card-h h3 { margin: 0; font-size: 17px; font-weight: 700; flex: 1; }
.card-h a, .card-h .lnk { color: #fff; font-size: 13px; font-weight: 600; text-decoration: underline; cursor: pointer; background: none; border: 0; }
.card-h.amber { background: var(--amber-bg); color: #6b3d00; } .card-h.amber a, .card-h.amber .lnk { color: #6b3d00; }
.card-h.purple { background: var(--purple-bg); color: #4a2a7a; } .card-h.purple a, .card-h.purple .lnk { color: #4a2a7a; }
.card-h.light { background: #fff; color: var(--ink); border-bottom: 1px solid var(--line); }
.card-h .pill { background: rgba(255, 255, 255, .85); color: var(--ink); border-radius: 12px; font-size: 12px; font-weight: 700; padding: 1px 9px; }
.card-h .ctl { background: rgba(255, 255, 255, .18); border-radius: 10px; padding: 4px 12px; font-size: 13px; font-weight: 600; }
.card-b { padding: 16px 18px; }
.card-b.tight { padding: 0; }
.muted { color: var(--muted); } .small { font-size: 13px; } .tiny { font-size: 12px; }
.ok { color: var(--green-ink); } .bad { color: var(--red); } .warn { color: var(--amber-ink); }

/* ---------- tables ---------- */
.tbl-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th { text-align: left; font-weight: 700; font-size: 13.5px; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: #fff; }
table.t td { padding: 9px 12px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
table.t tbody tr:nth-child(even) td { background: var(--row); }
table.t tr.click { cursor: pointer; } table.t tr.click:hover td { background: var(--brand-soft); }
table.t td.num, table.t th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.t td.c, table.t th.c { text-align: center; }
table.t tfoot td { font-weight: 700; border-top: 1px solid var(--line); }
table.t th.grp { text-align: center; background: var(--brand-soft); }

/* ---------- chips, badges ---------- */
.badge { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 700; white-space: nowrap; background: var(--line-2); color: var(--ink-2); }
.b-green { background: var(--green-bg); color: var(--green-ink); } .b-red { background: var(--red-bg); color: var(--red); }
.b-amber { background: var(--amber-bg); color: var(--amber-ink); } .b-purple { background: var(--purple-bg); color: var(--purple-ink); }
.b-blue { background: var(--blue-bg); color: var(--blue); } .b-brand { background: var(--brand-tint); color: var(--brand); }
.w { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; font-size: 12px; font-weight: 800; }
.w-M { background: var(--red-bg); color: var(--red); } .w-E { background: var(--amber-bg); color: var(--amber-ink); } .w-I { background: var(--blue-bg); color: var(--blue); }
.lane { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.lane::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.l-client { background: #fdecea; color: #b42318; } .l-firm { background: var(--blue-bg); color: var(--blue); }
.l-carisma { background: var(--green-bg); color: var(--green-ink); } .l-ch { background: #eef7e8; color: #46661c; }
.l-platform { background: var(--purple-bg); color: var(--purple-ink); } .l-mail { background: #fff1d6; color: #8a5a00; }

/* ---------- buttons & forms ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border-radius: 10px; border: 1px solid var(--line); background: #fff; padding: 8px 15px; font-weight: 700; font-size: 14px; cursor: pointer; color: var(--ink); text-decoration: none; min-height: 38px; }
.btn:hover { border-color: var(--brand); color: var(--brand); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-2); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--brand); padding: 6px 10px; }
.btn.danger { color: var(--red); } .btn.sm { padding: 4px 10px; min-height: 30px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.fld { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; min-width: 0; }
.fld > label, .fld > .lbl { font-weight: 700; font-size: 13.5px; }
.fld .hint { font-size: 12.5px; color: var(--muted); }
.fld .err { font-size: 12.5px; color: var(--red); display: none; } .fld.has-err .err { display: block; } .fld.has-err input { border-color: var(--red); }
input[type=text], input[type=email], input[type=number], input[type=tel], input[type=date], textarea, .combo input { width: 100%; border: 1px solid #d5d9e2; border-radius: 10px; padding: 8px 11px; background: #fff; min-height: 38px; }
textarea { min-height: 70px; resize: vertical; }
input:focus, textarea:focus, .btn:focus-visible, .tile:focus-visible, .info:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 0 14px; }
.check { display: flex; gap: 9px; align-items: flex-start; padding: 6px 0; cursor: pointer; }
.check input { margin-top: 3px; width: 17px; height: 17px; accent-color: var(--brand); flex: none; }

/* searchable combobox (every dropdown) */
.combo { position: relative; min-width: 0; }
.combo input { padding-right: 32px; cursor: text; }
.combo .car { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--muted); font-size: 11px; }
.combo ul { position: absolute; z-index: 60; left: 0; right: 0; top: calc(100% + 4px); max-height: 270px; overflow-y: auto; list-style: none; margin: 0; padding: 5px; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(20, 24, 40, .16); display: none; min-width: 220px; }
.combo.open ul { display: block; }
.combo li { padding: 7px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; }
.combo li .s { display: block; font-size: 12px; color: var(--muted); }
.combo li.act, .combo li:hover { background: var(--brand-soft); }
.combo li.sel { font-weight: 700; color: var(--brand); }
.combo li.none { color: var(--muted); cursor: default; background: none; }
.combo.inline { display: inline-block; min-width: 190px; }
.card-h .combo input { min-height: 32px; padding: 4px 30px 4px 10px; border: 0; }

/* ---------- job page ---------- */
.jobhead { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: start; }
.jobhead h1 { margin: 0; font-size: 25px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--ink-2); font-size: 13.5px; margin-top: 6px; }
.meta b { color: var(--ink); }
.stages { display: grid; grid-template-columns: 14fr 19fr 7fr; gap: 10px; margin: 16px 0 6px; }
.stg { background: #fff; border-radius: 14px; padding: 10px 12px; box-shadow: var(--shadow); border: 2px solid transparent; min-width: 0; }
.stg.cur { border-color: var(--brand); }
.stg .t { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.stg.cur .t { color: var(--brand); } .stg.done .t { color: var(--green-ink); }
.dots { display: flex; gap: 3px; margin-top: 8px; flex-wrap: wrap; }
.dot { flex: 1 1 0; min-width: 9px; height: 10px; border-radius: 4px; background: var(--line); border: 0; padding: 0; cursor: pointer; }
.dot.done { background: var(--green); } .dot.cur { background: var(--brand); box-shadow: 0 0 0 2px var(--brand-tint); } .dot.skip { background: #cfd4de; }
.jobcols { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; margin-top: 14px; }
.action { border: 2px solid var(--brand); }
.action .card-h { gap: 12px; }
.stepno { background: #fff; color: var(--brand); border-radius: 9px; font-weight: 800; padding: 2px 8px; font-size: 13px; }
.waiting { background: var(--row); border-radius: 12px; padding: 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.gauge { --p: 0; width: 120px; height: 120px; border-radius: 50%; margin: 0 auto; display: grid; place-items: center; background: conic-gradient(var(--gc, var(--brand)) calc(var(--p) * 1%), var(--line-2) 0); }
.gauge > div { width: 92px; height: 92px; border-radius: 50%; background: #fff; display: grid; place-items: center; text-align: center; }
.gauge b { font-size: 24px; display: block; line-height: 1; } .gauge span { font-size: 11px; color: var(--muted); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 600; text-align: right; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; background: #fff; padding: 0 10px; }
.tabs button { border: 0; background: none; padding: 12px 12px 10px; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
.tabs button.on { color: var(--brand); border-bottom-color: var(--brand); }
.alert { border-radius: 12px; padding: 11px 14px; display: flex; gap: 10px; align-items: flex-start; margin-bottom: 12px; font-size: 14px; }
.alert.red { background: var(--red-bg); color: #7a1414; } .alert.amber { background: var(--amber-bg); color: #6b3d00; }
.alert.green { background: var(--green-bg); color: #0b4f45; } .alert.blue { background: var(--blue-bg); color: #1d3a78; }
.bar { height: 8px; background: var(--line-2); border-radius: 6px; overflow: hidden; min-width: 70px; }
.bar i { display: block; height: 100%; background: var(--brand); border-radius: 6px; }
.bar.ok i { background: var(--green); }
.drop { border: 2px dashed #cdd2dc; border-radius: 14px; padding: 18px; text-align: center; background: var(--row); cursor: pointer; }
.drop:hover, .drop.over { border-color: var(--brand); background: var(--brand-soft); }
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 50px 1fr auto; gap: 10px; padding: 9px 4px; border-bottom: 1px solid var(--line-2); font-size: 14px; }
.tl .n { font-weight: 800; color: var(--brand); }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.qcard { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; background: #fff; }
.qcard .qh { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }

/* ---------- workflow map ---------- */
.wf { overflow-x: auto; }
.wf table { border-collapse: separate; border-spacing: 6px; min-width: 900px; width: 100%; }
.wf th.lanehd { text-align: left; font-size: 12.5px; width: 150px; padding: 6px; vertical-align: middle; }
.wf td { vertical-align: middle; padding: 0; }
.wfstep { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 6px 8px; font-size: 12.5px; line-height: 1.25; cursor: pointer; width: 100%; text-align: left; min-height: 54px; }
.wfstep b { display: block; font-size: 12px; }
.wfstep:hover { border-color: var(--brand); }
.wfstep .cnt { float: right; background: var(--brand); color: #fff; border-radius: 9px; font-size: 11px; font-weight: 800; padding: 0 6px; }
.wfstep.l-client { border-left: 4px solid #b42318; } .wfstep.l-firm { border-left: 4px solid var(--blue); } .wfstep.l-carisma { border-left: 4px solid var(--green-ink); }
.wfstep.l-ch { border-left: 4px solid #46661c; } .wfstep.l-platform { border-left: 4px solid var(--purple-ink); } .wfstep.l-mail { border-left: 4px solid #8a5a00; }
.wfstep.l-client, .wfstep.l-firm, .wfstep.l-carisma, .wfstep.l-ch, .wfstep.l-platform, .wfstep.l-mail { background: #fff; color: var(--ink); }

/* bar chart */
.chart { display: flex; align-items: flex-end; gap: 10px; height: 170px; padding: 14px 4px 0; }
.chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 5px; font-size: 12px; color: var(--ink-2); }
.chart .col i { display: block; width: 100%; background: #9c3a57; border-radius: 4px 4px 0 0; min-height: 3px; }
.chart .col i.today { background: var(--brand); }
.minis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 16px; }
.mini { background: var(--row); border-radius: 12px; padding: 10px; text-align: center; }
.mini b { display: block; font-size: 21px; } .mini span { font-size: 12px; color: var(--ink-2); }

/* drawer, modal, toast, menu */
.scrim { position: fixed; inset: 0; background: rgba(20, 24, 40, .35); z-index: 70; display: none; }
.scrim.on { display: block; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: #fff; z-index: 80; box-shadow: -10px 0 30px rgba(0, 0, 0, .15); transform: translateX(105%); transition: transform .2s; display: flex; flex-direction: column; }
.drawer.on { transform: none; }
.drawer .dh { background: var(--brand); color: #fff; padding: 16px 18px; display: flex; align-items: center; gap: 10px; }
.drawer .dh h2 { margin: 0; font-size: 18px; flex: 1; }
.drawer .dh button { background: none; border: 0; color: #fff; font-size: 22px; cursor: pointer; }
.drawer .db { padding: 16px 20px 30px; overflow-y: auto; }
.drawer h3 { font-size: 14px; text-transform: uppercase; letter-spacing: .5px; color: var(--brand); margin: 18px 0 6px; }
.drawer ol, .drawer ul { padding-left: 20px; margin: 4px 0; } .drawer li { margin: 4px 0; }
.modal { position: fixed; z-index: 90; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(620px, calc(100% - 24px)); max-height: calc(100% - 40px); background: #fff; border-radius: 18px; box-shadow: 0 20px 60px rgba(0, 0, 0, .25); display: none; flex-direction: column; overflow: hidden; }
.modal.on { display: flex; }
.modal .mh { background: var(--brand); color: #fff; padding: 14px 18px; display: flex; align-items: center; }
.modal .mh h2 { margin: 0; font-size: 18px; flex: 1; } .modal .mh button { background: none; border: 0; color: #fff; font-size: 22px; cursor: pointer; }
.modal .mb { padding: 18px; overflow-y: auto; } .modal .mf { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.toasts { position: fixed; right: 18px; bottom: 18px; z-index: 100; display: flex; flex-direction: column; gap: 8px; max-width: min(420px, calc(100% - 36px)); }
.toast { background: var(--ink); color: #fff; padding: 11px 15px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, .2); font-size: 14px; }
.toast.good { background: #0e6b5e; } .toast.bad { background: #9a1c22; }
.menu { position: fixed; top: 60px; right: 16px; width: 330px; background: #fff; border-radius: 16px; box-shadow: 0 14px 40px rgba(0, 0, 0, .2); z-index: 85; padding: 14px; display: none; }
.menu.on { display: block; }
.mailbody { white-space: pre-wrap; background: var(--row); border-radius: 12px; padding: 14px; font-size: 14px; }

function mountCombos() {
  $$(".combo[data-ci]").forEach(el => {
    const spec = UI.combos[+el.dataset.ci]; if (!spec || el._m) return; el._m = 1;
    el.innerHTML = `<input type="text" role="combobox" aria-expanded="false" aria-autocomplete="list" autocomplete="off" aria-label="${esc(spec.o.label || spec.key)}" placeholder="${esc(spec.o.placeholder || "Type to search…")}"><span class="car">▼</span><ul role="listbox"></ul>`;
    const inp = $("input", el), ul = $("ul", el); let shown = [], act = -1;
    const cur = () => spec.options.find(x => String(x.value) === String(UI.cv[spec.key]));
    const setText = () => { const c = cur(); inp.value = c ? c.label : ""; };
    setText();
    const draw = q => {
      const t = (q || "").toLowerCase().trim();
      shown = spec.options.filter(x => !t || (x.label + " " + (x.sub || "")).toLowerCase().includes(t));
      ul.innerHTML = shown.length ? shown.map((x, k) => `<li role="option" data-k="${k}" class="${k === act ? "act" : ""} ${String(x.value) === String(UI.cv[spec.key]) ? "sel" : ""}">${esc(x.label)}${x.sub ? `<span class="s">${esc(x.sub)}</span>` : ""}</li>`).join("") : `<li class="none">No match — try a different word</li>`;
      const a = $("li.act", ul); if (a && a.scrollIntoView) a.scrollIntoView({ block: "nearest" });
    };
    const open = () => { el.classList.add("open"); inp.setAttribute("aria-expanded", "true"); act = -1; draw(""); try { inp.select(); } catch (e) { } };
    const close = () => { el.classList.remove("open"); inp.setAttribute("aria-expanded", "false"); setText(); };
    const pick = x => { UI.cv[spec.key] = x.value; spec.value = x.value; close(); if (spec.onChange) spec.onChange(x.value, x); };
    inp.addEventListener("focus", open);

  steps: ["Type in <b>Search</b> to find a client, Job ID or firm.", "Narrow the list with the Stage, Firm and Waiting on filters (type to search inside each).", "Click a row to open the job at its current step.", "Use <b>New ITR job</b> to start step 01 for a job received from an end client."],
  tips: ["The Complete % is weighted: Mandatory documents count 3, Essential 2, Info 1.", "The Loops column counts how many times the job went round a loop in each stage (S1 / S2 / S3)."] };
function pageJobs() {
  const p = P(), qs = new URLSearchParams((location.hash.split("?")[1]) || "");
  if (qs.get("stage")) { UI.cv.fStage = qs.get("stage"); history.replaceState(null, "", "#jobs"); }
  if (qs.get("step")) { UI.cv.fStep = qs.get("step"); history.replaceState(null, "", "#jobs"); }
  const f = { stage: UI.cv.fStage || "all", firm: UI.cv.fFirm || "all", wait: UI.cv.fWait || "all", step: UI.cv.fStep || "all" };
  const q = (UI.f.q || "").toLowerCase();
  const J = visibleJobs().filter(j => (f.stage === "all" || String(j.stage) === f.stage) && (f.firm === "all" || j.firm === f.firm) && (f.wait === "all" || (f.wait === "me" ? canAct(j, p) : waitingOn(j) === f.wait)) && (f.step === "all" || String(j.step) === f.step) &&
    (!q || (j.id + " " + j.name + " " + firmOf(j.firm).name + " " + (profOf(j.prof) || {}).label).toLowerCase().includes(q)));
  const rr = () => render();
  return head("Jobs", J.length + " of " + visibleJobs().length + " jobs", "jobs", `<a class="btn primary" href="#new">${ic("newjob").replace("<svg", '<svg width="18" height="18"')} New ITR job</a>`) +
  `<div class="card"><div class="card-b"><div class="row">
    <div class="fld"><label for="q">Search</label><input id="q" type="text" placeholder="Client, Job ID, firm or profession" value="${esc(UI.f.q)}" data-input="search"></div>
    <div class="fld"><div class="lbl">Stage</div>${combo("fStage", [{ value: "all", label: "All stages" }, { value: "1", label: "Stage 1 — Intake & collection" }, { value: "2", label: "Stage 2 — Processing & workpaper" }, { value: "3", label: "Stage 3 — Agent review" }, { value: "4", label: "Ready for lodgement" }], f.stage, rr, { label: "Stage" })}</div>
    ${p.roleKey === "firm" ? "" : `<div class="fld"><div class="lbl">Accounting firm</div>${combo("fFirm", [{ value: "all", label: "All firms" }].concat(FIRMS.map(x => ({ value: x.id, label: x.name }))), f.firm, rr, { label: "Firm" })}</div>`}
    <div class="fld"><div class="lbl">Waiting on</div>${combo("fWait", [{ value: "all", label: "Anyone" }, { value: "me", label: "Me (" + p.name + ")" }].concat(Object.keys(LANES).map(k => ({ value: k, label: LANES[k] }))), f.wait, rr, { label: "Waiting on" })}</div>
    <div class="fld"><div class="lbl">Step</div>${combo("fStep", [{ value: "all", label: "Any step" }].concat(STEPS.slice(1).map(s => ({ value: String(s.n), label: pad2(s.n) + " · " + s.t, sub: "Stage " + s.s + " · " + laneName(s.lane) }))), f.step, rr, { label: "Step" })}</div>
  </div></div></div>
  <div class="card"><div class="card-b tight tbl-wrap"><table class="t"><thead><tr><th>Job ID</th><th>Client / job</th><th>Firm</th><th>Stage</th><th>Current step</th><th>Waiting on</th><th>Complete</th><th class="num">Days in stage</th><th class="c">Loops S1/S2/S3</th></tr></thead><tbody>
  ${J.map(j => { const m = metrics(j); return `<tr class="click" data-act="go" data-arg="job/${j.id}"><td>${j.id}</td><td><b>${esc(j.client.first + " " + j.client.last)}</b><div class="tiny muted">${esc((profOf(j.prof) || { label: "Profession not set" }).label)}</div></td><td class="small">${esc(firmOf(j.firm).name)}</td><td>${stageBadge(j)}</td><td class="small">${esc(statusText(j))}</td><td>${waitingOn(j) ? laneChip(waitingOn(j)) : "—"}${canAct(j, p) ? ` <span class="badge b-brand">You</span>` : ""}</td><td style="min-width:120px">${j.items.length ? `${m.pct}% ${m.mMissing.length && j.stage === 1 ? `<span class="badge b-red" title="Mandatory missing">${m.mMissing.length} M</span>` : ""}${pctBar(m.pct, m.ready)}` : `<span class="muted small">Not analysed</span>`}</td><td class="num">${j.stage === 4 ? "—" : days(j.stageAt[j.stage]).toFixed(1)}</td><td class="c">${j.loops.s1}/${j.loops.s2}/${j.loops.s3}</td></tr>`; }).join("") || `<tr><td colspan="9" class="empty">No jobs match these filters. Clear the search or choose "All".</td></tr>`}
  </tbody></table></div></div>`;
}

/* =================================== NEW JOB (step 01) =================================== */
GUIDE.new = { title: "New ITR job (step 01)", what: "Start a job in the Client portal when an end client (new or existing) asks for their tax return.",
  steps: ["Enter the XPM Job ID, Job name and the XPM document link (or click <b>Fill from XPM</b>).", "Enter the client's name, email and mobile.", "Choose whether the client is new or existing.", "Click <b>Create job</b>. You then upload the profession, PY return, CY pre-fill and documents (step 02)."],

    <div class="row"><div class="fld"><div class="lbl">Accounting firm</div>${p.roleKey === "firm" ? `<input type="text" value="${esc(firmOf(p.firm).name)}" disabled>` : combo("nFirm", FIRMS.map(f => ({ value: f.id, label: f.name, sub: "Admin: " + f.admin })), "APX", null, { label: "Firm" })}</div>

    <div class="row"><div class="fld" id="f-first"><label for="nFirst">Client first name</label><input id="nFirst" type="text" autocomplete="off"><span class="err">Enter the client's first name.</span></div>
    <div class="fld" id="f-last"><label for="nLast">Client last name</label><input id="nLast" type="text" autocomplete="off"><span class="err">Enter the client's last name.</span></div></div>
    <div class="row"><div class="fld" id="f-email"><label for="nEmail">Client email</label><input id="nEmail" type="email" placeholder="name@example.com"><span class="err">Enter a valid email, e.g. jordan@example.com.</span></div>
    <div class="fld"><label for="nMobile">Client mobile</label><input id="nMobile" type="tel" placeholder="+61 4xx xxx xxx"></div>
    <div class="fld"><div class="lbl">New or existing client</div>${combo("nExisting", ["Existing client", "Newly onboarded client"], "Existing client", null, { label: "Client type" })}</div></div>
    <div class="fld"><label for="nLink">XPM document link</label><input id="nLink" type="text" placeholder="https://practicemanager.xero.com/…"><span class="hint">Where the firm keeps the client's documents in XPM.</span></div>

  </div></div>`;

/* =================================== JOB DETAIL =================================== */
GUIDE.job = { title: "Job", what: "Everything about one ITR job: the stage bar, the action waiting now, and tabs for documents, auto-filled data, TIS, queries, workpaper, agent review and the timeline.",
  steps: ["Read the <b>Next action</b> card: it says which step is next and who does it.", "If it is your step, fill in the card and press the main button. The platform then runs the automatic steps (auto-fill, checklist, gap analysis, emails, agents) by itself.", "If it is someone else's step, the card says who; use <b>Switch to …</b> to act as them in this prototype.", "Click any small bar in the stage strip to see what that step does, and when and by whom it was done."],
  tips: ["Green bars are done, the maroon bar is the current step.", "Stage 1 only moves on at the threshold (Rules & Decisions) <b>and</b> with every Mandatory document present."] };
function pageJob(id) {
  const job = S.jobs.find(j => j.id === id), p = P();
  if (!job) return head("Job not found", "", "job") + `<div class="alert red">No job ${esc(id)}. <a href="#jobs">Back to jobs</a></div>`;
  if (p.roleKey === "firm" && job.firm !== p.firm) return head("No access", "", "job") + `<div class="alert red">This job belongs to another accounting firm. <a href="#jobs">Back to your jobs</a></div>`;
  const m = metrics(job), done = new Set(job.timeline.map(e => e.n));
  const stg = STAGES.map(s => {
    const cur = job.stage === s.n, isDone = job.stage > s.n;
    const ds = []; for (let n = s.from; n <= s.to; n++) ds.push(`<button class="dot ${job.step === n && job.stage !== 4 ? "cur" : done.has(n) ? "done" : (n < job.step && job.stage === s.n) || isDone ? "skip" : ""}" data-act="stepInfo" data-arg="${job.id}|${n}" title="${pad2(n)} · ${esc(STEPS[n].t)}" aria-label="Step ${n}: ${esc(STEPS[n].t)}"></button>`);
    return `<div class="stg ${cur ? "cur" : ""} ${isDone ? "done" : ""}"><div class="t"><span>Stage ${s.n} · ${s.name}</span><span>${pad2(s.from)}–${pad2(s.to)}</span></div><div class="dots">${ds.join("")}</div></div>`;
  }).join("");
  const tabs = [["docs", "Documents & checklist"], ["data", "Auto-filled data"], job.tis.length && ["tis", "Tax information summary"], job.queries.length && ["queries", "Queries"], job.wp && ["wp", "Workpaper"], job.s3 && job.s3.rounds.length && ["review", "Agent review"], ["timeline", "Timeline"]].filter(Boolean);
  const tab = tabs.find(t => t[0] === UI.tab[job.id]) ? UI.tab[job.id] : tabs[0][0];
  return `<div class="jobhead"><div><div class="small"><a href="#jobs">Jobs</a> › ${job.id}</div><h1>${esc(job.client.first + " " + job.client.last)} <span class="muted" style="font-weight:600">— ITR ${FY}</span></h1>
    <div class="meta"><span>XPM Job ID <b>${job.id}</b></span><span>Firm <b>${esc(firmOf(job.firm).name)}</b></span><span>Profession <b>${esc((profOf(job.prof) || { label: "not set yet" }).label)}</b></span>${job.wm ? `<span>WM <b>${job.wm.id}</b></span>` : ""}${job.owner ? `<span>Processor <b>${esc(job.owner)}</b></span>` : ""}<span><a href="${esc(job.docLink)}" target="_blank" rel="noopener">XPM documents ↗</a></span></div></div>
    <div class="btns">${stageBadge(job)}${infoBtn("job")}</div></div>
    <div class="stages">${stg}</div>
    <div class="jobcols"><div>${actionCard(job)}
      <div class="card"><div class="tabs" role="tablist">${tabs.map(t => `<button role="tab" class="${t[0] === tab ? "on" : ""}" data-act="tab" data-arg="${job.id}|${t[0]}">${t[1]}</button>`).join("")}</div><div class="card-b">${TABS[tab](job)}</div></div></div>
      <div>${sideCard(job, m)}</div></div>`;
}
function sideCard(job, m) {
  const r = ruleFor(job.firm);
  return `<div class="card"><div class="card-h light"><h3>Document completeness</h3></div><div class="card-b">
    ${job.items.length ? `<div class="gauge" style="--p:${m.pct};--gc:${m.ready ? "var(--green)" : m.mMissing.length ? "var(--red)" : "var(--amber)"}"><div><div><b>${m.pct}%</b><span>weighted</span></div></div></div>
    <p class="small c" style="text-align:center;margin:10px 0 12px">${m.ready || job.stage > 1 ? `<span class="ok"><b>Ready</b> — threshold ${S.settings.threshold}% met and all Mandatory in.</span>` : m.mMissing.length ? `<span class="bad"><b>${m.mMissing.length} Mandatory missing</b> — cannot move on${m.urgent ? " (urgent)" : ""}.</span>` : `<span class="warn">Needs ${S.settings.threshold}% to move on.</span>`}</p>
    <dl class="kv"><dt>${wBadge("M")} Mandatory</dt><dd>${m.cnt.M[0]} / ${m.cnt.M[1]}</dd><dt>${wBadge("E")} Essential</dt><dd>${m.cnt.E[0]} / ${m.cnt.E[1]}</dd><dt>${wBadge("I")} Info</dt><dd>${m.cnt.I[0]} / ${m.cnt.I[1]}</dd></dl>` : `<p class="muted small">The checklist is built after the upload at step 02.</p>`}
  </div></div>
  <div class="card"><div class="card-h light"><h3>Loops, reminders & timers</h3></div><div class="card-b"><dl class="kv">
    <dt>Stage 1 loops</dt><dd>${job.loops.s1}${job.flags.loopEsc ? ` <span class="badge b-red">Escalated</span>` : ""}</dd><dt>Stage 2 re-runs</dt><dd>${job.loops.s2}</dd><dt>Stage 3 fix loops</dt><dd>${job.loops.s3}</dd>
    <dt>Reminders sent</dt><dd>${job.rem.sent} of ${r.max}</dd><dt>Next reminder</dt><dd>${job.step === 8 && job.rem.next ? fmtD(job.rem.next) : "—"}</dd>
    ${[1, 2, 3].map(s => job.stageAt[s] ? `<dt>Time in Stage ${s}</dt><dd>${dd(days(job.stageAt[s], job.stageAt[s + 1] || (job.stage === s ? NOW() : job.stageAt[s + 1])))}</dd>` : "").join("")}
    ${job.queueAt ? `<dt>Time in queue</dt><dd>${dd(days(job.queueAt, job.allocatedAt))}</dd>` : ""}</dl></div></div>`;
}
function stepHeader(job, n, extra) { const st = STEPS[n]; return `<div class="card-h"><span class="stepno">${pad2(n)}</span><h2>${esc(st.t)}</h2>${extra || ""}</div>`; }
function actionCard(job) {
  const p = P();
  if (job.stage === 4) return `<div class="card action"><div class="card-h" style="background:var(--green-ink)"><span class="stepno" style="color:var(--green-ink)">40</span><h2>Ready for lodgement</h2></div><div class="card-b"><div class="alert green">The rehydrated final workpaper v${job.wp.v} is ready (${fmtDT(job.doneAt)}). Lodgement and client sign-off happen outside this flow.</div><div class="btns"><button class="btn primary" data-act="tab" data-arg="${job.id}|wp">Open final workpaper</button><button class="btn" data-act="tab" data-arg="${job.id}|timeline">See the full timeline</button></div></div></div>`;
  const n = job.step, w = waitingOn(job), st = STEPS[n];
  let body;
  if (!canAct(job, p)) {
    const who = personaFor(w, job);
    const person = w === "client" ? job.client.first + " " + job.client.last + " (end client)" : who ? who.name + " — " + who.role : laneName(w);
    body = `<p class="small muted" style="margin-top:0">${esc(st.d)}</p><div class="waiting"><div style="flex:1;min-width:200px"><div class="small muted">Waiting on</div><b>${esc(person)}</b> ${laneChip(w)}<div class="small muted">Since ${fmtDT(job.entered[n])}</div></div>
      ${who ? `<button class="btn primary" data-act="persona" data-arg="${who.id}">Switch to ${esc(who.name)}</button>` : ""}${w === "client" && job.token ? `<button class="btn primary" data-act="go" data-arg="client/${job.token}">Open the client's link</button>` : ""}</div>
      ${n === 27 && p.roleKey !== "client" ? `<p class="small muted">The firm admin can also record answers the client gave by email or phone.</p>` : ""}`;
  } else body = (PANEL[n] || (() => `<p>${esc(st.d)}</p>`))(job);
  return `<div class="card action">${stepHeader(job, n, laneChip(w))}<div class="card-b">${body}</div></div>`;
}

/* ---------- action panels, one per human step ---------- */
const PANEL = {};
PANEL[2] = job => {
  const s = UI.st2[job.id] = UI.st2[job.id] || { py: null, cy: null, files: [] };
  const spec = CLIENTS.find(c => c.id === job.id);
  const prof = UI.cv["prof_" + job.id] || (spec && spec.prof) || "";
  return `<p class="small muted" style="margin-top:0">Upload what the end client sent. The platform then auto-fills the template (03), builds the weighted checklist (04) and runs the gap analysis (05).</p>
  <div class="fld"><div class="lbl">Profession / industry</div>${combo("prof_" + job.id, PROFESSIONS.map(x => ({ value: x.id, label: x.label, sub: x.sector })), prof, () => render(), { label: "Profession", placeholder: "Type e.g. nurse, electrician, retiree" })}<span class="hint">Drives the profession part of the checklist.</span></div>
  <div class="split">
    <div class="fld"><div class="lbl">Prior-year (PY) tax return & NOA</div>${s.py ? `<div class="alert green">✓ ${esc(s.py)} <button class="btn sm ghost" data-act="st2clear" data-arg="${job.id}|py">Remove</button></div>` : `<div class="btns"><label class="btn sm">Choose file<input type="file" class="sr" data-file="st2py" data-arg="${job.id}" accept=".pdf,.jpg,.png"></label><button class="btn sm ghost" data-act="st2sample" data-arg="${job.id}|py">Use sample</button></div>`}</div>
    <div class="fld"><div class="lbl">Current-year (CY) ATO pre-fill</div>${s.cy ? `<div class="alert green">✓ ${esc(s.cy)} <button class="btn sm ghost" data-act="st2clear" data-arg="${job.id}|cy">Remove</button></div>` : `<div class="btns"><label class="btn sm">Choose file<input type="file" class="sr" data-file="st2cy" data-arg="${job.id}" accept=".pdf"></label><button class="btn sm ghost" data-act="st2sample" data-arg="${job.id}|cy">Use sample</button></div>`}</div>
  </div>
  <div class="fld"><div class="lbl">Other documents from the client (optional)</div>
    <label class="drop" data-drop="${job.id}"><input type="file" class="sr" multiple data-file="st2docs" data-arg="${job.id}"><b>Drop files here or click to choose</b><div class="small muted">PDF, Word, Excel, photos. Up to 25 MB each.</div></label>
    <div class="btns" style="margin-top:8px"><button class="btn sm" data-act="st2bundle" data-arg="${job.id}" ${prof ? "" : "disabled"}>Add sample bundle from the client</button>${s.files.length ? `<span class="small">${s.files.length} file(s) ready</span> <button class="btn sm ghost" data-act="st2clear" data-arg="${job.id}|files">Clear</button>` : ""}</div>
    ${s.files.length ? `<ul class="small">${s.files.map(f => `<li>${esc(f.name)}</li>`).join("")}</ul>` : ""}</div>
  <div class="btns"><button class="btn primary" data-act="st2go" data-arg="${job.id}">Upload & run analysis</button><span class="small muted">Needs a profession, the PY return and the CY pre-fill.</span></div>`;
};
PANEL[5] = job => {
  const list = job.files.filter(f => f.outcome !== "matched" && f.outcome !== "discarded" && !f.checked);
  const opts = [{ value: "keep", label: "Leave as is — tell the firm" }, { value: "discard", label: "Not needed — discard" }].concat(job.items.map(i => ({ value: i.key, label: i.doc, sub: i.cat + " · " + { M: "Mandatory", E: "Essential", I: "Info" }[i.w] })));
  return `<div class="alert blue">${S.settings.gapMode === "carisma" ? "Option B: a Carisma processor / reviewer does the gap analysis for this job." : "Option A ran first. The AI agent was not sure about these files, so a Carisma processor / reviewer decides (AI first, Carisma fallback)."}</div>
  <div class="tbl-wrap"><table class="t"><thead><tr><th>File</th><th>AI reading</th><th style="min-width:260px">Your decision</th></tr></thead><tbody>${list.map(f => `<tr><td><b>${esc(f.name)}</b><div class="tiny muted">${f.structured ? "Structured" : "Unstructured (photo / scan)"}</div></td><td class="small">${outcomeBadge(f)}${f.suggest && ITEMS[f.suggest] ? `<div class="tiny">Looks like: ${esc(ITEMS[f.suggest].doc)}</div>` : ""}</td><td>${combo("res_" + f.id, opts, f.suggest && job.items.some(i => i.key === f.suggest) && !["wrong-year", "not-required"].includes(f.outcome) ? f.suggest : "keep", null, { label: "Decision for " + f.name })}</td></tr>`).join("") || `<tr><td colspan="3" class="empty">No files need a decision.</td></tr>`}</tbody></table></div>
  <div class="btns" style="margin-top:12px"><button class="btn primary" data-act="resolve" data-arg="${job.id}">Complete gap analysis</button><span class="small muted">Next: human review of the auto-filled data (06).</span></div>`;
};
PANEL[6] = job => {
  const m = metrics(job), todo = job.fields.filter(f => !f.ok).length;
  return `<p class="small muted" style="margin-top:0">Check each value the platform auto-filled. Correct anything that is wrong, then confirm. ${todo} of ${job.fields.length} fields are new or changed.</p>
  <div class="tbl-wrap"><table class="t"><thead><tr><th class="c">OK</th><th>Field</th><th>Value</th><th>Source</th><th class="num">Confidence</th></tr></thead><tbody>${job.fields.map(f => `<tr><td class="c"><input type="checkbox" data-fok="${f.k}" ${f.ok ? "checked" : ""} aria-label="Looks right: ${esc(f.label)}"></td><td>${esc(f.label)}</td><td><input type="text" data-fval="${f.k}" value="${esc(f.value)}" aria-label="${esc(f.label)}"></td><td class="small muted">${esc(f.src)}</td><td class="num ${f.conf < .8 ? "warn" : ""}">${Math.round(f.conf * 100)}%</td></tr>`).join("")}</tbody></table></div>
  <div class="alert ${m.ready ? "green" : "amber"}" style="margin-top:12px">When you confirm, the file is <b>${m.pct}%</b> complete${m.mMissing.length ? " with " + m.mMissing.length + " Mandatory missing" : ""}: ${m.ready ? "the firm is told the file is ready (11) and it goes to their prioritisation queue." : "the firm admin is emailed the " + m.missing.length + " missing items (07) and reminders start (10)."}</div>
  <div class="btns"><button class="btn" data-act="tickAll">Tick all</button><button class="btn primary" data-act="confirmFields" data-arg="${job.id}">Confirm reviewed data</button></div>`;
};
PANEL[8] = job => {
  const m = metrics(job), r = ruleFor(job.firm), added = job.files.filter(f => f.kind === "added" && f.round === job.loops.s1 + 1 && !f.outcome);
  const probs = job.files.filter(f => ["wrong-year", "not-required", "unmatched"].includes(f.outcome));
  return `${m.urgent ? `<div class="alert red"><b>Urgent:</b> the file is ${m.pct}% complete but a Mandatory document is missing, so it cannot move on.</div>` : ""}
  <p class="small muted" style="margin-top:0">Ask the client by email or call for the items below, then add the files here. Reminder ${job.rem.sent} of ${r.max} sent${job.rem.next ? "; next " + fmtD(job.rem.next) : ""}.</p>

  <div class="row"><div class="fld"><div class="lbl">Processor</div>${combo("wmPr_" + job.id, CARISMA_TEAM, d.processor || "", null, { label: "Processor" })}</div><div class="fld"><div class="lbl">Reviewer</div>${combo("wmRv_" + job.id, CARISMA_TEAM, d.reviewer || "", null, { label: "Reviewer" })}</div></div>
  <div class="row"><div class="fld"><label for="wmDue_${job.id}">Due date</label><input type="date" id="wmDue_${job.id}" value="${d.due || ""}"></div><div class="fld"><label for="wmHr_${job.id}">Budget hours</label><input type="number" min="0.5" step="0.5" id="wmHr_${job.id}" value="${d.hours || ""}"></div></div>
  <div class="btns"><button class="btn primary" data-act="wmSave" data-arg="${job.id}">Save WM job details</button><button class="btn" data-act="wmXpm" data-arg="${job.id}">Pull from XPM (future — demo)</button></div>`;
};
PANEL[18] = job => `<p style="margin-top:0">WM details are in (${esc(job.wm.details.cluster)}; processor ${esc(job.wm.details.processor)}, reviewer ${esc(job.wm.details.reviewer)}, due ${esc(job.wm.details.due)}).</p><div class="btns"><button class="btn primary" data-act="initiate" data-arg="${job.id}">Initiate ITR process</button></div><p class="small muted">The ITR Factory Agent then detects the Stage 1 documents (19).</p>`;
PANEL[19] = job => {
  const f = job.files.filter(x => x.outcome === "matched" && !["pyitr", "prefill"].includes(x.kind)), can = S.settings.extraUploadBy === "both" || S.settings.extraUploadBy === P().roleKey;
  return `<p style="margin-top:0">The ITR Factory Agent detected <b>${f.length}</b> documents from Stage 1 (${f.filter(x => x.structured).length} structured, ${f.filter(x => !x.structured).length} unstructured).</p>
  <div class="fld"><div class="lbl">Upload extra files (optional — e.g. late documents)</div>${can ? `<label class="drop"><input type="file" class="sr" multiple data-file="late" data-arg="${job.id}"><b>Drop late documents here</b></label><div class="btns" style="margin-top:8px"><button class="btn sm" data-act="lateSample" data-arg="${job.id}">Add a sample late document</button></div>` : `<div class="alert blue">Extra uploads at this step are done by: ${esc({ carisma: "the Carisma processor / reviewer", firm: "the accounting firm", both: "the firm or Carisma" }[S.settings.extraUploadBy])} (Rules & Decisions).</div>`}</div>
  <div class="btns"><button class="btn primary" data-act="continueDetect" data-arg="${job.id}">Continue to extraction (20–21)</button></div>`;
};
PANEL[22] = job => {
  const un = unstructured(job);
  return `<p class="small muted" style="margin-top:0">Structured files were extracted automatically. These unstructured files need a person: type the amount, or open the Redaction Tool to read it with personal details masked.</p>
  <div class="tbl-wrap"><table class="t"><thead><tr><th>File</th><th style="min-width:230px">ITR label</th><th>Amount</th><th>Method</th><th></th></tr></thead><tbody>${un.map(f => { const v = UI.ex["x_" + f.id] || {}; return `<tr><td><b>${esc(f.name)}</b><div class="tiny muted">${esc(ITEMS[f.itemKey] ? ITEMS[f.itemKey].doc : "")}</div></td><td>${combo("xl_" + f.id, ITR_LABELS, KEY_ITR[f.itemKey] || ITR_LABELS[0], null, { label: "ITR label" })}</td><td style="min-width:110px"><input type="number" min="0" step="0.01" data-xamt="${f.id}" value="${v.amount != null ? v.amount : ""}" placeholder="0.00" aria-label="Amount for ${esc(f.name)}"></td><td class="small">${v.method || "Manual"}</td><td><button class="btn sm" data-act="redact" data-arg="${job.id}|${f.id}">Redaction Tool</button></td></tr>`; }).join("")}</tbody></table></div>
  <div class="btns" style="margin-top:12px"><button class="btn" data-act="redactAll" data-arg="${job.id}">Fill all with the Redaction Tool</button><button class="btn primary" data-act="extract" data-arg="${job.id}">Save to Tax information summary</button></div>`;
};
PANEL[25] = job => `<p class="small muted" style="margin-top:0">The ITR Processor Agent drafted these queries. Check who each one is for, edit the wording, then send them through the Query portal.</p>
  ${job.queries.map((q, k) => `<div class="qcard"><div class="qh"><b>Q${k + 1}</b><div style="min-width:220px">${combo("qa_" + q.id, [{ value: "firm", label: "Accounting firm query" }, { value: "client", label: "End-client query" }], q.aud, v => { q.aud = v; save(); }, { label: "Audience" })}</div><button class="btn sm ghost danger" data-act="qdel" data-arg="${job.id}|${q.id}">Remove</button></div><textarea data-qtext="${q.id}" aria-label="Query ${k + 1}">${esc(q.text)}</textarea></div>`).join("")}
  <div class="row"><div class="fld"><label for="qnew_${job.id}">Add a query</label><input type="text" id="qnew_${job.id}" placeholder="Type the question"></div><div class="fld"><div class="lbl">For</div>${combo("qnewa_" + job.id, [{ value: "client", label: "End client" }, { value: "firm", label: "Accounting firm" }], "client", null, { label: "For" })}</div></div>
  <div class="btns"><button class="btn" data-act="qadd" data-arg="${job.id}">Add query</button><button class="btn primary" data-act="sendQ" data-arg="${job.id}">Send via Query portal (${job.queries.filter(q => q.aud === "firm").length} firm, ${job.queries.filter(q => q.aud === "client").length} client)</button></div>`;
PANEL[26] = job => {
  const fq = job.queries.filter(q => q.aud === "firm"), cq = job.queries.filter(q => q.aud === "client");
  return `<h3 style="margin:0 0 8px;font-size:15px">Your queries (${fq.length})</h3>${fq.map(q => `<div class="qcard"><div class="small"><b>${esc(q.text)}</b></div><textarea data-qans="${q.id}" placeholder="Your answer" aria-label="Answer">${esc(q.ans)}</textarea><button class="btn sm ghost" data-act="qdef" data-arg="${q.id}">Use sample answer</button></div>`).join("") || `<p class="muted small">None.</p>`}
  <h3 style="margin:14px 0 8px;font-size:15px">For the end client (${cq.length})</h3>${cq.map(q => `<div class="qcard small">${esc(q.text)}</div>`).join("") || `<p class="muted small">None.</p>`}
  ${cq.length ? `<div class="alert blue">${S.settings.clientLink ? "These go to " + esc(job.client.email) + " as a secure link. Answers come back to you to forward (28)." : "Ask the client by email or phone, then record the answers at step 27."}</div>` : ""}
  <div class="btns"><button class="btn primary" data-act="firmAns" data-arg="${job.id}">${S.settings.firmAnswerMode === "immediate" ? "Send my answers to Carisma now & forward client queries" : "Save answers & forward client queries"}</button></div>`;
};
PANEL[27] = job => `<p style="margin-top:0">${S.settings.clientLink && job.token ? `A secure link went to <b>${esc(job.client.email)}</b> on ${fmtD(job.entered[27])}.` : "Ask the client by email or phone."} If the client answered by email or phone, record the answers here.</p>
  ${job.queries.filter(q => q.aud === "client").map(q => `<div class="qcard"><div class="small"><b>${esc(q.text)}</b></div><textarea data-qans="${q.id}" placeholder="Client's answer">${esc(q.ans)}</textarea><button class="btn sm ghost" data-act="qdef" data-arg="${q.id}">Use sample answer</button></div>`).join("")}
  <div class="btns">${job.token ? `<button class="btn" data-act="go" data-arg="client/${job.token}">Open the client's link (demo)</button>` : ""}<button class="btn primary" data-act="recordClient" data-arg="${job.id}">Record the client's answers</button></div>`;
PANEL[28] = job => `<p class="small muted" style="margin-top:0">Check the answers, attach any files, then forward everything to Carisma through the Query portal.</p>
  ${job.queries.map(q => `<div class="qcard"><div class="qh"><span class="badge ${q.aud === "firm" ? "b-blue" : "b-red"}">${q.aud === "firm" ? "Firm" : "End client"}</span><b class="small">${esc(q.text)}</b></div><textarea data-qans="${q.id}">${esc(q.ans)}</textarea>${q.files.length ? `<div class="tiny">📎 ${q.files.map(esc).join(", ")}</div>` : ""}<label class="btn sm ghost">Attach file<input type="file" class="sr" data-file="qfile" data-arg="${job.id}|${q.id}"></label></div>`).join("")}
  <div class="btns"><button class="btn primary" data-act="forward" data-arg="${job.id}">Forward responses to Carisma</button></div>`;
PANEL[29] = job => `<p class="small muted" style="margin-top:0">Each answer suggests a change to the Tax information summary. Untick any you do not want, then update.</p>
  ${job.queries.map(q => `<label class="check"><input type="checkbox" data-tisq="${q.id}" checked><span><b>${esc(q.tis)}</b><br><span class="small muted">From: "${esc(q.ans)}"</span></span></label>`).join("")}
  <div class="btns"><button class="btn primary" data-act="updTis" data-arg="${job.id}">Update TIS & run the agent (30)</button></div>`;
PANEL[31] = job => `<p style="margin-top:0">Workpaper <b>v${job.wp.v}</b> is rehydrated with ${job.wp.links} file links. <button class="btn sm ghost" data-act="tab" data-arg="${job.id}|wp">Open workpaper</button></p>
  ${REVIEW_POINTS.map((r, k) => `<label class="check"><input type="checkbox" data-rp="${k}"><span>${esc(r)}</span></label>`).join("")}
  <div class="fld" style="margin-top:8px"><label for="rvnote_${job.id}">What is wrong? (needed for "Not OK")</label><input type="text" id="rvnote_${job.id}" placeholder="e.g. D5 link opens the wrong page"></div>
  <div class="btns"><button class="btn" data-act="tickAll">Tick all</button><button class="btn primary" data-act="reviewOk" data-arg="${job.id}">All OK → step 33</button><button class="btn danger" data-act="reviewNo" data-arg="${job.id}">Not OK → re-run from step 23</button></div>
  <p class="tiny muted">Step 32: a re-run starts at step 23 only — no new queries and no re-extraction.</p>`;
PANEL[33] = job => `<p style="margin-top:0">Manual review passed. Send workpaper v${job.wp.v} to ${esc(firmOf(job.firm).name)}; the job then moves to Stage 3.</p><div class="btns"><button class="btn primary" data-act="sendWP" data-arg="${job.id}">Send workpaper to firm</button></div>`;
PANEL[34] = job => {
  const redo = job.s3 && job.s3.rounds.length;
  return `${redo ? `<div class="alert blue">Carisma fixed the gaps from the last agent review. Confirm the checklist to run the review again.</div>` : ""}<p class="small muted" style="margin-top:0">Choose the checklist the ITR Reviewer Agent should use, and attach any instructions or end-client notes.</p>
  <div class="fld"><div class="lbl">Review checklist</div>${combo("cl_" + job.id, REVIEW_CHECKLISTS.map(c => ({ value: c.id, label: c.label, sub: c.sub })), job.s3.checklist || suggestChecklist(job), null, { label: "Checklist" })}<span class="hint">Suggested from the profession and PY return.</span></div>
  <div class="fld"><label for="s3n_${job.id}">Instructions or end-client notes</label><textarea id="s3n_${job.id}" placeholder="e.g. Client wants the franking refund; check the rental split">${esc(job.s3.notes)}</textarea></div>
  <div class="fld"><div class="lbl">Extra documents</div><div class="btns"><label class="btn sm">Attach file<input type="file" class="sr" multiple data-file="s3file" data-arg="${job.id}"></label><button class="btn sm ghost" data-act="s3sample" data-arg="${job.id}">Attach sample client notes</button></div>${(UI.ex["s3_" + job.id] || []).length ? `<div class="tiny">📎 ${(UI.ex["s3_" + job.id]).map(esc).join(", ")}</div>` : ""}</div>
  <div class="btns"><button class="btn primary" data-act="startReview" data-arg="${job.id}">Start agent review (35–37)</button></div>`;
};
PANEL[38] = job => { const r = job.s3.rounds.at(-1); return `<p class="small muted" style="margin-top:0">The ITR Reviewer Agent found ${r.gaps.length} gap(s) using "${esc(r.checklist)}". Note the fix for each, then re-run from step 23; the system fetches again (${S.settings.s3Return === 35 ? "step 35" : "firm re-selects at step 34"}).</p>
  ${r.gaps.map((g, k) => `<div class="qcard"><div class="small bad"><b>Gap ${k + 1}:</b> ${esc(g.text)}</div><input type="text" data-gfix="${k}" placeholder="How you fixed it (optional)"></div>`).join("")}
  <div class="btns"><button class="btn primary" data-act="fixGaps" data-arg="${job.id}">Fix in Stage 2 & re-run from step 23</button></div>`; };

function outcomeText(o) { return { matched: "Matched", "low-confidence": "Low confidence", "wrong-year": "Wrong year", "not-required": "Not needed", unmatched: "Not recognised", discarded: "Discarded" }[o] || "Not analysed"; }
function outcomeBadge(f) { const c = { matched: "b-green", "low-confidence": "b-amber", "wrong-year": "b-red", "not-required": "", unmatched: "b-red", discarded: "" }[f.outcome] || ""; return `<span class="badge ${c}">${outcomeText(f.outcome)}${f.conf != null && f.outcome ? " · " + Math.round(f.conf * 100) + "%" : ""}</span>`; }

/* ---------- job tabs ---------- */
const TABS = {
  docs(job) {
    if (!job.items.length) return `<p class="muted">No checklist yet — it is generated after the upload (step 02).</p>`;
    const cats = [...new Set(job.items.map(i => i.cat))];
    return `<div class="tbl-wrap"><table class="t"><thead><tr><th></th><th>Document</th><th>Why it is on the list</th><th>Status</th><th>File</th></tr></thead><tbody>${cats.map(c => `<tr><td colspan="5" style="background:var(--brand-soft);font-weight:700">${esc(c)}</td></tr>` + job.items.filter(i => i.cat === c).map(i => `<tr><td>${wBadge(i.w)}</td><td>${esc(i.doc)}</td><td class="small">${esc(i.src)}${i.custom ? " (added by firm)" : ""}</td><td>${i.status === "received" ? `<span class="badge b-green">Received</span>` : i.status === "na" ? `<span class="badge" title="${esc(i.naReason)}">Doesn't apply</span>` : `<span class="badge ${i.w === "M" ? "b-red" : "b-amber"}">Missing</span>`}</td><td class="small">${i.fileIds.map(id => esc((job.files.find(f => f.id === id) || {}).name)).join("<br>")}</td></tr>`).join("")).join("")}</tbody></table></div>
    <h3 style="font-size:15px;margin:18px 0 8px">All files (${job.files.length})</h3><div class="tbl-wrap"><table class="t"><thead><tr><th>File</th><th>Type</th><th>Gap analysis</th><th>Added</th></tr></thead><tbody>${job.files.map(f => `<tr><td>${esc(f.name)}</td><td class="small">${{ pyitr: "PY return", prefill: "CY pre-fill", bundle: "Client bundle", added: "Added at step 08", late: "Late (step 19)" }[f.kind] || f.kind} · ${f.structured ? "structured" : "unstructured"}</td><td>${outcomeBadge(f)}</td><td class="small">${fmtDT(f.at)}</td></tr>`).join("")}</tbody></table></div>`;
  },
  data(job) { return job.fields.length ? `<div class="tbl-wrap"><table class="t"><thead><tr><th>Field</th><th>Value</th><th>Source</th><th>Reviewed</th></tr></thead><tbody>${job.fields.map(f => `<tr><td>${esc(f.label)}</td><td><b>${esc(f.value)}</b></td><td class="small muted">${esc(f.src)}</td><td>${f.ok ? `<span class="badge b-green">Confirmed</span>` : `<span class="badge b-amber">To review</span>`}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted">The template is auto-filled at step 03.</p>`; },
  tis(job) { return `<p class="small muted" style="margin-top:0">Tax information summary — every line carries a reference to its source file.</p><div class="tbl-wrap"><table class="t"><thead><tr><th>ITR label</th><th>Detail</th><th class="num">Amount</th><th>File reference</th><th>Method</th></tr></thead><tbody>${job.tis.map(t => `<tr><td>${esc(t.label)}</td><td class="small">${esc(t.desc)}</td><td class="num">${t.amount != null ? money(t.amount) : "—"}</td><td class="small"><a href="#" data-act="fileRef" data-arg="${esc(t.ref)}">📎 ${esc(t.ref)}</a></td><td><span class="badge ${t.method === "Auto" ? "b-purple" : t.method === "Query response" ? "b-blue" : "b-amber"}">${esc(t.method)}</span></td></tr>`).join("")}</tbody></table></div>`; },
  queries(job) { return job.queries.map((q, k) => `<div class="qcard"><div class="qh"><b>Q${k + 1}</b><span class="badge ${q.aud === "firm" ? "b-blue" : "b-red"}">${q.aud === "firm" ? "Accounting firm" : "End client"}</span><span class="badge">${esc(q.status)}</span></div><div>${esc(q.text)}</div>${q.ans ? `<div class="small" style="margin-top:6px"><b>Answer${q.by ? " (" + esc(q.by) + ")" : ""}:</b> ${esc(q.ans)}</div>` : ""}${q.files.length ? `<div class="tiny">📎 ${q.files.map(esc).join(", ")}</div>` : ""}</div>`).join(""); },
  wp(job) {
    const g = {}; job.tis.forEach(t => (g[t.label] = g[t.label] || []).push(t));
    return `<div class="btns" style="margin-bottom:10px"><span class="badge ${job.wp.final ? "b-green" : job.wp.status === "Rehydrated" ? "b-purple" : "b-amber"}">${job.wp.final ? "Final" : job.wp.status} · v${job.wp.v}</span><span class="small muted">${job.wp.links} file links · updated ${fmtDT(job.wp.at)}</span><button class="btn sm" data-act="mockDl">Download workpaper (mock)</button></div>
    <div class="tbl-wrap"><table class="t"><thead><tr><th>Section</th><th>Line</th><th class="num">Amount</th><th>Evidence link</th></tr></thead><tbody>${Object.entries(g).map(([k, v]) => v.map((t, i) => `<tr><td>${i ? "" : `<b>${esc(k)}</b>`}</td><td class="small">${esc(t.desc)}</td><td class="num">${t.amount != null ? money(t.amount) : ""}</td><td class="small">${job.wp.status === "Rehydrated" ? `<a href="#" data-act="fileRef" data-arg="${esc(t.ref)}">🔗 ${esc(t.ref)}</a>` : `<span class="muted">link after step 30</span>`}</td></tr>`).join("")).join("")}</tbody></table></div>`;
  },
  review(job) { return job.s3.rounds.map((r, k) => `<div class="qcard"><div class="qh"><b>Review ${k + 1}</b><span class="small muted">${fmtDT(r.at)} · ${esc(r.checklist)}</span>${r.gaps.length ? `<span class="badge b-red">${r.gaps.length} gap(s)</span>` : `<span class="badge b-green">No gaps</span>`}</div>
    ${r.pts.map(x => `<div class="small">✓ ${esc(x.p)}</div>`).join("")}${r.gaps.map(g => `<div class="small bad">✗ ${esc(g.text)}${g.fixed ? ` <span class="badge b-green">Fixed</span> <span class="muted">${esc(g.note)}</span>` : ""}</div>`).join("")}</div>`).join("") + (job.s3.notes ? `<p class="small"><b>Firm notes:</b> ${esc(job.s3.notes)}</p>` : "") + (job.s3.files.length ? `<p class="small">📎 ${job.s3.files.map(esc).join(", ")}</p>` : ""); },
  timeline(job) { return `<ul class="tl">${job.timeline.slice().reverse().map(e => `<li><span class="n">${pad2(e.n)}</span><span><b>${esc(STEPS[e.n].t)}</b><br><span class="small">${esc(e.text)}</span></span><span class="small muted" style="text-align:right">${fmtDT(e.at)}<br>${esc(e.by)}</span></li>`).join("")}</ul>`; }
};

/* =================================== WORKFLOW MAP =================================== */
GUIDE.workflow = { title: "Workflow (40 steps)", what: "The v8 flow as swim lanes: who does each step in each stage, and how many jobs sit at each step right now.",
  steps: ["Pick a stage tab.", "Each box is one step; the number in the corner is how many jobs are waiting there.", "Click a box to list those jobs."],
  tips: ["Loops: Stage 1 repeats from step 03 until 80–90% and all Mandatory; Stage 2 re-runs from 23 after a failed review; Stage 3 sends gaps back to 23.", "Grey boxes are steps the platform or an agent runs by itself."] };
function pageWorkflow() {
  const s = +(UI.cv.wfStage || 1), st = STAGES[s - 1], J = visibleJobs();
  const lanes = ["client", "firm", "carisma", "ch", "platform", "mail"].filter(l => STEPS.slice(st.from, st.to + 1).some(x => x.lane === l) || (l === "client" && s === 1));
  const cols = STEPS.slice(st.from, st.to + 1);
  const loops = { 1: "Loop: step 09 re-runs from step " + pad2(S.settings.loopTarget) + " until " + S.settings.threshold + "% and every Mandatory document is present. Reminders (10) run meanwhile.", 2: "Loop: step 32 \"Not OK\" re-runs from step 23 only (no new queries, no re-extraction). Stage 3 gaps also come back to step 23.", 3: "Loop: gaps (37) go to step 38, which re-runs Stage 2 from step 23; the system then fetches again (step " + S.settings.s3Return + ")." };
  return head("Workflow — ITR v8", "From job received to ready for lodgement — 40 steps in 3 stages", "workflow", `<div style="min-width:280px">${combo("wfStage", STAGES.map(x => ({ value: String(x.n), label: "Stage " + x.n + " · " + x.name, sub: "Steps " + x.from + "–" + x.to })), String(s), () => render(), { label: "Stage" })}</div>`) +
  `<div class="card"><div class="card-h"><h2>Stage ${s} · ${st.name} (steps ${st.from}–${st.to})</h2></div><div class="card-b wf"><table style="min-width:${160 + cols.length * 118}px"><tbody>${lanes.map(l => `<tr><th class="lanehd">${laneChip(l)}</th>${cols.map(c => { const n = J.filter(j => j.step === c.n && j.stage !== 4).length; return `<td>${c.lane === l || (l === "client" && s === 1 && c.n === 1) ? (c.lane === l ? `<button class="wfstep l-${l}" data-act="go" data-arg="jobs?step=${c.n}" title="${esc(c.d)}">${n ? `<span class="cnt">${n}</span>` : ""}<b>${pad2(c.n)}</b>${esc(c.t)}</button>` : `<div class="small muted" style="padding:4px">ITR job received → sends documents</div>`) : ""}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div>
  <div class="card-b" style="padding-top:0"><div class="alert amber">${loops[s]}</div></div></div>
  <div class="card"><div class="card-h light"><h3>Step list — Stage ${s}</h3></div><div class="card-b tight tbl-wrap"><table class="t"><thead><tr><th>Step</th><th>Who</th><th>What happens</th><th class="num">Jobs here</th></tr></thead><tbody>${cols.map(c => `<tr><td><b>${pad2(c.n)}</b></td><td>${laneChip(c.lane)}</td><td><b>${esc(c.t)}</b><div class="small">${esc(c.d)}</div></td><td class="num">${J.filter(j => j.step === c.n && j.stage !== 4).length}</td></tr>`).join("")}</tbody></table></div></div>`;
}

/* =================================== PRIORITISATION QUEUE =================================== */
GUIDE.queue = { title: "Prioritisation queue (steps 12–13)", what: "Jobs whose files are ready (threshold met, all Mandatory in). The accounting firm ranks them and allocates each to Carisma.",
  steps: ["Use ▲ ▼ to put the most urgent job first.", "Click <b>Allocate to Carisma</b>. The job moves to Stage 2: a WorksManager job is created and the Cluster Head is told."],
  tips: ["Who allocates (firm, as drawn, or Carisma) is set in Rules & Decisions.", "Time in queue feeds the Turnaround Report."] };
function pageQueue() {
  const p = P(), groups = FIRMS.filter(f => p.roleKey !== "firm" || f.id === p.firm);
  return head("Prioritisation Queue", "Steps 12–13 · files that are ready, ranked by the firm", "queue") + groups.map(f => {
    const q = S.jobs.filter(j => j.firm === f.id && j.step === 12).sort((a, b) => a.priority - b.priority);
    const canAlloc = S.settings.allocateBy === "carisma" ? p.roleKey === "carisma" : p.roleKey === "firm" && p.firm === f.id;
    const canRank = p.roleKey === "firm" && p.firm === f.id;
    return `<div class="card"><div class="card-h"><h2>${esc(f.name)}</h2><span class="pill">${q.length}</span></div><div class="card-b tight tbl-wrap"><table class="t"><thead><tr><th class="c">#</th><th>Job</th><th>Profession</th><th>Complete</th><th>Ready since</th><th class="num">In queue</th><th></th></tr></thead><tbody>${q.map((j, k) => `<tr><td class="c"><b>${j.priority}</b></td><td><a href="#job/${j.id}"><b>${esc(j.client.first + " " + j.client.last)}</b></a><div class="tiny muted">${j.id}</div></td><td class="small">${esc(profOf(j.prof).label)}</td><td>${metrics(j).pct}%</td><td class="small">${fmtDT(j.queueAt)}</td><td class="num">${dd(days(j.queueAt))}</td><td><div class="btns">${canRank ? `<button class="btn sm" data-act="prio" data-arg="${j.id}|-1" ${k ? "" : "disabled"} aria-label="Move up">▲</button><button class="btn sm" data-act="prio" data-arg="${j.id}|1" ${k < q.length - 1 ? "" : "disabled"} aria-label="Move down">▼</button>` : ""}${canAlloc ? `<button class="btn sm primary" data-act="allocate" data-arg="${j.id}">Allocate to Carisma</button>` : `<span class="tiny muted">${S.settings.allocateBy === "carisma" ? "Carisma allocates" : "Firm allocates"}</span>`}</div></td></tr>`).join("") || `<tr><td colspan="7" class="empty">No ready files in the queue.</td></tr>`}</tbody></table></div></div>`;
  }).join("");
}

  <div class="card"><div class="card-b tight tbl-wrap"><table class="t"><thead><tr><th>Job</th><th>For</th><th>Query</th><th>Answer</th><th>Status</th><th>Waiting on</th></tr></thead><tbody>${rows.map(({ j, q }) => `<tr class="click" data-act="go" data-arg="job/${j.id}"><td><b>${esc(j.client.first + " " + j.client.last)}</b><div class="tiny muted">${j.id}</div></td><td><span class="badge ${q.aud === "firm" ? "b-blue" : "b-red"}">${q.aud === "firm" ? "Firm" : "End client"}</span></td><td class="small">${esc(q.text)}</td><td class="small">${esc(q.ans || "—")}</td><td><span class="badge">${esc(q.status)}</span></td><td>${j.step >= 25 && j.step <= 29 ? laneChip(waitingOn(j)) : "—"}</td></tr>`).join("") || `<tr><td colspan="6" class="empty">No queries match.</td></tr>`}</tbody></table></div></div>`;
}

/* =================================== TURNAROUND REPORT =================================== */
GUIDE.turnaround = { title: "Turnaround Report", what: "How long each job spends in each stage and in the prioritisation queue, and how often it loops. Built from the job timelines.",
  steps: ["Pick a firm and a stage filter in the maroon header.", "Read across a row: days in Stage 1, queue, Stage 2, Stage 3 and total.", "Compare firms in the second table."],
  tips: ["A high Stage 1 loop count usually means the first document request was incomplete.", "Times include weekends."] };
function stageTimes(j) {
  const end = s => j.stageAt[s + 1] || (j.stage === s ? NOW() : null);
  const s1 = j.stageAt[1] ? days(j.stageAt[1], j.queueAt || end(1) || NOW()) : 0;
  const q = j.queueAt ? days(j.queueAt, j.allocatedAt || NOW()) : 0;
  const s2 = j.stageAt[2] ? days(j.stageAt[2], end(2) || NOW()) : 0;
  const s3 = j.stageAt[3] ? days(j.stageAt[3], end(3) || NOW()) : 0;
  return { s1, q, s2, s3, tot: days(j.stageAt[1], j.doneAt || NOW()) };
}
function pageTurnaround() {
  const p = P(), fF = UI.cv.taFirm || "all", fS = UI.cv.taStage || "all";
  const J = visibleJobs().filter(j => (fF === "all" || j.firm === fF) && (fS === "all" || String(j.stage) === fS));
  const T = J.map(j => ({ j, t: stageTimes(j) }));
  const avg = (arr, k) => arr.length ? arr.reduce((a, b) => a + b[k], 0) / arr.length : 0;
  const cell = v => v ? v.toFixed(1) : "—";
  return `<div class="pagehead center"><div class="grow"><h1>Turnaround Report</h1></div>${infoBtn("turnaround")}</div>
  <div class="card" style="border:1px solid var(--brand)"><div class="card-h"><h2>Stage Timers & Loops — by Job</h2><div style="min-width:170px">${combo("taStage", [{ value: "all", label: "All stages" }, { value: "1", label: "Stage 1" }, { value: "2", label: "Stage 2" }, { value: "3", label: "Stage 3" }, { value: "4", label: "Ready for lodgement" }], fS, () => render(), { label: "Stage" })}</div>${p.roleKey === "firm" ? "" : `<div style="min-width:200px">${combo("taFirm", [{ value: "all", label: "All firms" }].concat(FIRMS.map(f => ({ value: f.id, label: f.name }))), fF, () => render(), { label: "Firm" })}</div>`}</div>
  <div class="card-b tight tbl-wrap"><table class="t"><thead><tr><th rowspan="2" class="c">S.No</th><th rowspan="2">Job</th><th rowspan="2">Firm</th><th colspan="5" class="grp">Days</th><th colspan="3" class="grp">Loops</th><th rowspan="2">Status</th></tr><tr><th class="num">Stage 1</th><th class="num">Queue</th><th class="num">Stage 2</th><th class="num">Stage 3</th><th class="num">Total</th><th class="c">S1</th><th class="c">S2</th><th class="c">S3</th></tr></thead><tbody>
  ${T.map(({ j, t }, k) => `<tr class="click" data-act="go" data-arg="job/${j.id}"><td class="c">${k + 1}</td><td><b>${esc(j.client.first + " " + j.client.last)}</b><div class="tiny muted">${j.id}</div></td><td class="small">${esc(firmOf(j.firm).name)}</td><td class="num">${cell(t.s1)}</td><td class="num">${cell(t.q)}</td><td class="num">${cell(t.s2)}</td><td class="num">${cell(t.s3)}</td><td class="num"><b>${t.tot.toFixed(1)}</b></td><td class="c ${j.loops.s1 >= S.settings.loopEscalate ? "bad" : ""}">${j.loops.s1}</td><td class="c">${j.loops.s2}</td><td class="c">${j.loops.s3}</td><td class="small">${esc(statusText(j))}</td></tr>`).join("")}
  </tbody><tfoot><tr><td></td><td>Average</td><td></td><td class="num">${avg(T.map(x => x.t), "s1").toFixed(1)}</td><td class="num">${avg(T.map(x => x.t), "q").toFixed(1)}</td><td class="num">${avg(T.map(x => x.t), "s2").toFixed(1)}</td><td class="num">${avg(T.map(x => x.t), "s3").toFixed(1)}</td><td class="num">${avg(T.map(x => x.t), "tot").toFixed(1)}</td><td class="c">${(J.reduce((a, j) => a + j.loops.s1, 0) / Math.max(1, J.length)).toFixed(1)}</td><td class="c">${(J.reduce((a, j) => a + j.loops.s2, 0) / Math.max(1, J.length)).toFixed(1)}</td><td class="c">${(J.reduce((a, j) => a + j.loops.s3, 0) / Math.max(1, J.length)).toFixed(1)}</td><td></td></tr></tfoot></table></div></div>
  <div class="card"><div class="card-h"><h2>By Accounting Firm</h2></div><div class="card-b tight tbl-wrap"><table class="t"><thead><tr><th>Firm</th><th class="num">Jobs</th><th class="num">Avg Stage 1 (d)</th><th class="num">Avg queue (d)</th><th class="num">Avg Stage 2 (d)</th><th class="num">Avg Stage 3 (d)</th><th class="num">Reminders sent</th><th class="num">Ready for lodgement</th></tr></thead><tbody>${FIRMS.filter(f => p.roleKey !== "firm" || f.id === p.firm).map(f => { const X = S.jobs.filter(j => j.firm === f.id), TT = X.map(stageTimes); return `<tr><td><b>${esc(f.name)}</b></td><td class="num">${X.length}</td><td class="num">${avg(TT, "s1").toFixed(1)}</td><td class="num">${avg(TT, "q").toFixed(1)}</td><td class="num">${avg(TT, "s2").toFixed(1)}</td><td class="num">${avg(TT, "s3").toFixed(1)}</td><td class="num">${X.reduce((a, j) => a + j.rem.sent, 0)}</td><td class="num">${X.filter(j => j.stage === 4).length}</td></tr>`; }).join("")}</tbody></table></div></div>`;
}

  ["loopTarget", "Step 09 — where does the loop go back to?", [[3, "Step 03 auto-fill", "As drawn"], [5, "Step 05 gap analysis", ""]]],
  ["allocateBy", "Step 13 — who allocates the job to Carisma?", [["firm", "The accounting firm", "As drawn"], ["carisma", "Carisma", ""]]],
