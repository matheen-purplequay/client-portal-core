<!-- Generic report grid used by Workflow, Budget Overview, Turnaround, Movement (report), MOM and Feedback.
     Behaviour and columns come from CONFIGS in assets/js/pages/dev-screens.js, keyed by the last segment of the route. -->
<div x-data="gridPage($store.app.route.split('/').pop())">
  <div x-show="loading" class="py-24 text-center text-sm text-slate-400">Loading…</div>
  <template x-if="!loading">
    <div>
      <!-- title -->
      <div class="mb-4" :class="name === 'turnaround-report' && 'text-center'">
        <h1 class="text-2xl font-bold leading-tight text-slate-800" x-text="cfg.title"></h1>
        <p x-show="cfg.desc" class="mt-1 text-sm text-slate-500" x-text="cfg.desc"></p>
      </div>

      <!-- vertical tabs -->
      <div x-show="cfg.tabs" class="mb-4 inline-flex flex-wrap overflow-hidden rounded-md border border-slate-300 bg-white shadow">
        <button class="border-r border-slate-200 px-4 py-1.5 text-[13px] font-medium" :class="vertical === '' ? 'bg-[#dbe6f5] text-navy' : 'text-slate-700 hover:bg-slate-50'" @click="setVertical('')">All</button>
        <template x-for="v in verticals" :key="v.code">
          <button class="border-r border-slate-200 px-4 py-1.5 text-[13px] font-medium last:border-0" :class="vertical === v.title ? 'bg-[#dbe6f5] text-navy' : 'text-slate-700 hover:bg-slate-50'" @click="setVertical(v.title)" x-text="v.title"></button>
        </template>
      </div>

      <!-- movement: period filter -->
      <div x-show="cfg.period" class="card mb-4 overflow-hidden">
        <div class="bg-brand px-4 py-2 text-sm font-bold text-white">Filters</div>
        <div class="p-4">
          <label class="mb-1 block text-xs font-semibold">Period</label>
          <div class="flex flex-wrap items-end gap-2">
            <select class="field" x-model="period"><option value="7d">Last 7 days</option><option value="14d">Last 14 days</option><option value="1m">Last 1 month</option><option value="custom">Custom</option></select>
            <template x-if="period === 'custom'"><div class="flex items-end gap-2">
              <div><label class="mb-1 block text-xs text-slate-500">From</label><input type="date" class="field" x-model="customFrom"></div>
              <div><label class="mb-1 block text-xs text-slate-500">To</label><input type="date" class="field" x-model="customTo"></div></div></template>
            <button class="inline-flex items-center gap-1 rounded-md bg-brand px-4 py-2 text-[13px] font-semibold text-white" @click="applyPeriod()"><span class="msym !text-[16px]">search</span>Apply</button>
          </div>
        </div>
      </div>

      <!-- mom: date range -->
      <div x-show="cfg.dateRange" class="mb-4 flex flex-wrap items-end gap-2">
        <div><label class="mb-1 block text-xs text-slate-500">From</label><input type="date" class="field" x-model="dateFrom" @input="tbl.reset()"></div>
        <div><label class="mb-1 block text-xs text-slate-500">To</label><input type="date" class="field" x-model="dateTo" @input="tbl.reset()"></div>
        <button class="rounded-md border border-slate-300 bg-white px-4 py-2 text-[13px] text-slate-500 hover:text-brand" x-show="dateFrom || dateTo" @click="dateFrom = ''; dateTo = ''; tbl.reset()">Clear</button>
      </div>

      <!-- turnaround: open / closed toggle + bucket cards -->
      <template x-if="cfg.cardsFirst === 'toggle'">
        <div class="mb-3">
          <div class="mb-3 grid grid-cols-2 gap-3">
            <button class="rounded-xl bg-white p-3 text-center shadow" :class="jobStatus === 'open' && 'ring-2 ring-brand'" @click="setJobStatus('open')">
              <div class="text-[11px] font-semibold uppercase text-slate-500">Open Jobs</div><div class="text-3xl font-bold text-slate-800" x-text="openCount"></div><div class="text-[10px] uppercase text-slate-400">Jobs</div></button>
            <button class="rounded-xl bg-white p-3 text-center shadow" :class="jobStatus === 'closed' && 'ring-2 ring-brand'" @click="setJobStatus('closed')">
              <div class="text-[11px] font-semibold uppercase text-slate-500">Closed Jobs</div><div class="text-3xl font-bold text-slate-800" x-text="closedCount"></div><div class="text-[10px] uppercase text-slate-400">Jobs</div></button>
          </div>
          <div class="grid grid-cols-2 gap-2 sm:grid-cols-4 lg:grid-cols-7">
            <template x-for="b in buckets" :key="b.label">
              <div class="rounded-xl border-b-4 bg-white p-2 text-center shadow" :class="tones[b.tone]">
                <div class="text-[10px] font-semibold uppercase" x-text="b.label"></div><div class="text-2xl font-bold" x-text="b.value"></div><div class="text-[10px] uppercase opacity-60">Jobs</div></div>
            </template>
          </div>
        </div>
      </template>

      <!-- stat cards (click to filter the table) -->
      <div x-show="cards.length" class="mb-4 grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-6">
        <template x-for="c in cards" :key="c.key">
          <button class="rounded-xl border-b-4 bg-white p-3 text-center shadow" :class="[tones[c.tone], card === c.key && 'ring-2 ring-brand', c.static && 'cursor-default']" @click="selectCard(c)">
            <div class="text-[11px] font-semibold uppercase" x-text="c.label"></div>
            <div class="mt-1 font-bold" :class="c.static ? 'text-2xl' : 'text-3xl'" x-text="c.value"></div>
            <div class="mt-0.5 text-[10px] uppercase opacity-60" x-text="c.unit"></div>
          </button>
        </template>
      </div>

      <!-- table card -->
      <div class="overflow-hidden rounded-2xl border border-brand bg-white shadow-sm">
        <div class="flex flex-wrap items-center justify-between gap-2 bg-brand px-4 py-2.5 text-white">
          <div class="font-bold" x-text="tableTitle"></div>
          <div class="flex items-center gap-2">
            <button x-show="hasFilters" class="rounded-md border border-white/40 px-3 py-1 text-xs font-semibold hover:bg-white/10" @click="clearFilters()">Clear Filters</button>
            <button x-show="cfg.export" class="inline-flex items-center gap-1 rounded-md border border-white/40 px-3 py-1 text-xs font-semibold hover:bg-white/10" @click="CP.download(cfg.title + '.xlsx')"><span class="msym !text-[16px]">file_export</span>Export To Excel</button>
            <button x-show="cfg.refresh" title="Refresh" class="grid h-7 w-7 place-items-center rounded-full hover:bg-white/10" @click="refresh()"><span class="msym !text-[20px]" :class="refreshing && 'animate-spin'">refresh</span></button>
          </div>
        </div>
        <div class="overflow-x-auto">
          <table class="tbl min-w-full">
            <thead>
              <tr><template x-for="c in cfg.columns" :key="c.key">
                <th :class="c.action && 'text-center'" @click="!c.action && !c.view && tbl.sortBy(c.key)"><span x-text="c.label"></span><span x-show="tbl.sortKey === c.key" class="text-[9px]" x-text="tbl.dir > 0 ? ' ▲' : ' ▼'"></span></th>
              </template></tr>
              <tr class="bg-white"><template x-for="c in cfg.columns" :key="c.key">
                <th class="!cursor-default !py-1.5 font-normal">
                  <template x-if="c.filter === 'text'"><input class="field w-full !py-1 text-xs" placeholder="Search..." x-model="filters[c.key]" @input="tbl.reset()"></template>
                  <template x-if="c.filter === 'select'"><select class="field w-full !py-1 text-xs" x-model="filters[c.key]" @change="tbl.reset()"><option value="" x-text="c.all"></option><template x-for="o in opts(c.key)" :key="o"><option :value="o" x-text="o"></option></template></select></template>
                </th>
              </template></tr>
            </thead>
            <tbody>
              <template x-for="(r, i) in tbl.slice" :key="i">
                <tr :class="r.over && '!bg-red-50'"><template x-for="c in cfg.columns" :key="c.key">
                  <td :class="[c.bold && 'font-medium', c.variance && r.over && 'font-semibold text-red-600', c.variance && !r.over && 'text-green-700', c.action && 'text-center']">
                    <template x-if="c.view"><button class="rounded-md border border-slate-300 px-2 py-0.5 text-brand hover:bg-brand-lighter" title="View description" @click="viewRow = r"><span class="msym !text-[18px]">visibility</span></button></template>
                    <template x-if="c.action"><button class="rounded-md border border-brand px-3 py-0.5 text-xs font-semibold text-brand hover:bg-brand hover:text-white" @click="openSurvey(r)" x-text="r[c.key]"></button></template>
                    <template x-if="!c.view && !c.action"><span x-text="cell(r, c)"></span></template>
                  </td>
                </template></tr>
              </template>
            </tbody>
          </table>
          <div x-show="!tbl.total" class="py-10 text-center text-sm text-slate-400" x-text="hasFilters ? 'No rows match the selected filters.' : (cfg.empty || 'No records found.')"></div>
        </div>
        <div x-component="'pagination-status'"></div>
      </div>

      <!-- MOM description viewer -->
      <template x-if="viewRow">
        <div class="fixed inset-0 z-[80] grid place-items-center bg-black/50 p-4" @click.self="viewRow = null">
          <div class="max-h-[80vh] w-full max-w-2xl overflow-y-auto rounded-xl bg-white shadow-xl">
            <div class="flex items-center justify-between border-b px-5 py-3"><h5 class="font-semibold" x-text="(viewRow?.client_name || '') + ' — ' + D(viewRow?.date)"></h5><button @click="viewRow = null"><span class="msym">close</span></button></div>
            <div class="space-y-2 p-5 text-sm [&_ol]:list-decimal [&_ol]:pl-5 [&_ul]:list-disc [&_ul]:pl-5" x-html="viewRow?.description"></div>
          </div>
        </div>
      </template>

      <!-- feedback survey -->
      <template x-if="surveyRow">
        <div class="fixed inset-0 z-[80] grid place-items-center bg-black/50 p-4" @click.self="surveyRow = null">
          <div class="max-h-[90vh] w-full max-w-xl overflow-y-auto rounded-xl bg-white shadow-xl">
            <div class="flex items-center justify-between bg-brand px-5 py-3 text-white"><div class="font-bold" x-text="surveys[surveyRow?.job_id] ? 'Edit Feedback' : 'Add Feedback'"></div><button @click="surveyRow = null"><span class="msym">close</span></button></div>
            <div class="space-y-4 p-5 text-sm">
              <div class="text-slate-500" x-text="(surveyRow?.job_name || '') + ' — ' + (surveyRow?.received_from || '')"></div>
              <div><div class="mb-1 font-semibold">1. Overall, how satisfied are you with the job completed?</div>
                <template x-for="o in ratings"><label class="block"><input type="radio" class="mr-2" name="q1" :value="o" x-model="survey.overall_satisfaction"><span x-text="o"></span></label></template></div>
              <div><div class="mb-1 font-semibold">2. Please share any additional insights on the above question.</div><textarea rows="3" class="field w-full" x-model="survey.overall_insights"></textarea></div>
              <div><div class="mb-1 font-semibold">3. How responsive have we been to your queries about the job?</div>
                <template x-for="o in ratings"><label class="block"><input type="radio" class="mr-2" name="q3" :value="o" x-model="survey.responsiveness"><span x-text="o"></span></label></template></div>
              <div><div class="mb-1 font-semibold">4. Please share any additional insights on the above question.</div><textarea rows="3" class="field w-full" x-model="survey.responsiveness_insights"></textarea></div>
              <div><div class="mb-1 font-semibold">5. What can be improved or enhanced in the job delivery?</div><textarea rows="3" class="field w-full" x-model="survey.improvements"></textarea></div>
              <div x-show="surveyError" class="text-red-600" x-text="surveyError"></div>
              <div class="flex justify-end gap-2"><button class="rounded-md border border-slate-300 px-4 py-1.5" @click="surveyRow = null">Cancel</button><button class="rounded-md bg-brand px-4 py-1.5 font-semibold text-white" @click="submitSurvey()">Submit</button></div>
            </div>
          </div>
        </div>
      </template>
    </div>
  </template>
</div>
