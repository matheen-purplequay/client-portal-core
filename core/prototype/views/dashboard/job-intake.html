<div x-data="jobIntakePage">
  <div x-show="loading" class="py-24 text-center text-sm text-slate-400">Loading…</div>
  <template x-if="!loading">
    <div>
      <div class="mb-4 flex flex-wrap items-start justify-between gap-3">
        <div>
          <h1 class="text-xl font-semibold leading-tight">Job Intake</h1>
          <p class="text-[13px] text-slate-500">Collecting documents from your clients, before a job is allocated to Carisma.</p>
        </div>
        <button class="flex items-center gap-1 rounded-full bg-brand px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-brand-dark" @click="openNew()">
          <span class="msym !text-[18px]">add</span>New Job</button>
      </div>

      <div class="mb-4 grid grid-cols-2 gap-3 lg:grid-cols-4">
        <template x-for="t in [['collecting','Collecting documents','text-amber-600'],['urgent','Needs attention','text-red-700'],['queued','In prioritisation queue','text-blue-700'],['ready','Ready to allocate','text-green-700']]" :key="t[0]">
          <button class="rounded-xl border bg-white p-4 text-left shadow-sm transition hover:-translate-y-0.5" :class="tile === t[0] && 'ring-2 ring-brand'" @click="setTile(t[0])">
            <div class="text-sm text-slate-500" x-text="t[1]"></div>
            <div class="mt-1 text-3xl font-semibold" :class="t[2]" x-text="count(t[0])"></div>
          </button>
        </template>
      </div>

      <label class="mb-3 flex w-72 items-center gap-2 rounded-full bg-white px-3 py-1.5 shadow-sm">
        <span class="msym text-slate-400">search</span>
        <input type="search" placeholder="Search by client or profession…" class="w-full border-0 bg-transparent p-0 text-[13px] focus:ring-0" x-model="q">
      </label>

      <div class="space-y-3">
        <template x-for="j in rows" :key="j.intake_id">
          <article class="rounded-xl border bg-white p-4 shadow-sm">
            <div class="flex flex-wrap items-start justify-between gap-3">
              <button class="flex items-start gap-3 text-left" @click="toggleOpen(j)">
                <span class="msym mt-0.5 text-slate-400" x-text="open[j.intake_id] ? 'expand_more' : 'chevron_right'"></span>
                <div>
                  <div class="flex items-center gap-2">
                    <span class="font-semibold" x-text="j.client_name"></span>
                    <span x-show="j.priority" class="rounded-full bg-slate-100 px-2 py-0.5 text-[11px] font-semibold text-slate-500" x-text="'Queue #' + j.priority"></span>
                  </div>
                  <div class="text-xs text-slate-500" x-text="j.profession_label"></div>
                </div>
              </button>
              <div class="flex items-center gap-2">
                <span class="inline-block rounded-full px-2.5 py-0.5 text-xs font-medium"
                  :class="{ amber: 'bg-amber-100 text-amber-800', red: 'bg-red-100 text-red-800', blue: 'bg-blue-100 text-blue-800', green: 'bg-green-100 text-green-800' }[tone(j)]"
                  x-text="label(j.status)"></span>
                <span class="text-sm font-semibold text-slate-600" x-text="j.completion_pct + '%'"></span>
              </div>
            </div>

            <div class="mt-2 ml-8 h-2 rounded-full bg-slate-100">
              <div class="h-2 rounded-full" :class="{ amber: 'bg-amber-500', red: 'bg-red-600', blue: 'bg-blue-500', green: 'bg-green-600' }[tone(j)]" :style="'width:' + j.completion_pct + '%'"></div>
            </div>
            <div class="ml-8 mt-1 flex flex-wrap items-center gap-3 text-[11px] text-slate-400">
              <span x-text="'Started ' + CP.fmt.dmy(j.created_on)"></span>
              <span x-text="'Updated ' + CP.fmt.dmy(j.last_update)"></span>
              <span x-show="j.mMissing.length" class="font-semibold text-red-600" x-text="j.mMissing.length + ' mandatory document' + (j.mMissing.length > 1 ? 's' : '') + ' missing'"></span>
            </div>

            <div x-show="open[j.intake_id]" x-transition class="ml-8 mt-3 space-y-1 border-t pt-3">
              <template x-for="c in j.checklist" :key="c.key">
                <label class="flex items-center gap-3 rounded-lg px-2 py-1.5 text-sm hover:bg-slate-50">
                  <input type="checkbox" class="rounded border-slate-300 text-brand focus:ring-brand" :checked="c.status === 'received'" @change="toggleDoc(j, c)">
                  <span class="w-6 shrink-0 rounded text-center text-[10px] font-bold"
                    :class="{ M: 'bg-red-100 text-red-700', E: 'bg-amber-100 text-amber-800', I: 'bg-blue-100 text-blue-700' }[c.weight]" x-text="c.weight"></span>
                  <span class="flex-1" :class="c.status === 'received' ? 'text-slate-700' : 'text-slate-500'" x-text="c.doc"></span>
                  <span class="text-xs text-slate-400" x-text="c.category"></span>
                </label>
              </template>
              <p class="pt-1 text-[11px] text-slate-400">M = Mandatory · E = Essential · I = Info. A job is ready once it reaches 85% (weighted) with every Mandatory document in.</p>
            </div>

            <div class="ml-8 mt-3 flex flex-wrap gap-2">
              <button class="rounded-md border px-3 py-1.5 text-xs font-semibold text-slate-600 hover:border-brand hover:text-brand" @click="remind(j)"><span class="msym !text-[15px] align-middle">mail</span> Send reminder</button>
              <template x-if="j.status === 'queued'">
                <span class="inline-flex items-center gap-1">
                  <button class="rounded-md border px-2 py-1.5 text-xs font-semibold text-slate-500 hover:border-brand hover:text-brand" @click="move(j, -1)">▲</button>
                  <button class="rounded-md border px-2 py-1.5 text-xs font-semibold text-slate-500 hover:border-brand hover:text-brand" @click="move(j, 1)">▼</button>
                </span>
              </template>
              <button x-show="j.status === 'ready'" class="rounded-md border border-blue-300 bg-blue-50 px-3 py-1.5 text-xs font-semibold text-blue-700 hover:bg-blue-100" @click="queueIt(j)">Move to prioritisation queue</button>
              <button x-show="j.status === 'queued' || j.status === 'ready'" class="rounded-md bg-brand px-3 py-1.5 text-xs font-semibold text-white hover:bg-brand-dark" @click="allocate(j)">Allocate to Carisma</button>
            </div>
          </article>
        </template>
        <div x-show="!rows.length" class="py-16 text-center text-sm text-slate-400">No jobs match this selection.</div>
      </div>

      <div x-show="showNew" x-transition.opacity class="fixed inset-0 z-40 flex items-center justify-center bg-black/30 p-4" @click.self="showNew = false">
        <div class="w-full max-w-md rounded-xl bg-white p-5 shadow-xl">
          <h3 class="mb-3 text-lg font-semibold">New Job</h3>
          <form class="space-y-3" @submit.prevent="createJob()">
            <label class="block text-xs font-semibold text-slate-500">Client name
              <input required class="mt-1 w-full rounded-lg border-slate-300 text-sm focus:border-brand focus:ring-brand" x-model="form.name" placeholder="e.g. Jack Thompson"></label>
            <label class="block text-xs font-semibold text-slate-500">Profession
              <select class="mt-1 w-full rounded-lg border-slate-300 text-sm focus:border-brand focus:ring-brand" x-model="form.profession">
                <template x-for="p in professions" :key="p.id"><option :value="p.id" x-text="p.label"></option></template>
              </select></label>
            <label class="block text-xs font-semibold text-slate-500">Notes (optional)
              <textarea rows="2" class="mt-1 w-full rounded-lg border-slate-300 text-sm focus:border-brand focus:ring-brand" x-model="form.notes"></textarea></label>
            <p class="text-[11px] text-slate-400">Starts the job and creates its document checklist from the chosen profession. The client will need to provide each item before the job can be allocated to Carisma.</p>
            <div class="flex justify-end gap-2 pt-1">
              <button type="button" class="rounded-md px-3 py-1.5 text-sm text-slate-500" @click="showNew = false">Cancel</button>
              <button class="rounded-md bg-brand px-4 py-1.5 text-sm font-semibold text-white hover:bg-brand-dark">Create job</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </template>
</div>
