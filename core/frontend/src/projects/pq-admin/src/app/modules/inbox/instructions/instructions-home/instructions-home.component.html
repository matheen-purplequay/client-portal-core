<div class="inbox-container container">
    <div class="row">
        <div class="col-sm-12">
            <div class="container">
                <div class="row bg-white shadow-sm rounded">
                    <div class="px-2 px-sm-0" [ngClass]="(jobInstruction.jobid != 0)? 'col-sm-3' : 'col-sm-12'">
                        <app-inbox-list #appInboxList (selected)="getJobInstructions($event)"></app-inbox-list>
                    </div>
                    <div class="border-start" [ngClass]="(jobInstruction.jobid != 0)? 'col-sm-6' : 'col-sm-9'">
                        <app-inbox-messages [comments]="comments" [job]="jobInstruction" [jobID]="jobInstruction.Aid" [project_id]="jobInstruction.Pid" [isCommentsLoading]="isCommentsLoading" (sentComment)="refreshJobInstructions(); appInboxList.getJobInstructions();"></app-inbox-messages>
                    </div>
                    <div *ngIf="jobInstruction.jobid != 0"
                        class="col-sm-3 py-2 px-3">
                        <div class="h6">More details</div>

                        <section>
                            <div class="vstack gap-2">

                                <div class="vstack gap-2">
                                    <label>Users in this conversation</label>
                                    <ul class="list-group bg-color-lightest shadow-input-1">
                                        <li *ngFor="let user of conversationUsers;"
                                            class="list-group-item bg-transparent">
                                            {{ user.first_name }} {{ user.last_name }}
                                        </li>
                                    </ul>
                                </div>

                            </div>
                        </section>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
