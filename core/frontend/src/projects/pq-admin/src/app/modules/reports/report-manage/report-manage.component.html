<!-- Report Rejected Reason Popup -->
<div class="modal fade" id="rejectReasonPopup" tabindex="-1" data-bs-backdrop="static" style="z-index: 99999;">
    <div class="modal-dialog">
        <div class="modal-content border-0 shadow-lg h-100">
            <div class="modal-header py-2 border-0 hstack gap-3 align-items-center justify-content-between" #dialogHandle>
                <h1 class="modal-title fs-5">Reason for rejection</h1>
                <div class="hstack gap-3 align-items-center">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
            </div>
            <div class="modal-body">
                <pq-textbox label="Please specify reason for rejecting the report"
                    [maxLength]="150"
                    [textBoxContent]="rejectReason" 
                    helper="Give a reason with not more than 150 letters"
                    (outputValue)="rejectReason = $event"></pq-textbox>
            </div>
            <div class="modal-footer hstack gap-1 justify-content-end p-0 border-0 bg-transparent">
                <pq-button data-bs-dismiss="modal" (clickEvent)="rejectReport()">Reject Report</pq-button>
            </div>
        </div>
    </div>
</div>

<!-- Report Rejected Reason Popup -->
<div class="modal fade" id="deleteReasonPopup" tabindex="-1" data-bs-backdrop="static" style="z-index: 99999;">
    <div class="modal-dialog">
        <div class="modal-content border-0 shadow-lg h-100">
            <div class="modal-header bg-danger text-light py-2 border-0 hstack gap-3 align-items-center justify-content-between pe-2" #dialogHandle>
                <h1 class="modal-title fs-5">Reason for deletion</h1>
                <button type="button" class="btn text-light hstack align-items-center justify-content-center px-1" data-bs-dismiss="modal" aria-label="Close">
                    <span class="material-symbols-rounded">close</span>
                </button>
            </div>
            <div class="modal-body">
                <pq-textbox label="Please specify reason for rejecting the report"
                    [maxLength]="150"
                    [textBoxContent]="deleteReason" 
                    helper="Give a reason with not more than 150 letters"
                    (outputValue)="deleteReason = $event"></pq-textbox>
            </div>
            <div class="modal-footer hstack gap-1 justify-content-end p-0 border-0 bg-transparent">
                <pq-button data-bs-dismiss="modal" (clickEvent)="deleteReport()">Delete Report</pq-button>
            </div>
        </div>
    </div>
</div>
