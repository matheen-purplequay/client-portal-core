<!-- Needs scope: tbl, statusLabel, clearStatus(), chips, removeChip(key), openDrawer(), refresh(), refreshing -->
<div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 px-3 py-2">
  <div class="relative">
    <div class="text-[11px] font-bold text-slate-600">Show Columns</div>
    <button class="flex items-center gap-1 text-[11px] font-semibold" @click.stop="tbl.colsOpen = !tbl.colsOpen">
      <span x-text="tbl.selectedCount + '/' + tbl.columns.length + ' selected'"></span><span class="msym !text-[16px]">expand_more</span></button>
    <div x-show="tbl.colsOpen" @click.outside="tbl.colsOpen = false" x-transition class="absolute left-0 z-30 mt-1 max-h-72 w-60 overflow-y-auto rounded-lg bg-white p-2 shadow-xl ring-1 ring-black/5">
      <template x-for="c in tbl.columns" :key="c.key">
        <label class="flex items-center gap-2 rounded px-2 py-1 text-[13px] hover:bg-slate-50"><input type="checkbox" class="rounded border-slate-300 text-brand focus:ring-brand" x-model="tbl.visible[c.key]"><span x-text="c.label"></span></label>
      </template>
    </div>
  </div>

  <div class="flex flex-wrap items-center gap-2">
    <!-- Selected Filters: status chip + one removable chip per active filter (dev FilterSummary) -->
    <div class="flex flex-wrap items-center gap-2 text-[11px] leading-tight text-slate-500">
      <div class="text-right"><div>Selected</div><div class="text-[13px]">Filters</div></div>
      <div x-show="statusLabel" class="flex items-center gap-2 rounded-md bg-slate-100 px-2 py-1">
        <div><div class="text-[11px]">Status</div><div class="text-[13px] font-semibold text-navy" x-text="statusLabel"></div></div>
        <button x-show="status !== 'live'" @click="clearStatus()" class="text-slate-400 hover:text-brand"><span class="msym !text-[16px]">close</span></button>
      </div>
      <template x-for="c in chips" :key="c.key">
        <div class="flex items-center gap-2 rounded-md bg-slate-100 px-2 py-1">
          <div><div class="text-[11px]" x-text="c.label"></div><div class="text-[13px] font-semibold text-navy" x-text="c.value"></div></div>
          <button @click="removeChip(c.key)" class="text-slate-400 hover:text-brand"><span class="msym !text-[16px]">close</span></button>
        </div>
      </template>
    </div>
    <div class="relative flex items-center rounded-full bg-slate-100 px-1">
      <button class="btn-soft !text-slate-700" @click="openDrawer()"><span class="msym !text-[16px]">filter_list</span>Filters</button>
      <button class="btn-soft !text-slate-700" @click="refresh()"><span class="msym !text-[16px]" :class="refreshing && 'animate-spin'">sync</span><span x-text="refreshing ? 'Refreshing...' : 'Refresh'"></span></button>
      <button class="btn-soft !text-slate-700" @click="CP.download('Jobs list')"><span class="msym !text-[16px]">download</span>Download</button>
    </div>
    <label class="flex items-center gap-2 rounded-full bg-slate-100 px-3 py-1.5"><span class="msym text-slate-500">search</span>
      <input type="search" placeholder="Search..." class="w-44 border-0 bg-transparent p-0 text-[13px] focus:ring-0" x-model="tbl.q" @input="tbl.reset()"></label>
  </div>
</div>
