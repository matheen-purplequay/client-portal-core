  <style>
    :root {
      --header-height: 62px;

      /* Colors */
      --light-color: #F5F5F5;
      --light-color-rgb: 245, 245, 245;
      --dark-color: #43425D;
      --dark-color-rgb: 67, 66, 93;
      --darker-color: #272636;
      --darker-color-rgb: 39, 38, 54;
      --darkest-color: #1b1a27;
      --darkest-color-rgb: 27, 26, 39;
      --light-grey-color: #F0F0F7;
      --white-color: #FFFFFF;
      --white-color-rgb: 255, 255, 255;
      --black-color: #000000;
      --black-color-rgb: 0, 0, 0;
      --light-green-color: #D7E7FF;
      --gold-color: #ffa534;
      --gold-color-rgb: 255,165,52;

      /* Status Colors */
      --awaiting: #FFA600;
      --closed: #FF562F;
      --hold: #37CB89;
      --inprogress: #2FC1FF;

      /* Shadows */
      --text-shadow-small: 0 .125rem .25rem rgba(var(--dark-color), .075);
      --text-shadow: 0 .5rem 1rem rgba(var(--dark-color), .15);
      --text-shadow-large: 0 1rem 3rem rgba(var(--dark-color), .175);

    }
  </style>
