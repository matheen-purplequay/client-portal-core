<section class="container">
    <div class="row">
        <div class="col-sm-1"></div>
        <div class="col-sm-10">
            <div class="vstack justify-content-center align-items-center">
                <div class="h4 mb-0">Invoices</div>
                <!-- <div class="small">Lorem ipsum dolor sit amet consectetur, adipisicing elit. Voluptatem rerum iste fugiat, facilis laboriosam aspernatur dolores.</div> -->
            </div>
        </div>
        <div class="col-sm-1"></div>
    </div>
</section>

<div *ngIf="!otpVerified">
    <pq-section-card sectionTitle="Verify OTP to continue" sectionSubtitle="OTP has been sent to your email address. Please check your email.">
        <div body>
            <div class="row py-5">
                <div class="col-sm-4">
                    <div class="vstack gap-2 justify-content-center align-items-start">
                        <pq-textbox 
                            type="text" label="OTP" placeholder="Your OTP here" helper="4 digits OTP" 
                            (outputValue)="otp = convertToNumber($event)"
                            [required]="true"></pq-textbox>
                        <div class="hstack gap-2">
                            <pq-button buttonClass="px-4" (clickEvent)="verifyOTP()">Verify OTP</pq-button>
                            <pq-button buttonClass="px-4" buttonStyle="outline_primary">Resend OTP</pq-button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </pq-section-card>
</div>

<div *ngIf="otpVerified">
    <pq-section-card sectionTitle="FY {{ fy }}" [clipContents]="false" [enableSettings]="false" cardHeaderClass="pe-2">
        <div actions class="hstack gap-2">
            <pq-dropdown text="September" [setOptionAsText]="true"
                class="disabled"
                dropDownType="advanced" 
                [options]="reportMonths" [keys]="{ key: 'index', value: 'name' }"
                [hideError]="true"></pq-dropdown>
    
            <pq-dropdown text="Choose a year" [setOptionAsText]="true"
                dropDownType="simple" 
                class="disabled"
                [options]="reportYears"
                [hideError]="true"></pq-dropdown>
        </div>
    
        <div body>
            <table style="width: 100%;">
                <thead>
                    <th class="px-3">Invoice Number</th>
                    <th>Invoice name</th>
                    <th>Date</th>
                    <th class="px-3 text-end">Actions</th>
                </thead>
                <tbody>
                    <tr *ngFor="let report of invoices">
                        <td>{{ report.invoice_number }}</td>
                        <td>{{ report.name }}</td>
                        <td>{{ report.date }}</td>
                        <td>
                            <div class="hstack gap-2 justify-content-end">
                                <pq-button (clickEvent)="downloadReport(report.file)">Download Report</pq-button>
                                <pq-button buttonStyle="outline_primary" (clickEvent)="previewReport(report.file)"
                                    data-bs-toggle="modal" data-bs-target="#pdfPopup">View Report</pq-button>
                            </div>
                        </td>
                    </tr>
                    <tr *ngIf="invoices.length <= 0">
                        <td colspan="4">
                            <div class="py-3 text-center small opacity-70 fst-italics">No invoices available yet...</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </pq-section-card>
</div>



<!-- Modal -->
<div class="modal fade" id="pdfPopup" tabindex="-1" data-bs-backdrop="static" style="z-index: 99999;">
    <div class="modal-dialog modal-xl" style="height: 90%">
        <div class="modal-content border-0 shadow-lg h-100">
            <div class="modal-header py-2">
                <h1 class="modal-title fs-5">Report Preview</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-0 rounded-2 overflow-hidden">
                <embed class="d-block" [src]="pdfURL" width="100%" height="100%" type="application/pdf">
            </div>
        </div>
    </div>
</div>
