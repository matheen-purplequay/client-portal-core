<div x-data="jobStatusPage">
  <div x-show="loading" class="py-24 text-center text-sm text-slate-400">Loading…</div>
  <template x-if="!loading">
    <div>
      <!-- page header -->
      <div class="mb-4 flex flex-wrap items-start justify-between gap-3">
        <div class="flex items-center gap-3">
          <span class="msym !text-[44px] text-slate-500">work_outline</span>
          <div>
            <h1 class="text-xl font-semibold leading-tight">Job Status</h1>
            <p class="text-[11px] text-slate-500">Use SHIFT + Click to open job details in background tab</p>
          </div>
        </div>
        <div class="flex items-center gap-5">
          <div class="inline-flex overflow-hidden rounded-md border border-slate-300 bg-white shadow">
            <template x-for="v in verticals" :key="v.code">
              <button class="border-r border-slate-200 px-3 py-1.5 text-[13px] font-medium last:border-0" :class="vertical === v.title ? 'bg-[#dbe6f5] text-navy' : 'text-slate-700 hover:bg-slate-50'" @click="setVertical(v.title)" x-text="v.title"></button>
            </template>
          </div>
          <div class="inline-flex rounded-lg bg-white p-1 text-xs font-semibold shadow">
            <button class="rounded-md px-3 py-1" :class="mode === 'live' ? 'bg-brand-lighter text-brand' : 'text-slate-500'" @click="mode = 'live'">Live Data</button>
            <button class="rounded-md px-3 py-1" :class="mode === 'report' ? 'bg-brand-lighter text-brand' : 'text-slate-500'" @click="mode = 'report'">Report</button>
          </div>
        </div>
      </div>

      <!-- status strip -->
      <div class="mx-auto mb-2 flex w-fit max-w-full overflow-x-auto rounded-md bg-white text-slate-600 shadow">
        <div class="w-[92px] shrink-0 px-2 py-1 text-[11px] leading-tight">Jobs status as of Today<div class="text-[13px] text-slate-800" x-text="todayLabel"></div></div>
        <template x-for="t in tiles" :key="t.key">
          <button class="flex w-[86px] shrink-0 flex-col justify-between border-l border-slate-100 px-2 py-1 text-left text-[11px] leading-tight hover:brightness-95" :class="[t.tone, status === t.key && 'outline outline-2 -outline-offset-2 outline-brand']" @click="mode = 'live'; setStatus(t.key)">
            <span x-text="t.label"></span><span class="self-end text-[15px] text-slate-800" x-text="count(t.key)"></span></button>
        </template>
        <button class="flex w-[86px] shrink-0 flex-col justify-between border-l border-slate-100 px-2 py-1 text-left text-[11px] leading-tight" :class="status === 'live' && 'outline outline-2 -outline-offset-2 outline-brand'" @click="mode = 'live'; setStatus('live')">
          <span>Total Live Jobs</span><span class="text-[15px] text-slate-800" x-text="liveCount"></span></button>
        <button class="flex w-[86px] shrink-0 flex-col justify-between border-l border-slate-100 bg-slate-50 px-2 py-1 text-left text-[11px] leading-tight" :class="status === 'all' && 'outline outline-2 -outline-offset-2 outline-brand'" @click="mode = 'live'; setStatus('all')">
          <span>Total All Jobs</span><span class="text-[15px] text-slate-800" x-text="vJobs.length"></span></button>
      </div>
      <div x-component="'legends'"></div>

      <!-- REPORT MODE -->
      <div x-show="mode === 'report'" class="mt-6">
        <div class="card overflow-x-auto p-4">
          <h3 class="mb-3 font-semibold">Work status by partner · <span x-text="vertical"></span></h3>
          <table class="tbl w-full">
            <thead><tr><th>Work status</th><template x-for="p in report.partners"><th x-text="p"></th></template><th>Total</th></tr></thead>
            <tbody><template x-for="r in report.rows" :key="r.label"><tr><td class="font-semibold" x-text="r.label"></td>
              <template x-for="c in r.cells"><td x-text="c"></td></template><td class="font-bold" x-text="r.cells.reduce((a, b) => a + b, 0)"></td></tr></template></tbody>
          </table>
        </div>
      </div>

      <!-- LIVE DATA -->
      <div x-show="mode === 'live'" class="mt-4">
        <!-- folder tabs -->
        <div class="ml-4 flex items-end gap-1">
          <button class="rounded-t-lg px-4 py-2 text-left text-[11px] font-bold leading-tight" :class="active === 'list' ? 'bg-brand text-white' : 'bg-slate-200 text-slate-600'" @click="active = 'list'">Jobs List<br><span x-text="vertical"></span></button>
          <template x-for="(id, i) in open" :key="id">
            <div class="flex items-center gap-2 rounded-t-lg px-3 py-2 text-[11px] font-bold leading-tight" :class="active === id ? 'bg-navy text-white' : 'bg-slate-300 text-slate-700'">
              <button class="max-w-[170px] truncate text-left" @click="active = id"><span x-text="(i + 1) + '. ' + jobOf(id).job_name"></span><br><span class="font-semibold opacity-80" x-text="'FY - JY ' + jobOf(id).job_year"></span></button>
              <button @click="closeJob(id)"><span class="msym !text-[16px]">close</span></button>
            </div>
          </template>
        </div>

        <!-- jobs list -->
        <div x-show="active === 'list'" class="rounded-2xl border border-brand bg-white">
          <div x-component="'table-toolbar'"></div>
          <div class="overflow-x-auto">
            <table class="tbl min-w-full">
              <thead><tr><template x-for="c in tbl.cols" :key="c.key"><th @click="c.key !== '#' && tbl.sortBy(c.key)"><span x-text="c.label"></span><span x-show="tbl.sortKey === c.key" class="text-[9px]" x-text="tbl.dir > 0 ? ' ▲' : ' ▼'"></span></th></template></tr></thead>
              <tbody>
                <template x-for="(r, i) in tbl.slice" :key="r.job_id">
                  <tr><template x-for="c in tbl.cols" :key="c.key"><td :class="c.link && 'link font-medium'" @click="c.link && openJob(r, $event)" x-text="c.key === '#' ? tbl.from + i : cell(r, c)"></td></template></tr>
                </template>
              </tbody>
            </table>
            <div x-show="!tbl.total" class="py-10 text-center text-sm text-slate-400">No jobs match the current filters.</div>
          </div>
          <div x-component="'pagination-status'"></div>
        </div>

        <!-- job detail -->
        <template x-if="active !== 'list' && job">
          <div class="fade-in overflow-hidden rounded-2xl border border-navy bg-white">
            <div class="flex flex-wrap items-stretch border-b">
              <button class="m-3 flex items-center gap-1 rounded-full bg-slate-100 px-4 py-1.5 text-[15px] font-medium hover:bg-slate-200" @click="closeJob(active)"><span class="msym">close</span>Close</button>
              <div class="border-l px-4 py-2"><div class="text-lg font-bold text-navy" x-text="job.job_name"></div><div class="text-[11px] font-bold" x-text="'Last Modified ' + D(job.last_modified)"></div></div>
              <div class="flex items-center gap-3 border-l px-4"><span class="msym !text-[38px]">badge</span><span class="text-xs" x-text="job.associate"></span></div>
              <div class="border-l px-4 py-2"><div class="text-[11px] text-slate-500">Job Status</div><div class="text-[15px] font-medium" x-text="job.work_status"></div></div>
              <div class="ml-auto flex items-center border-b-2 border-brand px-4 text-brand"><div class="text-center text-xs font-bold"><span class="msym block">error_outline</span>Information</div></div>
            </div>

            <div class="bg-[#dfe5ef] px-6 py-4">
              <h3 class="mb-3 text-lg font-semibold text-slate-600">Job Timeline</h3>
              <div class="flex flex-nowrap items-center gap-2 overflow-x-auto pb-3">
                <template x-for="(t, i) in job.timeline" :key="i">
                  <div class="flex shrink-0 items-center gap-2">
                    <div x-show="i > 0" class="flex items-center gap-2 rounded-full bg-white px-3 py-1.5 text-sm shadow"><b x-text="gap(i)"></b> day<span class="msym rounded-full bg-slate-400 text-white !text-[18px]">arrow_forward</span></div>
                    <div class="min-w-[170px] rounded-md bg-white px-3 py-2 shadow" :class="i === job.timeline.length - 1 && 'border-b-2 border-navy'"><div class="text-sm font-semibold" x-text="t.status"></div><div class="mt-2 text-right text-sm text-slate-600" x-text="D(t.on)"></div></div>
                  </div>
                </template>
              </div>
            </div>

            <div class="px-6 py-5">
              <h3 class="mb-3 flex items-center gap-2 text-lg font-semibold text-slate-600"><span class="msym">work_outline</span>Basic Details</h3>
              <div class="grid grid-cols-2 gap-4 text-sm md:grid-cols-5">
                <template x-for="f in [['Group Job Name', job.group_job_name],['Nature of Job', job.nature_of_job],['Received Date', D(job.received_date)],['Commenced Date', D(job.commenced_date)],['Received From', job.received_from]]">
                  <div><div class="text-[13px] text-slate-400" x-text="f[0]"></div><div class="font-medium" x-text="f[1]"></div></div></template>
              </div>
            </div>

            <div class="grid gap-6 border-t px-6 py-5 lg:grid-cols-2">
              <div class="space-y-6">
                <div><h3 class="mb-2 flex items-center gap-2 text-lg font-semibold text-slate-600"><span class="msym">account_balance</span>Financial Information</h3>
                  <div class="flex gap-6"><div class="w-40"><div class="text-[13px] text-slate-400">Job ID</div><div class="border-b bg-slate-50 px-2 py-1 text-sm" x-text="job.job_id"></div></div>
                  <div class="w-56"><div class="text-[13px] text-slate-400">Job Status</div><div class="border-b bg-slate-50 px-2 py-1 text-sm" x-text="job.work_status"></div></div></div></div>
                <div><h3 class="mb-2 flex items-center gap-2 text-lg font-semibold text-slate-600"><span class="msym">attach_money</span>Budget Details</h3>
                  <div class="max-w-sm"><div class="mb-1 flex justify-between text-sm"><span x-text="job.actual_hours + ' of ' + job.budget_hours + ' hrs'"></span><span class="font-semibold" x-text="pct(job) + '%'"></span></div>
                  <div class="h-2 rounded-full bg-slate-100"><div class="h-2 rounded-full" :class="pct(job) >= 100 ? 'bg-red-600' : 'bg-navy'" :style="'width:' + pct(job) + '%'"></div></div></div></div>
                <div><h3 class="mb-2 flex items-center gap-2 text-lg font-semibold text-slate-600"><span class="msym">work_outline</span>Job Details</h3>
                  <div class="grid grid-cols-2 gap-3 text-sm sm:grid-cols-3">
                    <template x-for="f in [['Partner', job.partner],['Director', job.director],['Manager', job.manager],['Reviewer', job.reviewer],['Financial Year', job.financial_year],['Due Date', D(job.due_date)]]">
                      <div><div class="text-[13px] text-slate-400" x-text="f[0]"></div><div class="font-medium" x-text="f[1]"></div></div></template></div></div>
              </div>

              <div>
                <h3 class="mb-2 flex items-center gap-2 text-lg font-semibold text-slate-600"><span class="msym">chat_bubble_outline</span>Instructions</h3>
                <div class="overflow-hidden rounded-lg border bg-slate-50">
                  <div class="flex items-center justify-between border-b bg-white px-3 py-2">
                    <button class="flex items-center gap-2 text-sm text-brand disabled:opacity-60" :disabled="priority[active]" @click="requestPriority()"><span class="msym">error_outline</span><span x-text="priority[active] ? 'Priority requested' : 'Request to mark as priority'"></span></button>
                    <div class="flex gap-4 text-slate-500"><span class="msym border-b-2 border-brand pb-1 text-brand">chat</span><span class="msym">menu_book</span><span class="msym">account_circle</span></div>
                  </div>
                  <div class="grid min-h-[210px] sm:grid-cols-2">
                    <div class="flex flex-col justify-between border-r p-3 text-sm">
                      <div class="space-y-2">
                        <div x-show="!(instr[active] || []).length" class="pt-6 text-center text-slate-500">No instructions found<br>Send new instruction to begin</div>
                        <template x-for="m in (instr[active] || [])"><div class="rounded-lg bg-brand-light p-2"><div x-text="m.text"></div><div class="mt-1 text-right text-[11px] text-slate-500" x-text="CP.fmt.dt(m.at)"></div></div></template>
                      </div>
                      <div class="mt-3 flex items-center gap-2"><input class="field flex-1" placeholder="Type an instruction…" x-model="newInstr" @keydown.enter="sendInstr()"><button class="btn-soft" @click="sendInstr()"><span class="msym">send</span></button></div>
                    </div>
                    <div class="p-3"><div class="text-sm font-bold">Standard Instructions</div><div class="mb-2 text-xs text-slate-500">Select an instruction to include it in the instruction field.</div>
                      <template x-for="s in standard"><button class="mb-2 flex w-full items-start gap-2 rounded-md bg-white p-2 text-left text-sm shadow-sm hover:shadow" @click="newInstr = s"><span class="msym !text-[16px] text-slate-400">chat_bubble_outline</span><span x-text="s"></span></button></template></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </template>
</div>
