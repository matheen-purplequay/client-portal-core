<pagination-template #p="paginationApi" [id]="config.id!" (pageChange)="emitPageChanged($event)">

    <div class="pagination">
        <div class="pagination-previous page-item" [class.disabled]="p.isFirstPage()">
            <a class="page-link color-dark border-0 hstack align-items-center" [ngClass]="{ 'disabled': p.isFirstPage() }" (click)="p.previous()">
                <span class="material-symbols-outlined">first_page</span>
            </a>
        </div>

        <li *ngFor="let page of p.pages" class="page-item" [class.current]="p.getCurrent() === page.value">
            <a class="page-link color-dark border-0" (click)="p.setCurrent(page.value)" *ngIf="p.getCurrent() !== page.value">
                <span>{{ page.label }}</span>
            </a>
            <a class="page-link border-0 bg-color-primary-lightest color-primary" *ngIf="p.getCurrent() === page.value">
                <span>{{ page.label }}</span>
            </a>
        </li>

        <div class="pagination-next page-item" [class.disabled]="p.isLastPage()">
            <a class="page-link color-dark border-0 hstack align-items-center" [ngClass]="{ 'disabled': p.isLastPage() }"(click)="p.next()">
                <span class="material-symbols-outlined">first_page</span>
            </a>
        </div>
    </div>

</pagination-template>
