<div x-data="content('client', 'team')" class="mx-auto max-w-[1100px]"><template x-if="data"><div>
<h1 class="mb-1 flex items-center gap-2 text-2xl font-semibold text-brand"><span class="msym !text-[28px]">groups</span>Team</h1><p class="mb-5 text-sm text-slate-500">The people delivering your work.</p>
<div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
  <template x-for="m in data" :key="m.email"><div class="card p-5 text-center">
    <span class="mx-auto grid h-14 w-14 place-items-center rounded-full text-lg font-semibold text-white" :class="m.group === 'Leadership' ? 'bg-brand' : 'bg-slate-500'" x-text="initials(m.name)"></span>
    <div class="mt-3 font-semibold" x-text="m.name"></div><div class="text-sm text-slate-500" x-text="m.role"></div>
    <div class="mt-1 text-xs text-slate-400" x-text="m.group"></div><a :href="'mailto:' + m.email" class="link mt-2 block text-xs" x-text="m.email"></a></div></template>
</div>
</div></template></div>
