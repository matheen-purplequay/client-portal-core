<div class="row">
    <div class="col-sm-12">
        <div class="reviewer-toolbar border-bottom py-2">
            <ng-container>
                <div class="hstack justify-content-between align-items-center">
                    <label class="hstack gap-1 align-items-center"><span class="material-symbols-outlined">info</span> {{ (reviewers && reviewers.length > 0)? 'Manage query reviewers' : 'To add new reviewer, select a user from the dropdown' }}</label>
                    <div class="hstack gap-2 align-items-center">
                        <pq-dropdown [options]="selfUsers" 
                            dropDownType="advanced" text="selfUsers.selectedSelfUser ? selfUsers.selectedSelfUser.name : 'Select user'" [hideError]="true"
                            [keys]="{key: 'id', value: 'name'}" 
                            (outputObject)="selfUsers.selectedSelfUser = $event;"></pq-dropdown>
                        <ng-container *ngIf="internalUsers.selectedUser && internalUsers.list.length > 0">
                            <pq-dropdown dropDownType="advanced" [text]="internalUsers.selectedUser.name" [hideError]="true"
                                [options]="internalUsers.list" [keys]="internalUsers.keys" (outputObject)="internalUsers.selectedUser = $event;"></pq-dropdown>
                            
                            <pq-button [isLoading]="addingReviewer" (clickEvent)="addReviewer()">Add</pq-button>
                        </ng-container>
                    </div>
                </div>
            </ng-container>
            <ng-container *ngIf="internalUsers.isGettingUsers">
                <div class="hstack gap-1 align-items-center justify-content-end">
                    <div class="spinner-border spinner-border-sm" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <label>Getting all internal users...</label>
                </div>
            </ng-container>
        </div>
    </div>
</div>
<div class="row">
    <div class="col-sm-12">
        <div style="height: 450px; overflow-y: auto;">
            <ng-container *ngIf="reviewers && reviewers.length === 0 && !gettingReviewers && !removingReviewer">
                <div class="hstack align-items-center justify-content-center p-4 text-muted">
                    <div class="fw-medium hstack gap-1 align-items-center justify-content-center">
                        <span class="material-symbols-rounded">info</span>
                        <span>No reviewers found.</span>
                    </div>
                </div>
            </ng-container>
            <ng-container *ngIf="!gettingReviewers && reviewers && reviewers.length > 0">
                <div *ngIf="removingReviewer" class="fw-medium hstack gap-1 align-items-center justify-content-center">
                    <div class="spinner-border spinner-border-sm" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <span>Removing reviewer...</span>
                </div>
                <ng-container *ngFor="let reviewer of reviewers; let index = index;">
                    <div class="vstack gap-1 border-bottom">
                        <div class="hstack gap-1 align-items-center justify-content-between py-2">
                            <div class="hstack gap-2 align-items-center">
                                <img class="image h-40 rounded-pill" src="/assets/images/profile_placeholder.png" alt="">
                                <div>
                                    <div class="fs-6 fw-semibold">{{ reviewer.name }}</div>
                                    <div class="fw-medium opacity-75">{{ reviewer.email }}</div>
                                </div>
                            </div>
                            <div>
                                <pq-button buttonStyle="link" buttonContentClass="hstack" [isDisabled]="removingReviewer" (clickEvent)="removeReviewer(reviewer.id)">
                                    <span class="material-symbols-rounded">delete_forever</span>
                                </pq-button>
                            </div>
                        </div>
                    </div>
                </ng-container>
            </ng-container>
            <ng-container *ngIf="gettingReviewers">
                <div class="hstack align-items-center justify-content-center p-4">
                    <div class="fw-medium hstack gap-1 align-items-center justify-content-center">
                        <div class="spinner-border spinner-border-sm" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <span>Getting all reviewers...</span>
                    </div>
                </div>
            </ng-container>
        </div>
    </div>
</div>
