<div x-data="landingPage">
  <div x-show="loading" class="py-24 text-center text-sm text-slate-400">Loading…</div>
  <template x-if="!loading">
    <div>
      <div class="mb-3 flex items-start justify-between gap-3">
        <div>
          <h1 class="text-base font-bold leading-tight text-slate-800" x-text="'Good day, ' + user.first_name"></h1>
          <p class="text-[11px] text-slate-500" x-text="CP.fmt.weekday(CP.TODAY) + ', ' + CP.fmt.long(CP.TODAY)"></p>
        </div>
        <!-- vertical filter: same segmented control as the Jobs page (verticals pill group), placeholder only -->
        <div class="inline-flex shrink-0 overflow-hidden rounded-md border border-slate-300 bg-white shadow-sm">
          <template x-for="v in verticals" :key="v.code">
            <button class="border-r border-slate-200 px-3 py-1 text-xs font-medium last:border-0" :class="vertical === v.title ? 'bg-[#e8ebf5] text-navy' : 'text-slate-700 hover:bg-slate-50'" @click="setVertical(v.title)" x-text="v.title"></button>
          </template>
        </div>
      </div>

      <!-- rows of panels sized by card count (1+6 | 7+5 | 3 | 4+3 units) so each row spans the full width and cards match across rows -->
      <div class="space-y-3">
       <template x-for="(row, ri) in layoutRows" :key="ri">
        <div class="flex flex-wrap items-stretch gap-3">
        <template x-for="s in row" :key="s.t">
          <section class="max-w-full rounded-xl border border-slate-300 bg-slate-100 p-3 shadow" :style="'flex: ' + s.cards.length + ' 1 ' + (s.cards.length * 112 + 24) + 'px'">
            <button class="mb-2 flex items-center gap-2 text-[12px] font-extrabold uppercase tracking-wide text-slate-800 hover:text-brand" @click="go(s.r)"><span class="msym !text-[16px] text-brand" x-text="s.icon"></span><span x-text="s.t"></span><span class="msym !text-[13px] opacity-60">arrow_forward</span></button>
            <div class="flex flex-wrap gap-2">
              <template x-for="c in s.cards" :key="c.l">
                <button class="relative flex min-h-[52px] min-w-[104px] flex-1 basis-[104px] items-center justify-between gap-2 overflow-hidden rounded-lg border-l-4 bg-white py-2 pl-2.5 pr-2 text-left shadow-sm transition hover:shadow" :class="c.tone" @click="go(s.r)">
                  <span class="text-[9px] font-semibold uppercase leading-tight tracking-wide" x-text="c.l"></span>
                  <span class="text-right leading-none">
                    <span class="block text-sm font-bold" x-text="c.v"></span>
                    <span x-show="c.u" class="block text-[8px] font-medium uppercase leading-tight text-slate-400" x-text="c.u"></span>
                  </span>
                </button>
              </template>
            </div>
          </section>
        </template>
        <!-- Yesterday's Workflow sits beside the Daily Planner section in the first row -->
        <template x-if="ri === 0">
          <section class="max-w-full rounded-xl border border-slate-300 bg-slate-100 p-3 shadow" style="flex: 6 1 696px">
            <div class="mb-2 flex flex-wrap items-center justify-between gap-x-3">
              <span class="flex items-center gap-2 text-[12px] font-extrabold uppercase tracking-wide text-slate-800"><span class="msym !text-[16px] text-brand">history</span>Yesterday's Workflow</span>
              <span class="text-[10px] text-slate-500" x-text="D(addYesterday) + ' · ' + yesterdayRows.filter((r) => r.moved).length + ' of ' + yesterdayRows.length + ' moved on'"></span>
            </div>
            <div class="max-h-[132px] overflow-auto rounded-lg bg-white shadow-sm">
              <table class="tbl w-full"><thead class="sticky top-0 bg-white"><tr><th class="!cursor-default !py-1">Job</th><th class="!cursor-default !py-1">Yesterday</th><th class="!cursor-default !py-1">Current Status</th></tr></thead>
                <tbody><template x-for="r in yesterdayRows" :key="r.job_id"><tr>
                  <td class="max-w-[220px] truncate !py-1 font-medium" :title="r.job_description + ' · ' + r.name_a + ' · ' + r.time_will_take" ><a class="link" @click="CP.showJob(r.job_id)" x-text="r.job_description"></a></td>
                  <td class="!py-1 text-slate-500" x-text="r.workstatus"></td>
                  <td class="!py-1"><span class="chip" :class="r.moved ? 'bg-brand/10 text-brand' : 'bg-slate-100 text-slate-600'" x-text="r.current"></span><span x-show="r.moved" class="msym ml-1 !text-[14px] text-brand" title="Moved on since yesterday">trending_flat</span></td></tr></template></tbody></table>
              <div x-show="!yesterdayRows.length" class="py-4 text-center text-sm text-slate-400">No stand-up was logged yesterday.</div>
            </div>
          </section>
        </template>
        </div>
       </template>
      </div>
    </div>
  </template>
</div>
