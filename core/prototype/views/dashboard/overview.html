<div x-data="overviewPage">
  <div x-show="loading" class="py-24 text-center text-sm text-slate-400">Loading…</div>
  <template x-if="!loading">
    <div>
      <h1 class="mb-4 text-center text-2xl font-bold text-slate-800">Dashboard</h1>
      <div class="mb-5 flex justify-center">
        <div class="inline-flex flex-wrap overflow-hidden rounded-md border border-slate-300 bg-white shadow">
          <button class="border-r border-slate-200 px-4 py-1.5 text-[13px] font-medium" :class="vertical === '' ? 'bg-[#dbe6f5] text-navy' : 'text-slate-700 hover:bg-slate-50'" @click="vertical = ''">All</button>
          <template x-for="v in verticals" :key="v.code"><button class="border-r border-slate-200 px-4 py-1.5 text-[13px] font-medium last:border-0" :class="vertical === v.title ? 'bg-[#dbe6f5] text-navy' : 'text-slate-700 hover:bg-slate-50'" @click="vertical = v.title" x-text="v.title"></button></template>
        </div>
      </div>

      <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
        <template x-for="c in [
          { t: 'Jobs', icon: 'work_outline', route: '/dashboard/job-status', tone: 'text-brand', a: ['Open', s.open], b: ['Closed', s.closed] },
          { t: 'Production Report', icon: 'insights', route: '/dashboard/production-report', tone: 'text-green-700', a: ['Jobs This Month', s.prodJobs], b: ['Productive Hours', s.prodHours] },
          { t: 'Turnaround Report', icon: 'schedule', route: '/dashboard/turnaround-report', tone: 'text-indigo-700', a: ['Average TAT (Days)', s.avgTat], b: ['Total Closed Jobs', s.closed] },
          { t: 'Budget Overview', icon: 'account_balance_wallet', route: '/dashboard/budget-overview', tone: 'text-amber-700', a: ['Within Budget', s.within], b: ['Over Budget', s.over] },
          { t: 'Feedback', icon: 'feedback', route: '/dashboard/closed-jobs-feedback', tone: 'text-purple-700', a: ['Closed Jobs', s.fbClosed], b: ['Pending Feedback', s.fbPending] },
          { t: 'Movement', icon: 'swap_horiz', route: '/dashboard/movement', tone: 'text-cyan-700', a: ['New Jobs', s.newJobs], b: ['All Movement', s.allMoves] },
          { t: 'MOM', icon: 'event_note', route: '/dashboard/mom', tone: 'text-rose-700', a: ['Meetings This Month', s.meetings], b: null },
        ]" :key="c.t">
          <button class="card p-5 text-left transition hover:shadow-lg" @click="go(c.route)">
            <div class="mb-3 flex items-center gap-3"><span class="grid h-10 w-10 place-items-center rounded-lg bg-slate-100" :class="c.tone"><span class="msym" x-text="c.icon"></span></span><span class="text-lg font-bold" x-text="c.t"></span></div>
            <div class="flex gap-8">
              <div><div class="text-xs text-slate-500" x-text="c.a[0]"></div><div class="text-xl font-bold" x-text="c.a[1]"></div></div>
              <template x-if="c.b"><div><div class="text-xs text-slate-500" x-text="c.b[0]"></div><div class="text-xl font-bold" x-text="c.b[1]"></div></div></template>
            </div>
          </button>
        </template>
      </div>
    </div>
  </template>
</div>
