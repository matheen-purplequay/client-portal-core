<div x-data="content('client', 'profile')" class="mx-auto max-w-[1100px]"><template x-if="data"><div>
<h1 class="mb-1 flex items-center gap-2 text-2xl font-semibold text-brand"><span class="msym !text-[28px]">contact_support</span>Contact Us</h1><p class="mb-5 text-sm text-slate-500">We usually reply within one business day.</p>
<div class="grid gap-4 lg:grid-cols-3">
  <section class="card p-5 lg:col-span-2"><h3 class="mb-3 font-semibold">Send us a message</h3>
    <form class="space-y-3" @submit.prevent="send(); $el.reset()">
      <label class="block text-xs font-semibold text-slate-500">Topic<select class="field mt-1 block w-full" x-model="topic"><option>General</option><option>Billing</option><option>Access &amp; users</option><option>Technical issue</option></select></label>
      <label class="block text-xs font-semibold text-slate-500">Subject<input required class="field mt-1 block w-full"></label>
      <label class="block text-xs font-semibold text-slate-500">Message<textarea required rows="5" class="field mt-1 block w-full"></textarea></label>
      <button class="rounded-full bg-brand px-6 py-2 text-sm font-semibold text-white hover:bg-brand-dark">Send message</button></form></section>
  <section class="card space-y-3 p-5 text-sm"><h3 class="font-semibold">Get in touch</h3>
    <div><div class="text-[11px] uppercase text-slate-400">Account manager</div><div class="font-semibold" x-text="data.account_manager"></div></div>
    <div><div class="text-[11px] uppercase text-slate-400">Email</div><a class="link font-semibold" :href="'mailto:' + data.support_email" x-text="data.support_email"></a></div>
    <div><div class="text-[11px] uppercase text-slate-400">Phone</div><div class="font-semibold" x-text="data.support_phone"></div></div></section>
</div>
</div></template></div>
