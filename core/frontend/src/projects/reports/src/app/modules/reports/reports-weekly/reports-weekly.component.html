<section class="container">
    <div class="row">
        <div class="col-sm-1"></div>
        <div class="col-sm-10">
            <div class="vstack justify-content-center align-items-center">
                <div class="h4 mb-0">Weekly Delivery Report</div>
                <!-- <div class="small">Lorem ipsum dolor sit amet consectetur, adipisicing elit. Voluptatem rerum iste fugiat, facilis laboriosam aspernatur dolores.</div> -->
            </div>
        </div>
        <div class="col-sm-1"></div>
    </div>
</section>

<pq-section-card sectionTitle="FY {{ fy }}" [clipContents]="false" [enableSettings]="false" cardHeaderClass="pe-2">
    <div actions class="hstack gap-2">
        <pq-dropdown text="September" [setOptionAsText]="true"
            dropDownType="advanced" 
            [options]="reportMonths" [keys]="{ key: 'index', value: 'name' }"
            (outputObject)="currentMonth = $event; getReport();"
            [hideError]="true"></pq-dropdown>

        <pq-dropdown text="2023" [setOptionAsText]="true"
            dropDownType="simple" 
            class="disabled"
            [options]="reportYears"
            (outputValue)="currentYear = parseInt($event); getReport();"
            [hideError]="true"></pq-dropdown>
    </div>

    <div body>
        <div *ngIf="isLoading" class="p-4 disabled text-center hstack gap-2 justify-content-center align-items-center">
            <div class="spinner-border spinner-border-sm" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            Loading connect reports...
        </div>
        <table *ngIf="!isLoading" style="width: 100%;">
            <thead>
                <th class="px-3">Report Name</th>
                <th>Month</th>
                <th>Page</th>
                <th class="px-3 text-end">Actions</th>
            </thead>
            <tbody>
                <tr *ngFor="let report of weeklyReports">
                    <td>{{ report.name }}</td>
                    <td>{{ report.month}}</td>
                    <td>{{ report.pages }}</td>
                    <td>
                        <div class="hstack gap-2 justify-content-end">
                            <pq-button (clickEvent)="downloadReport(report)">Download Report</pq-button>
                            <!-- <pq-button buttonStyle="outline_primary" (clickEvent)="previewReport(report)"
                                data-bs-toggle="modal" data-bs-target="#pdfPopup">View Report</pq-button> -->
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</pq-section-card>



<!-- Modal -->
<div class="modal fade" id="pdfPopup" tabindex="-1" data-bs-backdrop="static" style="z-index: 99999;">
    <div class="modal-dialog modal-xl" style="height: 90%">
        <div class="modal-content border-0 shadow-lg h-100">
            <div class="modal-header py-2">
                <h1 class="modal-title fs-5">Report Preview</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-0 rounded-2 overflow-hidden">
                <div *ngIf="isPDFLoading" class="p-4 disabled text-center hstack gap-2 justify-content-center align-items-center">
                    <div class="spinner-border spinner-border-sm" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    Loading PDF...
                </div>
                <embed *ngIf="!isPDFLoading" class="d-block" [src]="pdfURL" width="100%" height="100%" type="application/pdf">
            </div>
        </div>
    </div>
</div>
