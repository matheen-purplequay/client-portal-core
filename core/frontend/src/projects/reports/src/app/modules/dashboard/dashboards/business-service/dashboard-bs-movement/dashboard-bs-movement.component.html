<div *ngIf="userData && isTester">
    <dash-movement [attr.user-data]="userData | json" [selectedClientUser]="selectedClientUser"></dash-movement>
</div>

<div *ngIf="userData && !isTester">
    <dash-movement [attr.user-data]="userData | json" [selectedClientUser]="null"></dash-movement>
</div>
