<!DOCTYPE html>
<html lang="en">
<head>
<title>Login · Client Portal</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script src="../../assets/js/tailwind-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&family=EB+Garamond:wght@500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/app.css">
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
<script src="../../assets/js/core.js"></script>
</head>
<body class="auth-bg min-h-screen">
<div class="auth-fade relative flex min-h-screen items-stretch">
  <div class="flex flex-1 items-center justify-center px-6 py-8">
    <div class="w-full max-w-[492px]">
      <img src="../../assets/img/cs_logo.png" alt="Carisma Solutions" class="mx-auto h-8 w-auto">
      <div class="mb-6 text-center text-[42px] font-light leading-tight text-slate-600">Client Portal</div>
      <h1 class="text-center text-xl font-semibold text-slate-700">👋 Welcome</h1>
      <p class="mb-5 text-center text-xs text-slate-600">Please login into your account</p>
      <form id="form" class="space-y-4" novalidate>
        <label class="block text-[11px] font-semibold text-slate-500">Email
          <span class="relative mt-1 block"><input id="email" type="email" placeholder="Your email address" class="auth-input"><span class="msym absolute right-2 top-1/2 -translate-y-1/2 text-slate-400">alternate_email</span></span></label>
        <label class="block text-[11px] font-semibold text-slate-500">Password
          <span class="relative mt-1 block"><input id="password" type="password" placeholder="Your password" class="auth-input"><span class="msym absolute right-2 top-1/2 -translate-y-1/2 text-slate-400">key</span></span></label>
        <p id="error" class="hidden rounded bg-red-50 px-3 py-2 text-xs text-red-700"></p>
        <button class="w-full rounded-[4px] bg-brand py-2.5 text-[13px] font-bold text-white shadow-md hover:bg-brand-dark">Send OTP to Email</button>
        <p class="text-center text-[13px]"><a href="#" class="font-medium text-brand hover:underline">Forgot password?</a></p>
      </form>
      <div class="mt-8 text-center text-[11px] text-slate-500">
        <div class="font-semibold">For any enquiries contact<br><a class="border-b border-dashed border-slate-300 text-sky-600" href="mailto:clientportalsupport@carisma-solutions.com.au">clientportalsupport@carisma-solutions.com.au</a></div>
        <div class="mt-2 flex justify-between"><span>&copy; 2026 Purple Quay.</span><span>All rights reserved.</span></div>
      </div>
      <div class="mt-5 border-t pt-3">
        <p class="mb-2 text-center text-[10px] uppercase tracking-wide text-slate-400">Prototype · autofill demo credentials</p>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" data-fill="olivia.bennett@northwind.example" class="rounded-md border bg-white/80 px-3 py-1.5 text-left text-[11px] hover:bg-brand-lighter"><span class="block font-bold text-brand">Northwind Advisory</span><span class="text-slate-500">Business Services · SMSF · Bookkeeping</span></button>
          <button type="button" data-fill="daniel.reyes@harbourline.example" class="rounded-md border bg-white/80 px-3 py-1.5 text-left text-[11px] hover:bg-brand-lighter"><span class="block font-bold text-brand">Harbourline Wealth</span><span class="text-slate-500">Financial Planning · Bookkeeping</span></button>
        </div>
      </div>
    </div>
  </div>
  <div hx-get="../../components/auth-hero.html" hx-trigger="load" hx-swap="outerHTML"></div>
</div>
<script>
  const err = document.getElementById('error');
  document.querySelectorAll('[data-fill]').forEach((b) => b.onclick = () => { email.value = b.dataset.fill; password.value = 'Client@123'; err.classList.add('hidden'); });
  form.onsubmit = async (e) => {
    e.preventDefault();
    const r = await CP.login(email.value, password.value);
    if (!r.ok) { err.textContent = r.message; err.classList.remove('hidden'); return; }
    location.href = 'otp.html';
  };
</script>
</body>
</html>
